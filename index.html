/* ============================= "Who's in?" polls =============================
   The host makes a poll here and shares it to the WhatsApp group; friends tap the
   link and answer in the app. The app knows the whole roster, so it can list exactly
   who hasn't replied. Picking the winning slot ticks those players in for the match. */
function pollDefaultQ(){ return 'Who’s in for ' + SPORT.play + '?'; }
function pollEligible(){ return rosterPlayersArr().filter(p=>!p.unavailable && !p.guest); }
function pollVotesMap(){
  const p = S.poll, m = {};
  if(!p) return m;
  POLLVOTES.forEach(v=>{ if(v && v.pollId===p.id && findPlayer(v.playerId)) m[v.playerId] = v; });
  return m;
}
function pollAnswered(v){ return !!(v && (v.no || (v.slots||[]).length)); }
function pollVisible(){
  const p = S.poll;
  if(!p) return false;
  if(p.status!=='decided') return true;
  // a confirmed poll stays up until that match has been played and saved
  return !HISTORY.some(h=> String(h.date||'') > String(p.decidedAt||''));
}
function pollNeedsMyAnswer(){
  const me = getMyPlayerId();
  if(!me || !pollVisible() || S.poll.status!=='open') return false;
  return !pollAnswered(pollVotesMap()[me]);
}
function pollNoReply(){ const m = pollVotesMap(); return pollEligible().filter(p=>!pollAnswered(m[p.id])); }
// "Seen": the poll was on their screen but they haven't picked anything yet.
// Stored as an empty answer, so it needs no extra database rule.
function pollSeenOnly(){ const m = pollVotesMap(); return pollEligible().filter(p=>m[p.id] && !pollAnswered(m[p.id])); }
function markPollSeen(){
  const p = S.poll, me = getMyPlayerId();
  if(!p || !me || !pollVotesLoaded || pollSeenMarked.has(p.id) || !pollVisible()) return;
  pollSeenMarked.add(p.id);
  if(pollVotesMap()[me]) return;            // already seen or answered
  const vid = p.id + '__' + me;
  const doc = {pollId: p.id, playerId: me, slots: [], no: false, at: new Date().toISOString()};
  if(db) db.doc(squadPath('pollVotes/' + vid)).set(doc).catch(()=>{});
  else { POLLVOTES = POLLVOTES.concat([Object.assign({id: vid}, doc)]); localCommit(); }
}
// Links in shared messages must open on friends' phones, so they always point at the
// live site, even when the poll was made from a downloaded copy or a test page.
const SITE_URL = 'https://keeratbrar007.github.io/matchday-draft/';
function siteBase(){
  const live = /^https:$/.test(location.protocol) && /\.github\.io$/.test(location.hostname);
  return live ? location.origin + location.pathname.replace(/index\.html$/, '') : SITE_URL;
}
function pollLinkFor(poll, vote){ return siteBase() + '?g=' + encodeURIComponent(currentSquadId||'') + '&poll=' + encodeURIComponent(poll.id) + (vote ? '&vote=' + encodeURIComponent(vote) : ''); }
function pollLink(vote){ return S.poll ? pollLinkFor(S.poll, vote) : siteBase(); }
function infoToastHtml(){
  return infoToast ? `<div class="update-toast" role="status"><span>${esc(infoToast)}</span><button class="btn btn-sm" onclick="infoToast=null; render();">OK</button></div>` : '';
}
function showInfo(msg){ infoToast = msg; clearTimeout(infoTimer); infoTimer = setTimeout(()=>{ infoToast = null; render(); }, 6000); }
function applyPendingVote(){
  const pv = pendingVote; if(!pv) return;
  const me = getMyPlayerId(); if(!me || !pollVotesLoaded || (db && matchLoadedFor!==currentSquadId)) return;
  pendingVote = null;
  const p = S.poll;
  if(!p || !pollVisible() || (pv.poll && pv.poll !== p.id)){ showInfo('That poll has finished. Here’s the latest one.'); render(); return; }
  if(pv.vote === 'no'){
    pollAnswerNo();
    showInfo('✅ Saved: you can’t make it. Tap below to change.');
  }else{
    const o = p.opts.find(x=>x.id===pv.vote);
    if(!o){ render(); return; }
    const cur = pollVotesMap()[me];
    const slots = (cur && !cur.no) ? (cur.slots||[]).filter(x=>x!==o.id) : [];
    slots.push(o.id);
    castPollVote(me, slots, false);
    showInfo('✅ Saved: you’re in for ' + o.label + (p.opts.length>1 && p.status!=='decided' ? '. Tick any other times that work too.' : '.'));
  }
  render();
}
// api.whatsapp.com keeps emoji intact (the short wa.me address can turn them into "�")
function openWhatsApp(text){ window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(text), '_blank', 'noopener'); }
function isoDay(dt){ return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0'); }
function slotLabel(dt, part){ return dt.toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'}) + ' · ' + part; }
// The same weekday as last time, on or after today, and always later than last time's date.
function nextSameWeekday(isoD){
  const [y,m,dd] = isoD.split('-').map(Number), old = new Date(y, m-1, dd), now = new Date();
  const dt = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  while(dt.getDay() !== old.getDay()) dt.setDate(dt.getDate()+1);
  while(dt <= old) dt.setDate(dt.getDate()+7);
  return dt;
}
function repeatPollPlan(){
  const lp = SQUAD.lastPoll;
  if(!lp || !Array.isArray(lp.opts) || !lp.opts.length) return null;
  return {max: lp.max || null, q: lp.q || pollDefaultQ(), opts: lp.opts.map(o=> (o && o.d && o.part) ? {label: slotLabel(nextSameWeekday(o.d), o.part), d: isoDay(nextSameWeekday(o.d)), part: o.part} : {label: (o && o.label) || ''}).filter(o=>o.label)};
}
function repeatLastPoll(){
  if(!isHost()) return;
  const plan = repeatPollPlan(); if(!plan) return;
  pollDraft = {q: plan.q, opts: plan.opts.map(o=>o.label), custom:'', meta: {}, max: plan.max || ''};
  plan.opts.forEach(o=>{ if(o.d) pollDraft.meta[o.label] = {d:o.d, part:o.part}; });
  createPoll(true);
}
function pollPresetSlots(){
  const out = [], now = new Date();
  for(let d=0; d<5; d++){
    const dt = new Date(now.getFullYear(), now.getMonth(), now.getDate()+d);
    const day = dt.toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'});
    const rel = d===0 ? 'Today' : d===1 ? 'Tomorrow' : dt.toLocaleDateString(undefined, {weekday:'long'});
    ['Morning','Evening'].forEach(part=> out.push({label: slotLabel(dt, part), short: rel + ' ' + part.toLowerCase(), d: isoDay(dt), part}));
  }
  return out;
}
function openPollForm(){
  if(!isHost()) return;
  const lp = SQUAD.lastPoll;
  pollDraft = {q: pollDefaultQ(), opts: [], custom: '', max: (lp && 'max' in lp) ? (lp.max||'') : (S.format||6)*2}; pollFormErr = ''; pollFormOpen = true; render();
}
function togglePollDraftOpt(label){
  const i = pollDraft.opts.indexOf(label);
  if(i>=0) pollDraft.opts.splice(i,1); else if(pollDraft.opts.length < 8) pollDraft.opts.push(label);
  pollFormErr = ''; render();
}
let POLL_PRESETS = [];
function togglePollPreset(i){ const x = POLL_PRESETS[i]; if(!x) return; pollDraft.meta = pollDraft.meta || {}; pollDraft.meta[x.label] = {d:x.d, part:x.part}; togglePollDraftOpt(x.label); }
function removePollDraftOpt(i){ pollDraft.opts.splice(i,1); render(); }
function addPollDraftCustom(){
  const l = (pollDraft.custom||'').trim().slice(0,60);
  if(!l) return;
  if(!pollDraft.opts.includes(l) && pollDraft.opts.length < 8) pollDraft.opts.push(l);
  pollDraft.custom = ''; pollFormErr = ''; render();
}
// Every answer gets its own link: one tap opens the app and saves that answer.
function pollShareText(poll){
  const lines = [SPORT.icon + ' *' + poll.q + '*'];
  if(poll.opts.length > 1){
    lines.push('Tap every time that works for you:', '');
    poll.opts.forEach(o=>{ lines.push('🕒 *' + o.label + '*', pollLinkFor(poll, o.id), ''); });
    lines.push('❌ *No, can’t make it*', pollLinkFor(poll, 'no'));
  }else{
    lines.push('🗓 ' + poll.opts[0].label, '');
    lines.push('✅ *Yes, I’m in*', pollLinkFor(poll, poll.opts[0].id), '');
    lines.push('❌ *No*', pollLinkFor(poll, 'no'));
  }
  lines.push('', 'See who’s coming:', pollLinkFor(poll));
  return lines.join('\n');
}
function createPoll(share){
  if(!isHost()) return;
  if(!pollDraft.opts.length){ pollFormErr = 'Pick or type at least one time.'; render(); return; }
  const poll = {
    id: 'p' + Date.now().toString(36),
    q: (pollDraft.q||'').trim().slice(0,80) || pollDefaultQ(),
    opts: pollDraft.opts.map((label,i)=>Object.assign({id:'o'+(i+1), label}, ((pollDraft.meta||{})[label]) || {})),
    status: 'open', decided: null, createdAt: new Date().toISOString(), decidedAt: null,
    max: Number(pollDraft.max) > 0 ? Math.min(99, Math.round(Number(pollDraft.max))) : null
  };
  const patch = {poll};
  // only one time: nothing to pick, so it's confirmed straight away and every
  // Yes ticks that player in for the match (every No ticks them out)
  if(poll.opts.length===1){
    poll.status = 'decided'; poll.decided = poll.opts[0].id; poll.decidedAt = poll.createdAt;
    if(S.phase==='setup' || S.phase==='complete'){ patch.selectedIds = []; patch.rsvpLog = []; }
  }
  const old = S.poll;
  saveState(patch);
  // remember it, so next week is one tap
  saveSquadDoc(Object.assign({}, SQUAD, {lastPoll: {max: poll.max, q: poll.q, opts: poll.opts.map(o=> o.d ? {label:o.label, d:o.d, part:o.part} : {label:o.label})}}));
  // tidy away the previous poll's answers
  if(old && db) POLLVOTES.filter(v=>v.pollId===old.id).forEach(v=>db.doc(squadPath('pollVotes/'+v.id)).delete().catch(()=>{}));
  if(old && !db){ POLLVOTES = POLLVOTES.filter(v=>v.pollId!==old.id); }
  pollFormOpen = false; pollRegister = false; pollEndArm = false;
  if(share) openWhatsApp(pollShareText(poll));
  render();
}
/* ---- waitlist ----
   A poll can have a number of spots (poll.max). Once a time is confirmed, the first
   people to say yes fill the spots; anyone after that waits in the order they said yes,
   and moves in automatically when someone drops out. The order of S.selectedIds is the
   order people got in; the waitlist is everyone who said yes to the confirmed time but
   isn't in. Whoever's phone records a drop-out also moves the next person in (friends
   may already change selectedIds), and the host's phone tidies up anything missed. */
function pollMax(p){ p = p || S.poll; return (p && Number(p.max) > 0) ? Number(p.max) : 0; }
function pollWaitActive(){ const p = S.poll; return !!(p && p.status==='decided' && pollMax(p) && (S.phase==='setup' || S.phase==='complete')); }
function pollYesOrder(optId, exclude){
  return Object.values(pollVotesMap()).filter(v=>!v.no && (v.slots||[]).includes(optId) && v.playerId!==exclude)
    .sort((a,b)=> String(a.at||'').localeCompare(String(b.at||''))).map(v=>v.playerId);
}
function pollWaitlist(sel, exclude){
  const p = S.poll; if(!p || p.status!=='decided' || !pollMax(p)) return [];
  const inSet = new Set(sel || S.selectedIds || []);
  // A "Yes" older than that person's latest drop-out is stale: their "No" just hasn't
  // reached this phone yet (answers and the player list arrive separately).
  const lastOut = {}; (S.rsvpLog||[]).forEach(e=>{ if(e.a==='out') lastOut[e.id] = e.t; else if(e.a==='in') delete lastOut[e.id]; });
  const m = pollVotesMap();
  return pollYesOrder(p.decided, exclude).filter(id=>!inSet.has(id) && findPlayer(id) && !(lastOut[id] && String((m[id]||{}).at||'') <= String(lastOut[id])));
}
function waitPos(id){ const i = pollWaitlist().indexOf(id); return i<0 ? 0 : i+1; }
// move people up from the waitlist while there's room; returns the new list + log entries
function pollFillSpots(sel, exclude){
  const max = pollMax(); const out = sel.slice(), log = [], t = new Date().toISOString();
  if(!max) return {sel: out, log};
  const wl = pollWaitlist(out, exclude);
  while(out.length < max && wl.length){ const id = wl.shift(); out.push(id); log.push({id, a:'in', t, by:'waitlist'}); }
  return {sel: out, log};
}
let pollReconcileTimer = null;
function schedulePollReconcile(){
  if(!isHost() || !pollWaitActive() || pollReconcileTimer) return;
  const sel = S.selectedIds||[];
  if(sel.length >= pollMax() || !pollWaitlist().length) return;
  pollReconcileTimer = setTimeout(()=>{
    pollReconcileTimer = null;
    if(!isHost() || !pollWaitActive()) return;
    const cur = S.selectedIds||[];
    const f = pollFillSpots(cur);
    if(f.log.length) saveState({selectedIds: f.sel, rsvpLog: (S.rsvpLog||[]).concat(f.log).slice(-300)});
  }, 900);
}
function setPollMax(n){
  if(!isHost() || !S.poll) return;
  const max = n>0 ? Math.min(99, Math.round(n)) : null;
  saveState({poll: Object.assign({}, S.poll, {max})});
  saveSquadDoc(Object.assign({}, SQUAD, {lastPoll: Object.assign({}, SQUAD.lastPoll||{}, {max})}));
}
function castPollVote(playerId, slots, no, force){
  const p = S.poll;
  if(!p || !playerId || !findPlayer(playerId)) return;
  if(!isHost() && playerId !== getMyPlayerId()) return;   // friends answer only for themselves
  const vid = p.id + '__' + playerId;
  if(playerId === getMyPlayerId()) pollSeenMarked.add(p.id);   // an answer means seen; never overwrite it with a "seen" mark
  const now = new Date().toISOString();
  const doc = {pollId: p.id, playerId, slots: (slots||[]).filter(x=>p.opts.some(o=>o.id===x)), no: !!no, at: now};
  // still saying yes to something you'd already said yes to: you keep your place in the queue
  const prevV = pollVotesMap()[playerId];
  if(!doc.no && prevV && !prevV.no && prevV.at && (prevV.slots||[]).some(x=>doc.slots.includes(x))) doc.at = prevV.at;
  if(db){
    db.doc(squadPath('pollVotes/' + vid)).set(doc).catch(()=>{});
  }else{
    POLLVOTES = POLLVOTES.filter(v=>v.id!==vid).concat([Object.assign({id: vid}, doc)]);
    localCommit();
  }
  // once a time is confirmed, changing your answer ticks you in or out of the match
  if(p.status==='decided' && (S.phase==='setup' || S.phase==='complete')){
    const nowIn = !doc.no && doc.slots.includes(p.decided);
    const sel = S.selectedIds||[], isSel = sel.includes(playerId);
    const by = playerId===getMyPlayerId() ? 'self' : 'host', max = pollMax(p);
    if(nowIn && !isSel){
      // full: they wait their turn (the host can still squeeze someone in)
      if(!max || force || sel.length < max){
        const log = (S.rsvpLog||[]).concat([{id: playerId, a:'in', t: now, by}]).slice(-300);
        saveState({selectedIds: sel.concat([playerId]), rsvpLog: log});
      }
    }else if(!nowIn && isSel){
      const f = pollFillSpots(sel.filter(x=>x!==playerId), playerId);
      const log = (S.rsvpLog||[]).concat([{id: playerId, a:'out', t: now, by}], f.log).slice(-300);
      saveState({selectedIds: f.sel, rsvpLog: log});
    }
  }
  render();
}
function togglePollSlot(optId, pid){
  const id = pid || getMyPlayerId(); if(!id) return;
  const v = pollVotesMap()[id];
  let slots = (v && !v.no) ? (v.slots||[]).slice() : [];
  slots = slots.includes(optId) ? slots.filter(x=>x!==optId) : slots.concat([optId]);
  castPollVote(id, slots, false);
}
function pollSayNo(pid){
  const id = pid || getMyPlayerId(); if(!id) return;
  const v = pollVotesMap()[id];
  castPollVote(id, [], !(v && v.no));   // tapping again clears it
}
// "No": for a confirmed poll that means not coming to the confirmed time
function pollAnswerNo(pid){
  const id = pid || getMyPlayerId(); if(!id) return;
  castPollVote(id, [], true);
}
// for a single time (or the confirmed one): in / can't make it
function pollAnswerOne(optId, yes, pid){
  const id = pid || getMyPlayerId(); if(!id) return;
  const v = pollVotesMap()[id];
  let slots = (v && !v.no) ? (v.slots||[]).filter(x=>x!==optId) : [];
  if(yes) slots.push(optId);
  castPollVote(id, slots, !yes && !slots.length);
}
function decidePoll(optId){
  if(!isHost() || !S.poll) return;
  const m = pollVotesMap(), t = new Date().toISOString();
  const all = pollYesOrder(optId).filter(id=>findPlayer(id)), max = pollMax();
  const ins = max ? all.slice(0, max) : all;
  const patch = {poll: Object.assign({}, S.poll, {status:'decided', decided: optId, decidedAt: t})};
  if(S.phase==='setup' || S.phase==='complete'){
    patch.selectedIds = ins;
    patch.rsvpLog = ins.map(id=>({id, a:'in', t, by:'poll'}));
  }
  saveState(patch);
}
function reopenPoll(){ if(isHost() && S.poll) saveState({poll: Object.assign({}, S.poll, {status:'open', decided:null, decidedAt:null})}); }
function endPoll(){
  if(!isHost()) return;
  if(!pollEndArm){ pollEndArm = true; render(); return; }
  pollEndArm = false; pollRegister = false; saveState({poll:null});
}
function pollNamesFor(optId){
  const m = pollVotesMap();
  return Object.values(m).filter(v=>!v.no && (v.slots||[]).includes(optId)).map(v=>v.playerId);
}
function sharePollNudge(){
  const p = S.poll; if(!p) return;
  const names = pollNoReply().map(x=>x.name);
  if(!names.length) return;
  openWhatsApp('⏰ Still waiting on: ' + names.join(', ') + '\n\n' + pollShareText(p));
}
function sharePollConfirm(){
  const p = S.poll; if(!p || p.status!=='decided') return;
  const o = p.opts.find(x=>x.id===p.decided);
  const wlIds = pollWaitlist();
  const ins = pollNamesFor(p.decided).filter(id=>!wlIds.includes(id)).map(playerName);
  const m = pollVotesMap();
  const outs = pollEligible().filter(x=>pollAnswered(m[x.id]) && !(m[x.id].slots||[]).includes(p.decided)).map(x=>x.name);
  const quiet = pollNoReply().map(x=>x.name);
  const lines = ['✅ *Confirmed: ' + (o ? o.label : '') + '*', '', '*In (' + ins.length + (pollMax(p) ? '/' + pollMax(p) : '') + '):* ' + (ins.join(', ') || '–')];
  if(wlIds.length) lines.push('*⏳ Waitlist:* ' + wlIds.map((id,i)=>(i+1) + '. ' + playerName(id)).join(', ') + ' (you move in automatically if someone drops out)');
  if(outs.length) lines.push('*Can’t make it:* ' + outs.join(', '));
  const seenNames = new Set(pollSeenOnly().map(x=>x.name));
  const seenQ = quiet.filter(n=>seenNames.has(n)), unopenedQ = quiet.filter(n=>!seenNames.has(n));
  if(seenQ.length) lines.push('*Seen, no answer:* ' + seenQ.join(', '));
  if(unopenedQ.length) lines.push('*Not opened:* ' + unopenedQ.join(', '));
  lines.push('', 'Plans changed? Can’t make it any more:', pollLinkFor(p, 'no'), '', 'Now in:', pollLinkFor(p, p.decided));
  openWhatsApp(lines.join('\n'));
}
function renderPollCard(){
  const p = S.poll;
  if(!pollVisible()){
    return (isHost() && (S.phase==='setup' || S.phase==='complete')) ? `<div class="poll-cta">
      <button class="btn btn-primary" onclick="openPollForm()">📊 Ask who’s in</button>
      ${repeatPollPlan() ? `<button class="btn" onclick="repeatLastPoll()">🔁 Same as last week</button><span>${esc(repeatPollPlan().opts.map(o=>o.label).join(' / '))}</span>` : `<span>Make a poll, send it to the WhatsApp group, and answers come back here.</span>`}</div>` : '';
  }
  const m = pollVotesMap(), me = getMyPlayerId(), mine = me ? m[me] : null;
  const elig = pollEligible();
  const replied = elig.filter(x=>pollAnswered(m[x.id])).length;
  const max = pollMax(p), need = max || (S.format||6) * 2;
  const decided = p.status==='decided';
  const wl = decided ? pollWaitlist() : [], myWait = me ? wl.indexOf(me) + 1 : 0;
  const single = decided ? p.opts.find(o=>o.id===p.decided) : (p.opts.length===1 ? p.opts[0] : null);
  const optRow = (o)=>{
    let ids = pollNamesFor(o.id);
    if(decided && max) ids = ids.filter(id=>!wl.includes(id));
    const n = ids.length, over = (!decided && max && n > max) ? n - max : 0;
    const isMine = !!(mine && !mine.no && (mine.slots||[]).includes(o.id));
    const pct = Math.min(100, Math.round(100*n/Math.max(need,1)));
    const act = !me ? '' : (single ? `pollAnswerOne('${o.id}', true)` : `togglePollSlot('${o.id}')`);
    return `<div class="poll-opt yes-opt ${isMine?'mine':''} ${me?'tap':''}" ${act?`onclick="${act}" role="button" tabindex="0"`:''}>
      ${me ? `<span class="poll-tick">${isMine?'✓':''}</span>` : ''}
      <div class="poll-opt-main">
        <div class="poll-opt-label">${single ? '✅ Yes' + (decided ? ', I’m in' : '') : esc(o.label)}</div>

/* ============================= Backup & restore (host only) ============================= */
const BACKUP_KIND = 'matchday-draft-backup';
function toggleBackup(){ showBackup = !showBackup; restoreDraft = null; restoreArm = false; restoreBusy = ''; backupMsg = ''; render(); }
function lastBackupText(){
  let t = null; try{ t = localStorage.getItem('md_last_backup_' + currentSquadId); }catch(e){}
  if(!t) return 'Never backed up from this phone.';
  const days = Math.floor((Date.now() - new Date(t).getTime()) / 864e5);
  return 'Last backup from this phone: ' + (days<=0 ? 'today' : days===1 ? 'yesterday' : days + ' days ago') + '.';
}
async function buildBackup(){
  let history = HISTORY, rivals = RIVALS;
  if(db){
    // the live list stops at the latest 200 matches; a backup takes every one
    const hs = await db.collection(squadPath('history')).get();
    history = hs.docs.map(d=>Object.assign({id:d.id}, d.data()));
    const rs = await db.collection(squadPath('rivalries')).get();
    rivals = rs.docs.map(d=>Object.assign({id:d.id}, d.data()));
  }
  return {
    kind: BACKUP_KIND, version: 1, exportedAt: new Date().toISOString(),
    squad: {id: currentSquadId, name: currentSquadName()},
    roster: SQUAD, match: S, history, rivalries: rivals
  };
}
async function downloadBackup(){
  if(!isHost() || backupBusy) return;
  backupBusy = true; backupMsg = ''; render();
  try{
    const data = await buildBackup();
    const json = JSON.stringify(data, null, 1);
    const day = new Date().toISOString().slice(0,10);
    const safe = (currentSquadName()||'squad').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase() || 'squad';
    const name = 'matchday-backup-' + safe + '-' + day + '.json';
    const file = (typeof File==='function') ? new File([json], name, {type:'application/json'}) : null;
    const standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
    // installed iPhone apps can't download files, so hand it to the share sheet instead
    if(standalone && file && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Matchday Draft backup'});
    }else{
      const url = URL.createObjectURL(new Blob([json], {type:'application/json'}));
      const a = document.createElement('a'); a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
    }
    try{ localStorage.setItem('md_last_backup_' + currentSquadId, new Date().toISOString()); }catch(e){}
    backupMsg = '✅ Backup saved: ' + data.history.length + ' match' + (data.history.length===1?'':'es') + ', ' + ((data.roster.players||[]).length) + ' players.';
  }catch(e){
    backupMsg = (e && e.name==='AbortError') ? '' : '⚠️ The backup couldn’t be made. Check your connection and try again.';
  }
  backupBusy = false; render();
}
function validateBackup(d){
  if(!d || d.kind!==BACKUP_KIND || typeof d.version!=='number') return 'This isn’t a Matchday Draft backup file.';
  if(d.version > 1) return 'This backup was made by a newer version of the app. Refresh the app and try again.';
  if(!d.roster || !Array.isArray(d.roster.players)) return 'The backup is missing the player list.';
  if(!d.match || typeof d.match!=='object') return 'The backup is missing the match-day state.';
  if(!Array.isArray(d.history) || d.history.some(h=>!h || !h.id || !Array.isArray(h.teamAIds) || !Array.isArray(h.teamBIds))) return 'The backup’s match history looks damaged.';
  if(d.rivalries && !Array.isArray(d.rivalries)) return 'The backup’s rivalries look damaged.';
  return '';
}
function pickRestoreFile(input){
  const f = input.files && input.files[0];
  input.value = '';
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    let d = null, err = '';
    try{ d = JSON.parse(String(rd.result)); }catch(e){ err = 'That file couldn’t be read as a backup.'; }
    if(!err) err = validateBackup(d);
    restoreDraft = err ? {error: err} : {data: d};
    restoreArm = false; render();
  };
  rd.onerror = ()=>{ restoreDraft = {error: 'That file couldn’t be opened.'}; render(); };
  rd.readAsText(f);
}
async function applyRestore(){
  if(!isHost() || !restoreDraft || !restoreDraft.data) return;
  if(!restoreArm){ restoreArm = true; render(); return; }
  const d = restoreDraft.data;
  const strip = o=>{ const c = Object.assign({}, o); delete c.id; return c; };
  restoreBusy = 'Restoring players and match day…'; render();
  try{
    if(db){
      await db.doc(squadPath('state/roster')).set(d.roster);
      await db.doc(squadPath('state/match')).set(d.match);
      const keepH = new Set(d.history.map(h=>h.id));
      const curH = await db.collection(squadPath('history')).get();
      const dels = curH.docs.filter(x=>!keepH.has(x.id)).map(x=>()=>db.doc(squadPath('history/'+x.id)).delete());
      const sets = d.history.map(h=>()=>db.doc(squadPath('history/'+h.id)).set(strip(h)));
      const riv = d.rivalries || [];
      const keepR = new Set(riv.map(x=>x.id));
      const curR = await db.collection(squadPath('rivalries')).get();
      const rdels = curR.docs.filter(x=>!keepR.has(x.id)).map(x=>()=>db.doc(squadPath('rivalries/'+x.id)).delete());
      const rsets = riv.filter(x=>x && x.id).map(x=>()=>db.doc(squadPath('rivalries/'+x.id)).set(strip(x)));
      const jobs = dels.concat(sets, rdels, rsets);
      for(let i=0; i<jobs.length; i+=20){
        restoreBusy = 'Restoring matches… ' + Math.min(i+20, jobs.length) + ' of ' + jobs.length; render();
        await Promise.all(jobs.slice(i, i+20).map(f=>f()));
      }
    }else{
      SQUAD = d.roster; S = d.match;
      HISTORY = d.history.slice().sort((a,b)=> String(b.date).localeCompare(String(a.date)));
      localCommit();
    }
    restoreBusy = ''; restoreDraft = null; restoreArm = false;
    backupMsg = '✅ Restored: ' + d.history.length + ' match' + (d.history.length===1?'':'es') + ' and ' + d.roster.players.length + ' players.';
  }catch(e){
    restoreBusy = ''; restoreArm = false;
    backupMsg = '⚠️ The restore stopped part-way (' + ((e && e.code) || 'connection problem') + '). Nothing was lost from the file — try again.';
  }
  render();
}
function renderBackupModal(){
  if(!showBackup) return '';
  if(!isHost()){ showBackup = false; return ''; }
  const rd = restoreDraft;
  let restoreBox = '';
  if(rd && rd.error) restoreBox = `<div class="login-err" style="margin-top:10px;">${esc(rd.error)}</div>`;

    restoreBox = `
      <div class="hres" style="margin-top:12px; padding:12px; border:1px solid var(--line-strong); border-radius:var(--radius-sm);">
        <div style="font-weight:700;">${esc((d.squad && d.squad.name) || 'Squad')} · saved ${esc(new Date(d.exportedAt).toLocaleString(undefined,{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}))}</div>
        <div class="panel-sub" style="margin:4px 0 10px;">${d.roster.players.length} players · ${d.history.length} matches · ${(d.rivalries||[]).length} rivalries</div>
        <div class="panel-sub" style="margin:0 0 10px; color:var(--danger);">This replaces <b>${esc(currentSquadName())}</b>’s players, today’s match and the whole match history with what’s in the file. Anything added since the backup is lost.</div>
        <div class="row" style="gap:8px;">
          <button class="btn ${restoreArm ? 'btn-danger' : 'btn-primary'}" ${restoreBusy?'disabled':''} onclick="applyRestore()">${restoreArm ? 'Tap again to replace' : 'Restore this backup'}</button>
          <button class="btn btn-ghost" ${restoreBusy?'disabled':''} onclick="restoreDraft=null; restoreArm=false; render();">Cancel</button>
        </div>
      </div>`;
  }
  return `
  <div class="modal-backdrop" onclick="if(event.target===this && !restoreBusy) toggleBackup();">
    <div class="modal">
      <div class="row" style="justify-content:space-between; margin-bottom:4px;">
        <div class="panel-title" style="margin:0;">💾 Backup &amp; restore</div>
        <button class="icon-btn" ${restoreBusy?'disabled':''} onclick="toggleBackup()">✕</button>
      </div>
      <p class="panel-sub">Saves everything for <b>${esc(currentSquadName())}</b> to one file: players, chemistry links, today’s match, every past match with results and votes, and rivalries. Keep it somewhere safe (Files, Google Drive, or send it to yourself on WhatsApp). PINs aren’t included.</p>
      <div class="row" style="gap:8px; flex-wrap:wrap;">
        <button class="btn btn-primary" ${backupBusy||restoreBusy?'disabled':''} onclick="downloadBackup()">${backupBusy ? 'Preparing…' : '⬇️ Download backup'}</button>
        <label class="btn" style="cursor:pointer;">⬆️ Restore from file<input type="file" accept=".json,application/json" style="display:none;" onchange="pickRestoreFile(this)"></label>
      </div>
      <div class="panel-sub" style="margin:10px 0 0;">${esc(lastBackupText())} A backup after each matchday is a good habit.</div>
      ${backupMsg ? `<div class="panel-sub" style="margin:8px 0 0; color:var(--chalk);">${esc(backupMsg)}</div>` : ''}
      ${restoreBusy ? `<div class="panel-sub" style="margin:8px 0 0;">⏳ ${esc(restoreBusy)}</div>` : ''}
      ${restoreBox}
    </div>
  </div>`;
}

// Everything below comes from saved match history, newest first.
function profileSportExtrasHtml(id){
  if(SPORT.key==='football' || SPORT.key==='pickleball') return '';
  let best1 = 0, best2 = 0, runsWithBalls = 0, balls = 0, catches = 0, ast = 0, games = 0;
  HISTORY.forEach(h=>{
    const A = h.teamAIds||[], B = h.teamBIds||[];
    if(!A.includes(id) && !B.includes(id)) return;
    games++;
    const g = (h.scorers||[]).filter(x=>x.playerId===id).reduce((n,x)=>n+(x.goals||0),0);
    const w = (h.assists||[]).filter(x=>x.playerId===id).reduce((n,x)=>n+(x.assists||0),0);
    const ex = (h.pstats||{})[id] || {};
    best1 = Math.max(best1, g); best2 = Math.max(best2, w);
    if(ex.b){ balls += ex.b; runsWithBalls += g; }
    catches += ex.c||0; ast += ex.ast||0;
  });
  if(!games) return '';
  const tile = (v,l)=>`<div class="pf-tile"><b>${v}</b><span>${l}</span></div>`;
  if(SPORT.key==='cricket'){
    return `<div class="pf-grid">${tile(best1,'Highest score')}${tile(best2 ? best2+' wkts' : '–','Best bowling')}${tile(balls ? Math.round(100*runsWithBalls/balls) : '–','Strike rate')}${tile(catches,'Catches')}</div>`;
  }
  return `<div class="pf-grid">${tile(best1,'Best game (pts)')}${tile(ast,'Assists')}${tile(games ? (ast/games).toFixed(1) : '–','Assists / game')}</div>`;
}
function computeProfile(id){
  const out = {played:0, wins:0, draws:0, losses:0, goals:0, assists:0, potm:0, form:[], mates:{}};
  HISTORY.forEach(h=>{
    const A = h.teamAIds||[], B = h.teamBIds||[];
    const inA = A.includes(id), inB = B.includes(id);
    if(!inA && !inB) return;
    out.played++;
    let res = null;
    if(h.winner==='draw') res = 'D';
    else if(h.winner==='a' || h.winner==='b') res = ((h.winner==='a') === inA) ? 'W' : 'L';
    if(res==='W') out.wins++; else if(res==='L') out.losses++; else if(res==='D') out.draws++;
    if(res && out.form.length < 5) out.form.push(res);
    (h.scorers||[]).forEach(s=>{ if(s.playerId===id) out.goals += (s.goals||0); });
    (h.assists||[]).forEach(a=>{ if(a.playerId===id) out.assists += (a.assists||0); });
    ['a','b'].forEach(t=>{ const w = computePotmWinner(h,t); if(w && !w.tied && w.leaders[0]===id) out.potm++; });
    if(res){

/* ============================= Your-turn alerts ============================= */
// A captain's phone buzzes, beeps and flashes a banner the moment it's their
// turn to bid, and the screen is kept awake during the auction so a locked
// phone doesn't leave the other captain waiting.
let audioCtx = null, lastTurnKey = null, titleTimer = null, wakeLock = null, wakeLockBusy = false;
const baseTitle = document.title;
function unlockAudio(){
  try{
    if(!audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) audioCtx = new AC(); }
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}
function beep(){
  if(!audioCtx) return;
  try{
    const t = audioCtx.currentTime;
    [[880,0],[1175,0.18]].forEach(([f,d])=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t+d);
      g.gain.exponentialRampToValueAtTime(0.28, t+d+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+d+0.35);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t+d); o.stop(t+d+0.4);
    });
  }catch(e){}
}
function buzz(){ try{ if(navigator.vibrate) navigator.vibrate([220,90,220,90,420]); }catch(e){} }
function myTurnInfo(){
  const a = S.auction;
  if(S.phase!=='auction' || !a || a.done) return null;
  const t = myTeamRole();
  if(!t || a.turn!==t) return null;
  const capA = a.capA || S.format, capB = a.capB || S.format;
  if(teamFull(a.teamA,capA) !== teamFull(a.teamB,capB)) return null;   // roster is auto-filling, nobody to act
  const cur = a.order[a.index];
  return {team:t, bid:a.currentBid, player: cur ? playerName(cur) : ''};
}
function notifyTurn(info){
  try{
    if(!document.hidden || !('Notification' in window) || Notification.permission!=='granted') return;
    const body = (info.player ? info.player + ' is on the block — ' : '') + 'bid ₹' + info.bid + ' or more, or pass.';
    const opts = {body, tag:'md-turn', renotify:true, icon:'icon-192.png', vibrate:[200,100,200]};
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(reg=>{
        if(reg && reg.showNotification) reg.showNotification('Your turn ' + SPORT.icon, opts); else new Notification('Your turn ' + SPORT.icon, opts);
      }).catch(()=>{});
    }else new Notification('Your turn ' + SPORT.icon, opts);
  }catch(e){}
}
function closeTurnNotifications(){
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(reg=>{
        if(reg && reg.getNotifications) reg.getNotifications({tag:'md-turn'}).then(l=>l.forEach(n=>n.close()));
      }).catch(()=>{});
    }
  }catch(e){}
}
function startTitleFlash(){
  if(titleTimer) return;
  let on = false;
  titleTimer = setInterval(()=>{ on = !on; document.title = on ? '🔔 YOUR TURN!' : baseTitle; }, 1000);
}
function stopTitleFlash(){
  if(titleTimer){ clearInterval(titleTimer); titleTimer = null; }
  document.title = baseTitle;
}
async function syncWakeLock(want){
  try{
    if(want){
      if(!wakeLock && !wakeLockBusy && navigator.wakeLock && !document.hidden){
        wakeLockBusy = true;
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
      }
    }else if(wakeLock){
      const w = wakeLock; wakeLock = null; await w.release();
    }
  }catch(e){ wakeLock = null; }
  wakeLockBusy = false;
}
function checkTurnAlert(){
  const info = myTurnInfo();
  if(info){
    const a = S.auction;
    const key = [a.index, a.currentBid, a.turn, a.leader||''].join('|');
    if(key !== lastTurnKey){
      lastTurnKey = key;
      if(alertsOn){ buzz(); beep(); notifyTurn(info); }
      // a captain browsing the leaderboard/profile gets pulled back to the auction
      if(currentPage()!=='home') setTimeout(goHome, 0);
    }
    if(document.hidden && alertsOn) startTitleFlash();
  }else{
    if(lastTurnKey!==null) closeTurnNotifications();
    lastTurnKey = null;
    stopTitleFlash();
  }
  syncWakeLock((!!myTeamRole() && S.phase==='auction' && !!S.auction && !S.auction.done) || (isHost() && liveOn()));
}
function renderTurnBanner(){
  const i = myTurnInfo();

function toggleAlerts(){
  alertsOn = !alertsOn;

  unlockAudio();

/* ---- auction countdown ----
   Each phone times a turn from the moment it sees that turn begin (no shared clock needed).
   The captain whose turn it is auto-passes at zero; the host and the other captain back that up
   a few seconds later in case that phone is asleep. Friends watching never write anything. */
function auctionBothOpen(a){
  const capA = a.capA || S.format, capB = a.capB || S.format;
  return teamFull(a.teamA,capA) === teamFull(a.teamB,capB);
}
function syncTimerKey(){
  const a = S.auction;
  const key = a ? [a.index, a.currentBid, a.turn, a.leader||'', a.passesInARow||0].join('|') : '';
  if(key !== timerKey){ timerKey = key; timerStart = Date.now(); timerFiredAt = 0; }
}
function timerActive(){
  const a = S.auction;
  return !!(S.timerSecs > 0 && S.phase==='auction' && a && !a.done && auctionBothOpen(a));
}
function timerLeft(){
  syncTimerKey();
  return Math.max(0, (S.timerSecs||0) - (Date.now() - timerStart) / 1000);
}
function timerHtml(a){
  if(!timerActive()) return '';
  const left = timerLeft(), pct = Math.round(100 * left / S.timerSecs);
  return `<div class="turn-timer ${left<=5?'urgent':''}" id="turnTimer">
    <div class="tt-label"><span>Team ${a.turn.toUpperCase()} to decide</span><b id="ttText">${Math.ceil(left)}s</b></div>
    <div class="tt-bar"><i id="ttBar" style="width:${pct}%"></i></div>
  </div>`;
}
function setTimerSecs(n){ saveState({timerSecs: Number(n)||0}); }
function tickTimer(){
  if(!timerActive()) return;
  const a = S.auction;
  const left = timerLeft();
  const t = document.getElementById('ttText'); if(t) t.textContent = Math.ceil(left) + 's';
  const bar = document.getElementById('ttBar'); if(bar) bar.style.width = Math.round(100*left/S.timerSecs) + '%';
  const box = document.getElementById('turnTimer'); if(box) box.classList.toggle('urgent', left<=5);
  const tb = document.getElementById('tbTimer'); if(tb) tb.textContent = '⏱ ' + Math.ceil(left) + 's';
  const mine = myTeamRole() === a.turn;
  if(mine && left>0 && left<=5 && timerWarnKey!==timerKey){
    timerWarnKey = timerKey;
    if(alertsOn){ try{ if(navigator.vibrate) navigator.vibrate(120); }catch(e){} }
  }
  if(left > 0) return;
  const overdue = (Date.now() - timerStart)/1000 - S.timerSecs;
  const canBackUp = isHost() || !!myTeamRole();
  if(((mine && overdue >= 0) || (canBackUp && overdue >= 3.5)) && Date.now() - timerFiredAt > 5000){
    timerFiredAt = Date.now();
    auctionPass(a.turn, true);
  }
}
setInterval(tickTimer, 500);

function setStatsScope(k){ statsScope = k; showAwardsCard = false; render(); }
function statsSeasonYear(){ return statsSeason || String(new Date().getFullYear()); }
function statsSeasonPrev(){ statsSeason = String(Number(statsSeasonYear()) - 1); render(); }
function statsSeasonNext(){ statsSeason = String(Number(statsSeasonYear()) + 1); render(); }
function statsSeasonReset(){ statsSeason = null; render(); }
function statsScopeInfo(){
  if(statsScope==='season'){
    const y = statsSeasonYear();
    return {kind:'season', entries: HISTORY.filter(h=> String(new Date(h.date).getFullYear())===y), title:'Season ' + y, empty:'No matches recorded in ' + y + ' yet.'};
  }
  if(statsScope==='all'){
    return {kind:'all', entries: HISTORY.slice(), title:'All-time', empty:'No matches recorded yet.'};
  }
  const month = statsMonth || currentYearMonth();
  return {kind:'month', month, entries: historyForMonth(month), title: formatYearMonth(month), empty:'No matches recorded in ' + formatYearMonth(month) + ' yet.'};
}
function longestWinStreak(id, entries){
  let best = 0, cur = 0;
  entries.slice().reverse().forEach(h=>{   // oldest first
    const inA = (h.teamAIds||[]).includes(id), inB = (h.teamBIds||[]).includes(id);
    if(!inA && !inB) return;
    if(!h.winner) return;
    const won = (inA && h.winner==='a') || (inB && h.winner==='b');
    if(won){ cur++; if(cur>best) best = cur; } else cur = 0;
  });
  return best;
}
function computeRecords(entries, minGames){
  const stats = computeMonthlyStats(entries);
  const ids = Object.keys(stats);
  const out = [];
  const top = (icon, label, fn, fmt, min)=>{
    let best = -Infinity, holders = [];
    ids.forEach(id=>{ const v = fn(id); if(v>best){ best = v; holders = [id]; } else if(v===best) holders.push(id); });
    if(holders.length && best >= (min==null ? 1 : min)) out.push({icon, label, value: fmt ? fmt(best) : String(best), holders});
  };
  top(SPORT.s1.icon, 'Most ' + SPORT.s1.many, id=>stats[id].goals);
  top(SPORT.s2.icon, 'Most ' + SPORT.s2.many, id=>stats[id].assists);
  top('🏆', 'Most wins', id=>stats[id].wins);
  top('👟', 'Most matches', id=>stats[id].played);
  top('📈', 'Best win rate', id=> stats[id].played>=minGames ? Math.round(100*stats[id].wins/stats[id].played) : -1, v=>v+'%', 0);
  top('🔥', 'Longest win streak', id=>longestWinStreak(id, entries), v=>v+' in a row', 2);
  const potm = computeMonthlyPotmCounts(entries);
  top('🏅', 'Most POTMs', id=>potm[id]||0);
  // single-match feats
  let bestGoals = 0, goalHolders = [];
  entries.forEach(h=>(h.scorers||[]).forEach(s=>{
    if(!s.playerId || isGuest(s.playerId) || !s.goals) return;
    if(s.goals>bestGoals){ bestGoals = s.goals; goalHolders = [s.playerId]; }
    else if(s.goals===bestGoals && !goalHolders.includes(s.playerId)) goalHolders.push(s.playerId);
  }));
  if(bestGoals>=SPORT.feat1Min) out.push({icon:'🎯', label:(SPORT.key==='cricket' ? 'Highest score' : 'Most ' + SPORT.s1.many + ' in a match'), value:s1Text(bestGoals), holders:goalHolders});
  let best2 = 0, best2H = [];
  entries.forEach(h=>(h.assists||[]).forEach(a=>{
    if(!a.playerId || isGuest(a.playerId) || !a.assists) return;
    if(a.assists>best2){ best2 = a.assists; best2H = [a.playerId]; }
    else if(a.assists===best2 && !best2H.includes(a.playerId)) best2H.push(a.playerId);
  }));
  if(best2>=SPORT.feat2Min) out.push({icon:SPORT.s2.icon, label:(SPORT.key==='cricket' ? 'Best bowling' : 'Most ' + SPORT.s2.many + ' in a match'), value:s2Text(best2), holders:best2H});
  let bigMargin = 0, bigH = null, highTotal = 0, highH = null;
  entries.forEach(h=>{
    if(typeof h.scoreA!=='number' || typeof h.scoreB!=='number') return;
    const m = Math.abs(h.scoreA - h.scoreB), tot = h.scoreA + h.scoreB;
    if(m>bigMargin){ bigMargin = m; bigH = h; }
    if(tot>highTotal){ highTotal = tot; highH = h; }
  });
  const dstr = h=> new Date(h.date).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
  if(bigH && bigMargin>=SPORT.bigWinMin) out.push({icon:'💥', label:'Biggest win', value:Math.max(bigH.scoreA,bigH.scoreB)+'–'+Math.min(bigH.scoreA,bigH.scoreB), holders:[], note:'Team '+(bigH.scoreA>bigH.scoreB?'A':'B')+' · '+dstr(bigH)});
  if(highH && highTotal>=SPORT.highScoreMin) out.push({icon:'🎆', label:'Highest-scoring game', value:s1Text(highTotal), holders:[], note:highH.scoreA+'–'+highH.scoreB+' · '+dstr(highH)});
  return out;
}
function renderRecordsHtml(entries, kind){
  const recs = computeRecords(entries, kind==='all' ? 5 : 3);
  if(!recs.length) return '';
  return `<div class="rec-title">${kind==='all' ? '🏛 Hall of fame' : '⭐ Season highlights'}</div>
  <div class="rec-grid">${recs.map(r=>`
    <div class="rec-card">
      <div class="rl">${r.icon} ${esc(r.label)}</div>
      <div class="rv">${esc(r.value)}</div>
      <div class="rn">${r.holders.length ? r.holders.map(id=>nameLink(id)).join(' &amp; ') : esc(r.note||'')}</div>
    </div>`).join('')}</div>`;
}

/* ============================= Head-to-head & rivalries ============================= */
function h2hRecord(x, y, sinceIso){
  const out = {games:0, xw:0, yw:0, d:0};
  const since = sinceIso ? new Date(sinceIso).getTime() : 0;
  HISTORY.forEach(h=>{
    if(since && new Date(h.date).getTime() < since) return;
    if(!h.winner) return;
    const A = h.teamAIds||[], B = h.teamBIds||[];
    const xA = A.includes(x), xB = B.includes(x), yA = A.includes(y), yB = B.includes(y);
    if(!((xA && yB) || (xB && yA))) return;
    out.games++;
    if(h.winner==='draw') out.d++;
    else if((h.winner==='a') === xA) out.xw++;
    else out.yw++;
  });
  return out;
}
function h2hList(id){
  const rows = [];
  allPlayersArr().forEach(o=>{
    if(o.id===id || isGuest(o.id)) return;
    const r = h2hRecord(id, o.id);
    if(r.games>0) rows.push(Object.assign({id:o.id}, r));
  });
  rows.sort((a,b)=> b.games-a.games || playerName(a.id).localeCompare(playerName(b.id)));
  return rows;
}
function rivalKey(x, y){ return [x,y].sort().join('__'); }
function rivalryBetween(x, y){ return RIVALS.find(r=>r.id===rivalKey(x,y)); }
function incomingRequests(id){ return db && id ? RIVALS.filter(r=>r.status==='pending' && r.b===id) : []; }
function outgoingRequests(id){ return db && id ? RIVALS.filter(r=>r.status==='pending' && r.a===id) : []; }
function activeRivalries(id){ return RIVALS.filter(r=>r.status==='active' && (!id || r.a===id || r.b===id)); }
function rivalCooldown(r){
  return !!(r && r.status==='declined' && r.endedAt && Date.now() - new Date(r.endedAt).getTime() < 24*36e5);
}
function sendRivalry(targetId){
  const me = getMyPlayerId();
  if(!db || !me || me===targetId || !findPlayer(targetId)) return;
  const ex = rivalryBetween(me, targetId);
  if(ex && (ex.status==='pending' || ex.status==='active' || rivalCooldown(ex))) return;
  db.doc(squadPath('rivalries/' + rivalKey(me, targetId))).set({a:me, b:targetId, status:'pending', createdAt:new Date().toISOString()}).catch(()=>{});
}
function sendRivalryFromSelect(){
  const el = document.getElementById('rivalPick');
  if(el && el.value) sendRivalry(el.value);
}
function respondRivalry(id, accept){
  const r = RIVALS.find(x=>x.id===id);
  const me = getMyPlayerId();
  if(!db || !r || r.status!=='pending' || (r.b!==me && !isHost())) return;
  const now = new Date().toISOString();
  db.doc(squadPath('rivalries/' + id)).update(accept ? {status:'active', startedAt:now} : {status:'declined', endedAt:now}).catch(()=>{});
}
function withdrawRivalry(id){
  const r = RIVALS.find(x=>x.id===id);
  const me = getMyPlayerId();
  if(!db || !r || r.status!=='pending' || (r.a!==me && !isHost())) return;
  db.doc(squadPath('rivalries/' + id)).delete().catch(()=>{});
}
function endRivalry(id){
  const r = RIVALS.find(x=>x.id===id);
  const me = getMyPlayerId();
  if(!db || !r || r.status!=='active' || (r.a!==me && r.b!==me && !isHost())) return;
  if(rivalArm !== id){
    rivalArm = id; render();
    setTimeout(()=>{ if(rivalArm===id){ rivalArm = null; render(); } }, 4000);
    return;
  }
  rivalArm = null;
  db.doc(squadPath('rivalries/' + id)).update({status:'ended', endedAt:new Date().toISOString()}).catch(()=>{});
}
function rivalCardHtml(r){
  const rec = h2hRecord(r.a, r.b, r.startedAt), all = h2hRecord(r.a, r.b);
  const me = getMyPlayerId();
  const since = r.startedAt ? new Date(r.startedAt).toLocaleDateString(undefined,{day:'numeric',month:'short'}) : '';
  const canEnd = isHost() || me===r.a || me===r.b;
  return `<div class="riv-card">
    <div class="riv-score"><span>${nameLink(r.a)}</span><span class="sc">${rec.xw} – ${rec.yw}</span><span style="text-align:right;">${nameLink(r.b)}</span></div>
    <div class="panel-sub">Since ${esc(since)} · ${rec.games} meeting${rec.games===1?'':'s'}${rec.d ? ' · '+rec.d+' draw'+(rec.d===1?'':'s') : ''} · all-time ${all.xw}–${all.yw}${all.d ? ' ('+all.d+' drawn)' : ''}</div>
    ${canEnd ? `<button class="btn btn-sm btn-ghost" onclick="endRivalry('${r.id}')">${rivalArm===r.id ? 'Tap again to end it' : 'End rivalry'}</button>` : ''}
  </div>`;
}
function renderRivalsBoard(){
  const act = activeRivalries().map(r=>({r, n:h2hRecord(r.a,r.b,r.startedAt).games})).sort((x,y)=>y.n-x.n).map(x=>x.r);
  return `<div class="panel-sub">Friendly feuds. A rivalry only counts matches played after both sides agreed to it.</div>
  ${act.length ? act.map(rivalCardHtml).join('') : `<div class="empty-note">No rivalries yet. Open your own profile and tap <b>Rivals</b> to challenge someone.</div>`}`;
}
function renderRivalBanner(){
  const me = getMyPlayerId();
  if(!db || !me) return '';
  return incomingRequests(me).map(r=>`<div class="banner amber" style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
    <span>⚔️ <b>${esc(playerName(r.a))}</b> challenged you to a rivalry.</span>
    <span class="row-controls"><button class="btn btn-sm btn-primary" onclick="respondRivalry('${r.id}',true)">Accept</button><button class="btn btn-sm btn-ghost" onclick="respondRivalry('${r.id}',false)">Decline</button></span>
  </div>`).join('');
}
function profileTabsHtml(p, isMe){
  const n = isMe ? incomingRequests(p.id).length : 0;
  return `<div class="scope-tabs">
    <button class="toggle-btn ${profileTab==='stats'?'active':''}" onclick="setProfileTab('stats')">Stats</button>
    <button class="toggle-btn ${profileTab==='rivals'?'active':''}" onclick="setProfileTab('rivals')">⚔️ Rivals${n ? ' ('+n+')' : ''}</button>
  </div>`;
}
function setProfileTab(t){ profileTab = t; render(); }
function rivalsTabHtml(p, isMe){
  const me = getMyPlayerId();
  const rows = h2hList(p.id);
  let html = '';
  if(db){
    if(isMe){
      incomingRequests(p.id).forEach(r=>{
        html += `<div class="riv-card"><div class="panel-sub" style="margin:0 0 8px;">⚔️ <b>${esc(playerName(r.a))}</b> wants a rivalry with you.</div>
          <span class="row-controls"><button class="btn btn-sm btn-primary" onclick="respondRivalry('${r.id}',true)">Accept</button><button class="btn btn-sm btn-ghost" onclick="respondRivalry('${r.id}',false)">Decline</button></span></div>`;
      });
      outgoingRequests(p.id).forEach(r=>{
        html += `<div class="riv-card"><div class="panel-sub" style="margin:0 0 8px;">Waiting for <b>${esc(playerName(r.b))}</b> to accept…</div>
          <button class="btn btn-sm btn-ghost" onclick="withdrawRivalry('${r.id}')">Withdraw request</button></div>`;
      });
    }
    const act = activeRivalries(p.id);
    html += `<div class="pf-section">Rivalries</div>`;
    html += act.length ? act.map(rivalCardHtml).join('') : `<div class="empty-note">No active rivalries${isMe ? ' — challenge someone below.' : '.'}</div>`;
    if(isMe){
      const nem = rows.filter(r=> r.yw - r.xw >= 2 && r.games >= 3 && !rivalryBetween(p.id, r.id)).slice(0,2);
      nem.forEach(r=>{
        html += `<div class="nemesis"><span>😤 <b>${esc(playerName(r.id))}</b> keeps beating you (${r.xw}–${r.yw}).</span><button class="btn btn-sm" onclick="sendRivalry('${r.id}')">Start a rivalry</button></div>`;
      });
      const cands = allPlayersArr().filter(o=>!isGuest(o.id) && o.id!==p.id && !(rivalryBetween(p.id,o.id) && ['pending','active'].includes(rivalryBetween(p.id,o.id).status)) && !rivalCooldown(rivalryBetween(p.id,o.id)));
      if(cands.length){
        html += `<div class="pf-section">Challenge someone</div>
        <div class="login-row"><select id="rivalPick" class="field-input grow" style="min-width:0;">${cands.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select>
        <button class="btn btn-primary" style="flex:none; white-space:nowrap;" onclick="sendRivalryFromSelect()">⚔️ Send</button></div>
        <div class="panel-sub" style="margin-top:6px;">They have to accept before it starts.</div>`;
      }
    }else if(me && me!==p.id){
      const ex = rivalryBetween(me, p.id);
      if(!ex || ex.status==='declined' || ex.status==='ended'){
        html += rivalCooldown(ex)
          ? `<div class="panel-sub" style="margin-top:8px;">${esc(p.name)} declined a recent request — try again tomorrow.</div>`
          : `<div style="margin-top:8px;"><button class="btn btn-sm" onclick="sendRivalry('${p.id}')">⚔️ Challenge ${esc(p.name)} to a rivalry</button></div>`;
      }else if(ex.status==='pending'){
        html += ex.a===me
          ? `<div class="panel-sub" style="margin-top:8px;">Request sent — waiting for ${esc(p.name)}. <button class="btn btn-sm btn-ghost" onclick="withdrawRivalry('${ex.id}')">Withdraw</button></div>`
          : `<div style="margin-top:8px;" class="row-controls"><button class="btn btn-sm btn-primary" onclick="respondRivalry('${ex.id}',true)">Accept ${esc(p.name)}'s challenge</button><button class="btn btn-sm btn-ghost" onclick="respondRivalry('${ex.id}',false)">Decline</button></div>`;
      }
    }
  }
  html += `<div class="pf-section">Head-to-head ${isMe ? '(you vs everyone)' : 'for ' + esc(p.name)}</div>`;
  html += rows.length ? rows.map(r=>`
    <div class="h2h-row">
      <div>${nameLink(r.id)}<small>${r.games} meeting${r.games===1?'':'s'} on opposite teams</small></div>
      <div class="h2h-rec" style="color:${r.xw>r.yw?'var(--good)':r.xw<r.yw?'var(--danger)':'var(--chalk-dim)'};">${r.xw}–${r.d}–${r.yw}</div>
    </div>`).join('') + `<div class="panel-sub" style="margin-top:6px;">Wins–draws–losses against each player, from ${isMe ? 'your' : esc(p.name)+'\\u2019s'} side.</div>`
    : `<div class="empty-note">No matches against other players recorded yet.</div>`;
  return html;
}

/* ============================= Attendance (host) ============================= */
function toggleAttendance(){ showAttendance = !showAttendance; render(); }
function attPlayed(h, id){ return (h.teamAIds||[]).includes(id) || (h.teamBIds||[]).includes(id) || (h.subIds||[]).includes(id); }
function attInvolved(h, id){
  return attPlayed(h,id) || !!(h.att && ((h.att.expected||[]).includes(id) || (h.att.dropped||[]).some(d=>d.id===id)));
}
function computeAttendance(){
  const win = HISTORY.slice(0, ATT_WINDOW);
  return allPlayersArr().filter(p=>!isGuest(p.id)).map(p=>{
    let oldest = -1;
    win.forEach((h,i)=>{ if(attInvolved(h,p.id)) oldest = i; });
    const olderExists = HISTORY.slice(ATT_WINDOW).some(h=>attInvolved(h,p.id));
    const opp = olderExists ? win.length : (oldest>=0 ? oldest+1 : 0);
    const span = win.slice(0, opp);
    let played = 0, late = 0, streak = 0, last = null;
    span.forEach(h=>{
      if(attPlayed(h,p.id)){ played++; if(!last) last = h.date; }
      if(h.att && (h.att.dropped||[]).some(d=>d.id===p.id && d.late)) late++;
    });
    for(const h of span){ if(attPlayed(h,p.id)) streak++; else break; }
    const pct = opp ? Math.round(100*played/opp) : null;
    let status = 'ok';
    if(!opp) status = 'new';
    else if(late>=2 || (opp>=3 && pct<50)) status = 'bad';
    else if(late===1 || (opp>=3 && pct<80)) status = 'mid';
    return {id:p.id, name:p.name, unavailable:!!p.unavailable, opp, played, late, streak, pct, last, status};
  });
}
const ATT_LABEL = {ok:'🟢 Reliable', mid:'🟡 Patchy', bad:'🔴 Flaky', new:'⚪ New'};
function attendanceLineHtml(id){
  const r = computeAttendance().find(x=>x.id===id);
  if(!r || !r.opp) return '';
  return `<div class="pf-section">Your attendance</div>
    <div class="panel-sub" style="margin:0;">Played ${r.played} of the last ${r.opp} · ${r.late} late drop-out${r.late===1?'':'s'} · <span class="st-chip ${r.status}">${ATT_LABEL[r.status]}</span></div>`;
}
function renderAttendanceModal(){
  if(!showAttendance) return '';
  if(!isHost()){ showAttendance = false; return ''; }
  const rows = computeAttendance();
  const order = {bad:0, mid:1, ok:2, new:3};
  rows.sort((x,y)=> order[x.status]-order[y.status] || ((x.pct==null?101:x.pct)-(y.pct==null?101:y.pct)) || x.name.localeCompare(y.name));
  const dropsNow = liveDrops();
  const inNow = (S.selectedIds||[]).filter(id=>!isGuest(id) && findPlayer(id)).length;
  const ago = iso=>{ const m = Math.round((Date.now()-new Date(iso).getTime())/60000); return m<60 ? m+' min ago' : Math.round(m/60)+' h ago'; };
  return `
  <div class="modal-backdrop" onclick="if(event.target===this) toggleAttendance();">
    <div class="modal" style="max-width:560px;">
      <div class="row" style="justify-content:space-between; margin-bottom:4px;">
        <div class="panel-title" style="margin:0;">📋 Attendance</div>
        <button class="icon-btn" onclick="toggleAttendance()">✕</button>
      </div>
      <div class="panel-sub">Who turns up and who bails, over the last ${ATT_WINDOW} matches (counted from each player's first one). A <b>late drop-out</b> is someone who ticked in, then out again within ${LATE_HOURS} hours of you locking the squad.</div>
      <div class="host-detail" style="display:block; margin-bottom:10px;"><b>${inNow}</b> in for today${dropsNow.length ? ' · dropped out: ' + dropsNow.map(d=>esc(playerName(d.id))+(d.late?' (late':' (')+', '+ago(d.at)+')').join(', ') : ' · nobody has dropped out'}</div>
      ${HISTORY.length ? `
      <div class="att-row head"><span>Player</span><span class="num">Played</span><span class="num">Late</span><span>Status</span></div>
      ${rows.map(r=>`
      <div class="att-row" style="${r.unavailable?'opacity:.55;':''}">
        <span>${nameLink(r.id)}<small>${r.last ? 'Last played '+esc(new Date(r.last).toLocaleDateString(undefined,{day:'numeric',month:'short'}))+(r.streak>1?' · '+r.streak+' in a row':'') : 'No matches yet'}</small></span>
        <span class="num">${r.opp ? r.played+'/'+r.opp+'<small>'+r.pct+'%</small>' : '–'}</span>
        <span class="num" style="${r.late?'color:var(--danger);':''}">${r.late}</span>
        <span><span class="st-chip ${r.status}">${ATT_LABEL[r.status]}</span></span>
      </div>`).join('')}` : `<div class="empty-note">No matches recorded yet — attendance builds up as you save them.</div>`}
      <div class="panel-sub" style="margin-top:10px;">Reliable: 80%+ and no late drop-outs. Patchy: under 80%, or one late drop-out. Flaky: under 50%, or two or more late drop-outs.</div>
    </div>
  </div>`;
}

/* ============================= Boot ============================= */
['pointerdown','keydown','touchstart'].forEach(ev=> document.addEventListener(ev, unlockAudio, {passive:true}));
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden){ stopTitleFlash(); checkTurnAlert(); checkForUpdate(); }
  else if(myTurnInfo() && alertsOn) startTitleFlash();
});
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstall = e; render(); });
window.addEventListener('appinstalled', ()=>{ deferredInstall = null; render(); });
try{
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.addEventListener('message', e=>{
      if(e.data && e.data.type==='md-updated'){ updateReady = true; render(); }
    });
    window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); setTimeout(checkForUpdate, 3000); });
  }
}catch(e){}
render();
initDb();
</script>
