<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="md-build" content="939656098e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matchday">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Matchday Draft</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
try{ document.documentElement.setAttribute('data-theme', localStorage.getItem('md_theme')==='dark' ? 'dark' : 'light'); }
catch(e){ document.documentElement.setAttribute('data-theme','light'); }
try{ var __tc = document.querySelector('meta[name=theme-color]'); if(__tc) __tc.setAttribute('content', document.documentElement.getAttribute('data-theme')==='dark' ? '#0b1812' : '#ffffff'); }catch(e){}
</script>
<style>
  :root{
    --pitch-bg:#ffffff;
    --stripe:#ffffff;
    --panel:#ffffff;
    --panel-2:#f3f5f4;
    --line:rgba(16,32,24,.10);
    --line-strong:rgba(16,32,24,.20);
    --chalk:#14201a;
    --chalk-dim:#4b5b53;
    --chalk-faint:#76867e;
    --amber:#f7b32b;
    --amber-ink:#2b1d00;
    --accent-text:#9a5b00;
    --sel-bg:rgba(19,128,79,.10);
    --sel-line:#13804f;
    --sel-ink:#ffffff;
    --teamA:#1f78c8;
    --teamA-dim:rgba(31,120,200,.10);
    --teamB:#dc4a30;
    --teamB-dim:rgba(220,74,48,.10);
    --team-head-ink:#ffffff;
    --danger:#d3363d;
    --good:#13804f;
    --star:#b8860b;
    --pos-gk:#a86f00;
    --pos-def:#7448cc;
    --pos-mid:#0b8a7f;
    --pos-fwd:#cc5f16;
    --shadow:0 1px 2px rgba(16,32,24,.06), 0 6px 18px rgba(16,32,24,.04);
    --scrim:rgba(20,32,26,.45);
    --radius:14px;
    --radius-sm:9px;
    font-size:16px;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --pitch-bg:#0b1812;
    --stripe:#0b1812;
    --panel:#12251c;
    --panel-2:#0e1e17;
    --line:rgba(244,247,242,.10);
    --line-strong:rgba(244,247,242,.22);
    --chalk:#f1f5f2;
    --chalk-dim:#a9bdb2;
    --chalk-faint:#7b9185;
    --amber:#ffc53d;
    --amber-ink:#33230a;
    --accent-text:#ffc53d;
    --sel-bg:rgba(95,207,138,.14);
    --sel-line:#5fcf8a;
    --sel-ink:#08160f;
    --teamA:#5db3ec;
    --teamA-dim:rgba(93,179,236,.14);
    --teamB:#ff7a63;
    --teamB-dim:rgba(255,122,99,.14);
    --team-head-ink:#08160f;
    --danger:#f0555b;
    --good:#5fcf8a;
    --star:#ffd23f;
    --pos-gk:#ffc53d;
    --pos-def:#b18cf0;
    --pos-mid:#4fd1c5;
    --pos-fwd:#ff9f5a;
    --shadow:none;
    --scrim:rgba(2,10,7,.62);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--pitch-bg);
    color:var(--chalk);
    font-family:'Work Sans', system-ui, -apple-system, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber);color:var(--amber-ink);}

  h1,h2,h3,.display{
    font-family:'Teko','Oswald',sans-serif;
    font-weight:600;
    letter-spacing:.01em;
    text-wrap:balance;
    margin:0;
  }
  .mono{font-family:'Space Mono','IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}

  a{color:inherit;}
  button{font-family:inherit;}
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:2px;
  }

  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:18px 16px 64px;
  }

  /* ---------- Header / scoreboard bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .ball{font-size:1.3rem;}
  .brand h1{font-size:1.8rem; line-height:1;}
  .brand small{color:var(--chalk-dim); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;}

  .role-pill{
    display:flex; align-items:center; gap:8px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 6px 6px 14px;
  }
  .role-pill label{font-size:.68rem; text-transform:uppercase; letter-spacing:.1em; color:var(--chalk-faint);}
  .role-pill select{
    background:var(--panel-2);
    color:var(--chalk);
    border:1px solid var(--line-strong);
    border-radius:999px;
    padding:6px 12px;
    font-size:.85rem;
    font-weight:600;
  }

  .progress-strip{
    display:flex;
    gap:6px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .progress-strip .step{
    flex:1;
    min-width:70px;
    text-align:center;
    padding:7px 4px;
    border-radius:999px;
    font-size:.68rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--chalk-faint);
    background:var(--panel-2);
    border:1px solid transparent;
  }
  .progress-strip .step.active{
    color:var(--amber-ink);
    background:var(--amber);
    border-color:var(--amber);
  }
  .progress-strip .step.done{
    color:var(--good);
    background:var(--sel-bg);
    border-color:transparent;
  }

  /* ---------- Panels / cards ---------- */
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .panel-title{
    font-size:1.4rem;
    margin-bottom:4px;
  }
  .panel-sub{
    color:var(--chalk-dim);
    font-size:.88rem;
    margin-bottom:16px;
    line-height:1.5;
  }

  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .grow{flex:1; min-width:180px;}

  input[type=text], input[type=password], input[type=number], select.field-input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line-strong);
    color:var(--chalk);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    font-size:.95rem;
    font-family:inherit;
  }
  input::placeholder{color:var(--chalk-faint);}

  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--chalk-faint);}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:1px solid var(--line-strong);
    background:var(--panel-2);
    color:var(--chalk);
    border-radius:999px;
    padding:10px 18px;
    font-size:.92rem;
    font-weight:600;
    cursor:pointer;
    transition:transform .08s ease, background .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--chalk-faint);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}
  .btn-primary{background:var(--amber); border-color:var(--amber); color:var(--amber-ink);}
  .btn-danger{background:transparent; border-color:var(--danger); color:var(--danger);}
  .btn-good{background:transparent; border-color:var(--good); color:var(--good);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--chalk-dim); padding:8px 10px;}
  .btn-sm{padding:6px 12px; font-size:.8rem;}
  .btn-block{width:100%;}

  .icon-btn{
    width:30px; height:30px; border-radius:8px;
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--panel-2); border:1px solid var(--line-strong); color:var(--chalk-dim);
    cursor:pointer; font-size:.85rem; line-height:1;
  }
  .icon-btn:hover{color:var(--chalk);}
  .icon-btn:disabled{opacity:.3; cursor:not-allowed;}

  /* ---------- Format chooser ---------- */
  .format-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(120px,1fr));
    gap:10px;
    margin-bottom:4px;
  }
  .format-card{
    background:var(--panel-2);
    border:1.5px solid var(--line-strong);
    border-radius:var(--radius-sm);
    padding:14px 10px;
    text-align:center;
    cursor:pointer;
  }
  .format-card .num{font-family:'Teko',sans-serif; font-size:2.4rem; line-height:1; color:var(--chalk);}
  .format-card .lbl{font-size:.72rem; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:.06em;}
  .format-card.active{border-color:var(--amber); background:var(--amber);}
  .format-card.active .num, .format-card.active .lbl{color:var(--amber-ink);}

  /* ---------- Player list ---------- */
  .player-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px;}
  .player-row-wrap{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    overflow:hidden;
  }
  .player-row{
    display:flex; align-items:center; gap:8px;
    flex-wrap:wrap;
    padding:8px 10px;
  }
  .rank-badge{
    font-family:'Space Mono',monospace;
    font-size:.72rem;
    color:var(--chalk-faint);
    min-width:22px;
    text-align:center;
  }
  .ability-bar{
    width:44px; height:5px; border-radius:3px;
    background:var(--line-strong);
    overflow:hidden;
    flex-shrink:0;
  }
  .ability-bar i{display:block; height:100%; background:var(--amber);}
  .badge-row{display:inline-flex; gap:3px; flex-wrap:wrap;}
  .player-name{flex:1; font-weight:500; font-size:.94rem; min-width:80px;}
  .row-controls{display:flex; gap:4px; flex-wrap:wrap;}

  .attr-row{display:flex; flex-wrap:wrap; gap:4px; padding:0 10px 4px 40px;}
  .attr-chip{
    font-size:.66rem; color:var(--chalk-dim);
    background:var(--panel); border:1px solid var(--line);
    border-radius:999px; padding:1px 8px;
  }
  .attr-chip.attr-plus{border-color:var(--amber); color:var(--accent-text); font-weight:700;}
  .stats-line{font-size:.68rem; color:var(--chalk-faint); padding:0 10px 8px 40px;}
  .edit-panel{
    padding:10px 12px 12px; border-top:1px dashed var(--line-strong);
    display:flex; flex-direction:column; gap:6px;
  }
  .edit-label{font-size:.66rem; text-transform:uppercase; letter-spacing:.08em; color:var(--chalk-faint);}

  .chip-toggle-row{display:flex; flex-wrap:wrap; gap:6px;}
  .chip-toggle{
    background:var(--panel-2); border:1.5px solid var(--line-strong);
    color:var(--chalk-dim);
    border-radius:999px; padding:6px 12px;
    font-size:.8rem; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .chip-toggle.active{border-color:var(--amber); color:var(--amber-ink); background:var(--amber);}
  .chip-toggle.plus{font-weight:800; box-shadow:inset 0 0 0 2px rgba(0,0,0,.2);}
  .add-unknown-chip{margin-top:2px;}

  .select-row{cursor:pointer;}
  .select-row .player-row{transition:background .1s ease;}
  .select-row.selected{border-color:var(--sel-line); box-shadow:inset 4px 0 0 var(--sel-line);}
  .select-row.selected .player-row{background:var(--sel-bg);}
  .select-row.selected .player-name{font-weight:700;}
  .check-box{
    width:18px; height:18px; flex-shrink:0;
    border:1.5px solid var(--line-strong); border-radius:5px;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:.7rem; color:var(--sel-ink); font-weight:700;
  }
  .select-row.selected .check-box{border-color:var(--sel-line); background:var(--sel-line);}

  .empty-note{
    color:var(--chalk-faint);
    font-size:.88rem;
    padding:14px;
    text-align:center;
    border:1px dashed var(--line-strong);
    border-radius:var(--radius-sm);
  }

  /* ---------- Mode choice ---------- */
  .mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:600px){.mode-grid{grid-template-columns:1fr;}}
  .mode-card{
    background:var(--panel-2);
    border:1.5px solid var(--line-strong);
    border-radius:var(--radius);
    padding:20px;
    cursor:pointer;
    text-align:left;
  }
  .mode-card:hover{border-color:var(--amber); box-shadow:0 0 0 3px var(--amber) inset;}
  .mode-card .emoji{font-size:1.8rem;}
  .mode-card h3{font-size:1.5rem; margin:8px 0 4px;}
  .mode-card p{color:var(--chalk-dim); font-size:.86rem; margin:0; line-height:1.5;}

  /* ---------- Team cards ---------- */
  .teams-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:600px){.teams-grid{grid-template-columns:1fr;}}
  .team-card{
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--line);
    background:var(--panel-2);
  }
  .team-head{
    padding:12px 14px;
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:4px 10px;
    color:var(--team-head-ink);
  }
  .team-head.a{background:var(--teamA);}
  .team-head.b{background:var(--teamB);}
  .team-head h3{font-size:1.3rem; color:var(--team-head-ink);}
  .team-head .budget{font-family:'Space Mono',monospace; font-weight:700; font-size:1rem;}
  .team-head .team-comp{font-size:.7rem; font-weight:700; letter-spacing:.02em; opacity:.8;}

  .pos-badge{
    display:inline-flex; align-items:center; justify-content:center;
    font-size:.62rem; font-weight:700; letter-spacing:.03em;
    border:1px solid; border-radius:5px;
    padding:1px 5px;
    background:var(--panel);
    flex-shrink:0;
  }
  .chem-badge{
    border-color:var(--amber) !important; color:var(--accent-text) !important;
    background:rgba(247,179,43,.14); font-size:.68rem; padding:1px 4px;
    cursor:help;
  }
  .star-badge{
    border-color:var(--star) !important; color:var(--star) !important;
    background:rgba(247,179,43,.14); font-size:.72rem; padding:1px 4px;
  }
  .star-toggle.active{border-color:var(--star); color:var(--amber-ink); background:var(--amber);}
  .squad-pill select{
    background:var(--panel-2); color:var(--chalk); border:1px solid var(--line-strong);
    border-radius:999px; padding:6px 12px; font-size:.85rem; font-weight:600;
  }
  .squad-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:8px 12px; margin-bottom:6px;
  }
  .squad-row.current{border-color:var(--amber);}
  .balance-note{font-size:.8rem;}
  .team-body{padding:10px 14px 14px;}
  .team-body ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px;}
  .team-body li{
    display:flex; justify-content:space-between; gap:8px;
    font-size:.9rem;
    padding:6px 8px;
    border-radius:7px;
    background:var(--panel);
  }
  .team-body li .price{color:var(--chalk-faint); font-family:'Space Mono',monospace; font-size:.78rem;}
  .cap-tag{
    font-size:.62rem; text-transform:uppercase; letter-spacing:.06em;
    background:var(--amber); color:var(--amber-ink);
    border-radius:4px; padding:1px 5px; margin-left:6px; font-family:'Work Sans',sans-serif; font-weight:700;
  }
  .slot-empty{color:var(--chalk-faint); font-style:italic; font-size:.85rem; padding:6px 8px;}

  .subs-card{margin-top:14px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    background:var(--panel-2); border:1px solid var(--line-strong);
    padding:5px 11px; border-radius:999px; font-size:.82rem;
  }

  /* ---------- Captains picker ---------- */
  .pick-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
  .pick-name{
    padding:8px 14px; border-radius:999px;
    background:var(--panel-2); border:1.5px solid var(--line-strong);
    cursor:pointer; font-size:.88rem; font-weight:500;
  }
  .pick-name.pick-a{border-color:var(--teamA); background:var(--teamA-dim); color:var(--teamA);}
  .pick-name.pick-b{border-color:var(--teamB); background:var(--teamB-dim); color:var(--teamB);}
  .pick-name.disabled{opacity:.35; cursor:not-allowed;}

  .toggle-row{display:flex; gap:8px; margin-bottom:14px;}
  .toggle-btn{
    flex:1; padding:10px; text-align:center; border-radius:var(--radius-sm);
    background:var(--panel-2); border:1.5px solid var(--line-strong);
    cursor:pointer; font-weight:600; font-size:.88rem; color:var(--chalk-dim);
  }
  .toggle-btn.active{border-color:var(--amber); color:var(--amber-ink); background:var(--amber);}

  /* ---------- Auction stage ---------- */
  .auction-scoreboard{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:14px;
    align-items:stretch;
    margin-bottom:16px;
  }
  @media (max-width:640px){.auction-scoreboard{grid-template-columns:1fr; }}
  .cap-card{
    border-radius:var(--radius);
    padding:14px;
    border:1.5px solid var(--line);
    background:var(--panel-2);
    display:flex; flex-direction:column; gap:6px;
  }
  .cap-card.turn{box-shadow:0 0 0 2px var(--amber) inset;}
  .cap-card.a{border-color:var(--teamA);}
  .cap-card.b{border-color:var(--teamB);}
  .cap-card .who{font-size:.68rem; text-transform:uppercase; letter-spacing:.09em; color:var(--chalk-faint);}
  .cap-card .cap-name{font-size:1.3rem; font-family:'Teko',sans-serif;}
  .cap-card .cap-budget{font-family:'Space Mono',monospace; font-size:1.6rem; font-weight:700;}
  .cap-card.a .cap-budget{color:var(--teamA);}
  .cap-card.b .cap-budget{color:var(--teamB);}
  .cap-card .fill{font-size:.74rem; color:var(--chalk-faint);}

  .block-card{
    text-align:center;
    background:var(--panel-2);
    border:1.5px solid var(--amber);
    border-radius:var(--radius);
    padding:16px 18px;
    min-width:150px;
    display:flex; flex-direction:column; justify-content:center; gap:4px;
  }
  .block-card .tag{font-size:.64rem; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-text);}
  .block-card .name{font-size:1.7rem; font-family:'Teko',sans-serif; line-height:1.05;}
  .block-card .price{font-family:'Space Mono',monospace; font-size:1.9rem; font-weight:700; color:var(--chalk);}
  .block-card .leader{font-size:.78rem; color:var(--chalk-dim);}
  .block-card .attr-row{justify-content:center; padding:0;}

  .bid-actions{display:flex; gap:8px; margin-top:6px;}

  .log-panel{max-height:170px; overflow-y:auto;}
  .log-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column-reverse; gap:5px;}
  .log-list li{font-size:.82rem; color:var(--chalk-dim); padding:5px 8px; border-radius:7px; background:var(--panel-2);}
  .log-list b{color:var(--chalk);}

  .waiting-note{
    text-align:center; color:var(--chalk-faint); font-size:.85rem;
    padding:10px; font-style:italic;
  }

  .banner{
    border-radius:var(--radius-sm);
    padding:10px 14px;
    font-size:.85rem;
    margin-bottom:14px;
    border:1px solid var(--line-strong);
    background:var(--panel-2);
    color:var(--chalk-dim);
  }
  .banner.amber{border-color:var(--amber); color:var(--accent-text); background:rgba(247,179,43,.10);}
  .banner.good{border-color:var(--good); color:var(--good);}

  .history-item{
    border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:12px 14px; margin-bottom:8px; background:var(--panel-2);
  }
  .history-item .hdate{font-size:.72rem; color:var(--chalk-faint); text-transform:uppercase; letter-spacing:.06em;}
  .history-item .hteams{font-size:.9rem; margin-top:4px; color:var(--chalk-dim);}

  .footer-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:10px; flex-wrap:wrap;}

  .modal-backdrop{
    position:fixed; inset:0; background:var(--scrim);
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px; z-index:50; overflow-y:auto;
  }
  .modal{
    background:var(--panel); border:1px solid var(--line-strong);
    border-radius:var(--radius); padding:20px; max-width:520px; width:100%;
  }

  @media (prefers-reduced-motion: reduce){

<script>
/* ============================= State & storage ============================= */

const FORMATS = [5,6,7,8];

// Per-match state — who's playing, what mode, how the draft/split is going.
// The player database itself (SQUAD) lives separately and persists forever.
function defaultState(){
  return {
    phase:'setup',
    format:6,
    selectedIds:[],       // which SQUAD players are attending this match
    playingIds:null,
    subIds:null,
    mode:null,
    randomResult:null,
    captainPickMode:null,
    captains:{a:null,b:null},
    budget:100,
    basePrice:10,
    increment:5,
    timerSecs:30,         // seconds each captain gets per decision in the auction (0 = no timer)
    rsvpLog:[],           // who ticked in/out today, with times (feeds attendance tracking)
    attSnap:null,         // snapshot taken when the squad is locked: who was expected / dropped out
    auction:null,
    lastHistoryId:null,   // history doc this match is writing to, for the result form
    // "extra player" prompt (shown once selection hits exactly format*2): null
    // until the host answers; oddSide is which team carries the extra player
    // once they've said one more's coming; extraConfirmedEven means "no,
    // that's everyone" was tapped so the prompt stays dismissed. Both reset
    // whenever the format changes.
    oddSide:null,
    extraConfirmedEven:false,
    updatedAt:null
  };
}

function defaultSquad(){
  // guests: one-off fill-ins — kept separate from players/unrankedPlayers so
  // they never show up in roster management, the match-day picker (after
  // today), or the monthly awards, but their name still resolves forever in
  // old match history.
  return { players:[], unrankedPlayers:[], guests:[], chemistryGroups:[], stats:{}, coWin:{}, rankBaseline:[], rankBaselineMonth:null };
}

let db = null;               // resolved db capability, or null
let S = defaultState();      // synced match state, scoped to the active squad
let SQUAD = defaultSquad();  // persistent player database for the active squad
let HISTORY = [];            // recent saved matches for the active squad
let rosterLoaded = false;    // this squad's roster has arrived (or definitely won't)
let slowConnect = false;     // still waiting after a while — show a hint
let loginDraft = '';
let loginError = '';
let dbReady = false;         // becomes true once we know db is usable (or definitely not)

// ---- multi-squad ----
// Everything above (S/SQUAD/HISTORY) belongs to ONE squad at a time — the
// "active" squad every device is currently looking at, tracked by
// currentSquadId. squadsList is every squad that exists, for the picker.
// In db mode the active squad is a shared pointer (app/current) so every
// phone follows the host's choice; with no db it's just a local list.
let currentSquadId = null;
let squadsList = [];         // [{id, name, createdAt}]
let unsubRoster = null, unsubMatch = null, unsubHistory = null; // db-mode listener teardown
let migratingSquad = false;  // guards this device from double-running the legacy-data migration
let LOCAL = null;            // no-db fallback store: { currentSquadId, squads:[...], data:{[id]:{squad,state,history}} }
let showSquadManager = false;
let newSquadName = '';
let showHostCode = false;   // inline "enter the host code" box on the login page
let hostCodeDraft = '';
let hostCodeError = false;

// ---- who's using this device ----
// Host access is a fixed, deliberate claim (Keerat's own devices) rather than
// a casual option next to "spectator" — nobody should be able to get host
// controls just by picking "Host" from a dropdown, or even by tapping a plain
// "I'm the host" button (that's still just self-declaration). Instead, host
// access is only ever granted to a device that opens the app through a
// secret link — one you keep for yourself and never share with players —
// of the form yourlink#host=<host code>, or by typing that code on the login
// page. Only a SHA-256 fingerprint of the code lives in this file, so reading
// the page source doesn't reveal it. Everyone else logs in with just their
// name; if that player later becomes a captain, their device picks up captain
// powers automatically the next time captains change.
const HOST_HASH = '310a65a502a0b5285e9f9d908fd6eee263a06e3ff891e779d43ebfec308e532b';
// Small synchronous SHA-256 (works on http/file pages where crypto.subtle may not exist).
function sha256Hex(str){
  const rotr = (x,n)=> (x>>>n) | (x<<(32-n));
  const primes = []; for(let n=2; primes.length<64; n++){ if(primes.every(p=>n%p)) primes.push(n); }
  const frac = x=> Math.floor((x-Math.floor(x))*4294967296);
  const K = primes.map(p=>frac(Math.cbrt(p)));
  const H = primes.slice(0,8).map(p=>frac(Math.sqrt(p)));
  const data = Array.from(unescape(encodeURIComponent(str)), c=>c.charCodeAt(0));
  const bitLen = data.length*8;
  data.push(0x80);
  while(data.length%64 !== 56) data.push(0);
  const hi = Math.floor(bitLen/4294967296), lo = bitLen>>>0;
  [hi,lo].forEach(w=>{ for(let s=24;s>=0;s-=8) data.push((w>>>s)&255); });
  for(let off=0; off<data.length; off+=64){
    const w = new Array(64);
    for(let i=0;i<16;i++) w[i] = (data[off+4*i]<<24)|(data[off+4*i+1]<<16)|(data[off+4*i+2]<<8)|data[off+4*i+3];
    for(let i=16;i<64;i++){
      const s0 = rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3);
      const s1 = rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);
      w[i] = (w[i-16]+s0+w[i-7]+s1)|0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for(let i=0;i<64;i++){
      const S1 = rotr(e,6)^rotr(e,11)^rotr(e,25);
      const ch = (e&f)^(~e&g);
      const t1 = (h+S1+ch+K[i]+w[i])|0;
      const S0 = rotr(a,2)^rotr(a,13)^rotr(a,22);
      const maj = (a&b)^(a&c)^(b&c);
      const t2 = (S0+maj)|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    [a,b,c,d,e,f,g,h].forEach((v,i)=>{ H[i] = (H[i]+v)|0; });
  }
  return H.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
}
function isHostCode(x){ return sha256Hex(String(x)) === HOST_HASH; }
let isHostDevice = false;
try{
  const stored = localStorage.getItem('md_is_host');
  if(stored != null){
    isHostDevice = stored === '1';
  } else if(localStorage.getItem('md_role') === 'host'){
    // migrate a device that had already set the old manual "Host" toggle
    isHostDevice = true;
    localStorage.setItem('md_is_host', '1');
  }
  // Opening the app via the secret host link grants (or re-grants) host
  // access on this device, permanently, until it's explicitly stepped down.
  const hashMatch = (window.location.hash||'').match(/[#&]host=([^&]+)/);
  if(hashMatch && isHostCode(decodeURIComponent(hashMatch[1]))){
    isHostDevice = true;
    localStorage.setItem('md_is_host', '1');
    // scrub the secret out of the visible URL so it doesn't linger in the
    // address bar (e.g. if the screen is ever shared or the tab is bookmarked mid-secret)
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }
}catch(e){}

let showHistory = false;
let showDatabase = false;
let showAwards = false;      // the monthly awards board — open to every viewer, not just the host
let showAwardsCard = false;  // the screenshot-friendly shareable summary, nested inside the awards modal
let showLogMatch = false;
let manualPickStage = 'a';   // which captain slot manual-picking is filling next
let editingPlayerId = null;  // database row whose position/attribute editor is open
let chemSelection = [];      // ids currently ticked in the chemistry-link builder

/* ---- id helpers ---- */
function slugify(name){
  let s = name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'');
  return s || ('p' + Date.now());
}
function uniqueId(base, existingIds){
  let id = base, n = 2;
  while(existingIds.includes(id)){ id = base + '-' + n; n++; }
  return id;
}
function esc(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function cloneSquad(){ return JSON.parse(JSON.stringify(SQUAD)); }

/* ---- the player database (SQUAD) ---- */
function allPlayersArr(){
  return SQUAD.players.concat(SQUAD.unrankedPlayers||[]).concat(SQUAD.guests||[]);
}
// The persistent roster only — players and unranked, never guests. Used
// anywhere a guest shouldn't linger: roster management, the chemistry
// picker, next time's match-day list.
function rosterPlayersArr(){
  return SQUAD.players.concat(SQUAD.unrankedPlayers||[]);
}
function allPlayerIds(){
  return allPlayersArr().map(p=>p.id);
}
function findPlayer(id){
  return allPlayersArr().find(p=>p.id===id);
}
function isGuest(id){
  return (SQUAD.guests||[]).some(p=>p.id===id);
}
function playerName(id){
  const p = findPlayer(id);
  return p ? p.name : '(unknown)';
}
// Ability rank = index among KNOWN players (ascending, weakest first) in the
// persistent database. A player with unknown ability isn't part of that
// ordering — for balancing purposes we treat them as exactly average, so
// they don't skew either team.
function rankOf(id){
  const idx = SQUAD.players.findIndex(p=>p.id===id);
  if(idx>=0) return idx;
  return SQUAD.players.length ? (SQUAD.players.length-1)/2 : 0;
}
function statsOf(id){
  return Object.assign({played:0,wins:0,losses:0,draws:0,goals:0,assists:0}, (SQUAD.stats||{})[id]);
}

/* ---- positions & attributes ---- */
function nameLink(id, label){
  const p = findPlayer(id);
  const t = esc(label != null ? label : playerName(id));
  if(!p || isGuest(id)) return t;
  return `<button type="button" class="pname-link" onclick="event.stopPropagation(); openProfile('${id}')">${t}</button>`;
}
const POSITIONS = {
  GK:  {label:'GK',  full:'Goalkeeper', color:'var(--pos-gk)'},
  DEF: {label:'DEF', full:'Defender',   color:'var(--pos-def)'},
  MID: {label:'MID', full:'Midfielder', color:'var(--pos-mid)'},
  FWD: {label:'FWD', full:'Forward',    color:'var(--pos-fwd)'}
};
const POSITION_ORDER = ['GK','DEF','MID','FWD'];

const ATTRIBUTES = {
  shooting:  {label:'Shooting'},
  tackling:  {label:'Tackling'},
  speed:     {label:'Speed'},
  dribbling: {label:'Dribbling'},
  stamina:   {label:'Stamina'},
  passing:   {label:'Passing'},
  game_iq:   {label:'Game knowledge'}
};
const ATTRIBUTE_ORDER = ['shooting','tackling','speed','dribbling','stamina','passing','game_iq'];

// A player can hold more than one position — positionsOf always returns a
// non-empty array (falls back to ['MID'] for old/blank data).
function positionsOf(id){
  const p = findPlayer(id);
  const pos = (p && Array.isArray(p.positions) && p.positions.length) ? p.positions : ['MID'];
  return pos.filter(x=>POSITIONS[x]);
}
// Attributes are a {key: level} map — level 1 = has it, level 2 = "+"
// (exceptional). Reads old array-shaped data (from before levels existed)
// as level 1 for everything, so nothing already saved gets lost.
function attributesOf(id){
  const p = findPlayer(id);
  const raw = p && p.attributes;
  if(!raw) return {};
  if(Array.isArray(raw)){
    const out = {}; raw.forEach(k=>{ if(ATTRIBUTES[k]) out[k]=1; }); return out;
  }
  const out = {};
  Object.keys(raw).forEach(k=>{ if(ATTRIBUTES[k] && (raw[k]===1 || raw[k]===2)) out[k]=raw[k]; });
  return out;
}
function attrChipLabel(attr, level){
  return ATTRIBUTES[attr].label + (level===2 ? '+' : '');
}
// Counts toward every tagged position, so a GK/DEF player counts in both —
// this is "position coverage", not a strict headcount split.
function positionCounts(ids){
  const c = {GK:0,DEF:0,MID:0,FWD:0};
  ids.forEach(id=> positionsOf(id).forEach(pos=> c[pos]++));
  return c;
}
function compositionLine(ids){
  const c = positionCounts(ids);
  return POSITION_ORDER.map(p=>`${c[p]} ${p}`).join(' · ');
}
function posBadges(id){
  return positionsOf(id).map(pos=>{
    const meta = POSITIONS[pos];
    return `<span class="pos-badge" style="color:${meta.color}; border-color:${meta.color};">${meta.label}</span>`;
  }).join(' ');
}
function attrChips(id){
  const attrs = attributesOf(id);
  const keys = Object.keys(attrs);
  if(!keys.length) return '';
  return `<div class="attr-row">${keys.map(k=>`<span class="attr-chip${attrs[k]===2?' attr-plus':''}">${attrChipLabel(k,attrs[k])}</span>`).join('')}</div>`;
}
function statsLine(id){
  const s = statsOf(id);
  if(!s.played) return '';
  return `<div class="stats-line">${s.played} played · ${s.wins}W ${s.draws}D ${s.losses}L${s.goals?' · '+s.goals+' ⚽':''}</div>`;
}
function chemistryGroupOf(id){
  return (SQUAD.chemistryGroups||[]).find(g=>g.includes(id)) || null;
}
function chemBadge(id){
  const g = chemistryGroupOf(id);
  if(!g || g.length<2) return '';
  const mates = g.filter(x=>x!==id).map(playerName).join(', ');
  return `<span class="pos-badge chem-badge" title="Plays well with: ${esc(mates)}">🔗</span>`;
}

/* ---- star players: a rare, huge quality gap over the rest of the squad ---- */
function isStarPlayer(id){
  const p = findPlayer(id);
  return !!(p && p.star);
}
function starCount(ids){ return ids.filter(isStarPlayer).length; }
function starBadge(id){
  return isStarPlayer(id) ? `<span class="pos-badge star-badge" title="Star player">⭐</span>` : '';
}

/* ---- balanced, chemistry- and position-aware team splitting ---- */

// Group a list of ids into "units" — a chemistry group (trimmed to just the
// ids present in this list) stays together as one unit; anyone with no
// group of their own is a unit of one.
function buildChemistryUnits(ids){
  const idSet = new Set(ids);
  const seen = new Set();
  const units = [];
  ids.forEach(id=>{
    if(seen.has(id)) return;
    const g = chemistryGroupOf(id);
    const unit = g ? g.filter(x=>idSet.has(x)) : [id];
    unit.forEach(x=>seen.add(x));
    units.push(unit);
  });
  return units;
}
function unitStats(unit){
  let ability = 0, stars = 0;
  const pos = {GK:0,DEF:0,MID:0,FWD:0};
  unit.forEach(id=>{
    ability += rankOf(id);
    if(isStarPlayer(id)) stars++;
    positionsOf(id).forEach(p=> pos[p]++);
  });
  return {ability, pos, stars, hasGk: pos.GK>0, hasStar: stars>0};
}
// Greedily assigns `ids` between two sides, starting from whatever each
// side already holds (existingAIds/existingBIds) and never exceeding
// capA/capB more players. Chemistry groups are kept together whenever
// capacity allows; ability, position coverage AND star-player spread are
// balanced against what each side already has. Units containing a
// goalkeeper are placed first (a hard-ish priority), star units next —
// a heavy penalty keeps two stars off the same side whenever capacity
// allows it, the same way an uneven goalkeeper split is discouraged.
function balancedAssign(ids, existingAIds, existingBIds, capA, capB){
  // Shuffle first so ties in the sort below (equal priority units — same
  // GK/star/size/ability profile) don't always resolve the same way, and
  // add a small random jitter to genuinely close side-decisions further
  // down. Without either of these the optimizer is fully deterministic —
  // the exact bug that made "reshuffle" return the same split every time.
  const units = buildChemistryUnits(shuffledCopy(ids))
    .map(u=>({ids:u, stats:unitStats(u)}))
    .sort((x,y)=>{
      if(x.stats.hasGk !== y.stats.hasGk) return x.stats.hasGk ? -1 : 1;
      if(x.stats.hasStar !== y.stats.hasStar) return x.stats.hasStar ? -1 : 1;
      if(y.ids.length !== x.ids.length) return y.ids.length - x.ids.length;
      return (y.stats.ability/y.ids.length) - (x.stats.ability/x.ids.length);
    });

  let abilityA=0, abilityB=0, starsA=0, starsB=0;
  const posA={GK:0,DEF:0,MID:0,FWD:0}, posB={GK:0,DEF:0,MID:0,FWD:0};
  existingAIds.forEach(id=>{ abilityA+=rankOf(id); if(isStarPlayer(id)) starsA++; positionsOf(id).forEach(p=>posA[p]++); });
  existingBIds.forEach(id=>{ abilityB+=rankOf(id); if(isStarPlayer(id)) starsB++; positionsOf(id).forEach(p=>posB[p]++); });
  let remA = capA, remB = capB;
  const outA=[], outB=[];

  function place(id, side){
    if(side==='A'){ outA.push(id); remA--; abilityA+=rankOf(id); if(isStarPlayer(id)) starsA++; positionsOf(id).forEach(p=>posA[p]++); }
    else { outB.push(id); remB--; abilityB+=rankOf(id); if(isStarPlayer(id)) starsB++; positionsOf(id).forEach(p=>posB[p]++); }
  }

  units.forEach(({ids:unit, stats})=>{
    const fitsA = unit.length<=remA, fitsB = unit.length<=remB;
    let side;
    if(fitsA && fitsB){
      let penA=0, penB=0;
      POSITION_ORDER.forEach(p=>{
        penA += Math.abs((posA[p]+stats.pos[p]) - posB[p]);
        penB += Math.abs(posA[p] - (posB[p]+stats.pos[p]));
      });
      const starPenA = Math.abs((starsA+stats.stars) - starsB);
      const starPenB = Math.abs(starsA - (starsB+stats.stars));
      const abA = Math.abs((abilityA+stats.ability) - abilityB);
      const abB = Math.abs(abilityA - (abilityB+stats.ability));
      // A little noise so near-equal options can go either way on a
      // reshuffle; a real imbalance (position/star/ability gap far bigger
      // than this) still always resolves to the fairer side.
      const jitter = (Math.random()-0.5)*1.6;
      side = (penA*3 + starPenA*8 + abA*0.5 + jitter) <= (penB*3 + starPenB*8 + abB*0.5) ? 'A' : 'B';
    } else if(fitsA){ side = 'A'; }
    else if(fitsB){ side = 'B'; }
    else {
      // neither side has room for the whole unit — split it as a last
      // resort so the rosters still fill; chemistry loses to capacity.
      unit.forEach(id=> place(id, remA>0 ? 'A' : 'B'));
      return;
    }
    unit.forEach(id=> place(id, side));
  });

  return {sideAIds: outA, sideBIds: outB};
}

/* ============================= Persistence layer ============================= */

// Every persisted document lives under the active squad: squads/<id> holds
// just {name, createdAt} (cheap to list); squads/<id>/state/match and
// squads/<id>/state/roster are this squad's S and SQUAD; squads/<id>/history
// is its match log. app/current is the one shared pointer saying which
// squad every device should be looking at.
function squadPath(sub){ return 'squads/' + currentSquadId + '/' + sub; }

function saveState(patch){
  const next = Object.assign({}, S, patch, {updatedAt:new Date().toISOString()});
  if(db){
    db.doc(squadPath('state/match')).set(next).catch(()=>{ /* best effort */ });
  }else{
    S = next;
    localCommit();
  }
}

function saveSquadDoc(next){
  if(db){
    db.doc(squadPath('state/roster')).set(next).catch(()=>{});
  }else{
    SQUAD = next;
    localCommit();
  }
}

// entry = {date, format, mode, teamA, teamB, teamAIds, teamBIds, subs, subIds}
// Returns the new doc's id synchronously (minted client-side) so the
// match-result form can target an update to this same entry later.
function addToHistory(entry){
  if(db){
    const ref = db.collection(squadPath('history')).doc();
    ref.set(entry).catch(()=>{});
    return ref.id;
  }else{
    const id = 'local-' + Date.now() + '-' + Math.floor(Math.random()*1000);
    HISTORY = [Object.assign({id}, entry)].concat(HISTORY).slice(0,200);
    localCommit();
    return id;
  }
}
function updateHistoryResult(id, resultData){
  if(!id) return;
  if(db){
    db.doc(squadPath('history/'+id)).update(resultData).catch(()=>{});
  }else{
    HISTORY = HISTORY.map(h=> h.id===id ? Object.assign({}, h, resultData) : h);
    localCommit();
  }
}
function deleteHistoryDoc(id){
  if(!id) return;
  if(db){
    db.doc(squadPath('history/'+id)).delete().catch(()=>{});
  }else{
    HISTORY = HISTORY.filter(h=>h.id!==id);
    localCommit();
  }
}

/* ---- squad management (create / switch / rename / delete) ---- */

function loadLocalStore(){
  try{ const raw = localStorage.getItem('md_local_v2'); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function saveLocalStore(){ try{ localStorage.setItem('md_local_v2', JSON.stringify(LOCAL)); }catch(e){} }
function defaultLocalStore(){
  const id = 'local-default';
  return {
    currentSquadId: id,
    squads: [{id, name:'My Squad', createdAt:new Date().toISOString()}],
    data: { [id]: { squad: defaultSquad(), state: defaultState(), history: [] } }
  };
}
// Writes the in-memory S/SQUAD/HISTORY back into LOCAL and persists —
// the no-db equivalent of a db write landing and the snapshot firing.
function localCommit(){
  LOCAL.data[currentSquadId] = { squad: SQUAD, state: S, history: HISTORY };
  saveLocalStore();
  render();
}

// Belt and braces on top of the live listeners: re-reads the shared state
// straight from the server and only re-renders if something really changed.
let lastResync = 0;
function resyncNow(force){
  if(!db || !currentSquadId || !dbReady) return;
  if(typeof document!=='undefined' && document.visibilityState==='hidden') return;
  const now = Date.now();
  if(!force && now - lastResync < 2500) return;
  lastResync = now;
  const sid = currentSquadId;
  db.doc('squads/'+sid+'/state/match').get().then(snap=>{
    if(sid!==currentSquadId || !snap.exists) return;
    const fresh = Object.assign(defaultState(), snap.data());
    if(JSON.stringify(fresh) !== JSON.stringify(S)){ S = fresh; render(); }
  }).catch(()=>{});
}
document.addEventListener('visibilitychange', ()=>resyncNow(true));
window.addEventListener('online', ()=>resyncNow(true));
window.addEventListener('focus', ()=>resyncNow(false));
window.addEventListener('pageshow', ()=>resyncNow(true));
// While a draft is in progress people are waiting on each other's phones, so
// check the server every few seconds (screen on only). Cheap: a handful of
// reads per minute per phone, and only during these phases.
setInterval(()=>{
  if(S && (S.phase==='captains' || S.phase==='budget' || S.phase==='auction')) resyncNow(false);
}, 5000);

function subscribeToSquad(id){
  rosterLoaded = false;
  if(unsubRoster) unsubRoster();
  if(unsubMatch) unsubMatch();
  if(unsubHistory) unsubHistory();
  if(unsubRiv) unsubRiv();
  RIVALS = [];
  unsubRoster = db.doc('squads/'+id+'/state/roster').onSnapshot(snap=>{
    SQUAD = snap.exists ? Object.assign(defaultSquad(), snap.data()) : defaultSquad();
    ensureRankBaselineFresh();
    rosterLoaded = true;
    render();
  }, ()=>{ rosterLoaded = true; render(); });
  unsubMatch = db.doc('squads/'+id+'/state/match').onSnapshot(snap=>{
    S = snap.exists ? Object.assign(defaultState(), snap.data()) : defaultState();
    dbReady = true;
    render();
  }, ()=>{ dbReady = true; render(); });
  unsubHistory = db.collection('squads/'+id+'/history').orderBy('date','desc').limit(200).onSnapshot(qsnap=>{
    HISTORY = qsnap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    render();
  }, ()=>{});
  unsubRiv = db.collection('squads/'+id+'/rivalries').onSnapshot(qsnap=>{
    RIVALS = qsnap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    render();
  }, ()=>{});
}

// First-ever load of the new multi-squad structure: brings this artifact's
// pre-existing single squad/roster + state/current + history into a real
// squad named "My Squad" (skipped, harmlessly, if there was none), then
// points app/current at it. Best-effort — if two devices race into this on
// the very first load post-update, worst case is two starter squads, and
// deleteSquad can clean that up.
async function migrateOrCreateDefaultSquad(){
  if(migratingSquad) return;
  migratingSquad = true;
  try{
    const [legacyRoster, legacyState] = await Promise.all([
      db.doc('squad/roster').get(), db.doc('state/current').get()
    ]);
    const legacyData = legacyRoster.exists ? legacyRoster.data() : null;
    const hasLegacy = !!(legacyData && (((legacyData.players)||[]).length || ((legacyData.unrankedPlayers)||[]).length));
    const ref = db.collection('squads').doc();
    await ref.set({name:'My Squad', createdAt:new Date().toISOString()});
    await db.doc('squads/'+ref.id+'/state/roster').set(Object.assign(defaultSquad(), hasLegacy ? legacyData : {}));
    const legacyStateData = legacyState.exists ? legacyState.data() : {};
    await db.doc('squads/'+ref.id+'/state/match').set(Object.assign(defaultState(), legacyStateData));
    if(hasLegacy){
      const legacyHistory = await db.collection('history').orderBy('date','desc').limit(50).get();
      for(const d of legacyHistory.docs){
        await db.doc('squads/'+ref.id+'/history/'+d.id).set(d.data());
      }
    }
    await db.doc('app/current').set({squadId: ref.id});
  }catch(e){ /* best effort — worst case the picker just stays empty until retried */ }
  migratingSquad = false;
}

function createSquad(name){
  name = (name||'').trim() || 'New squad';
  if(db){
    const ref = db.collection('squads').doc();
    ref.set({name, createdAt:new Date().toISOString()}).catch(()=>{});
    db.doc('squads/'+ref.id+'/state/roster').set(defaultSquad()).catch(()=>{});
    db.doc('squads/'+ref.id+'/state/match').set(defaultState()).catch(()=>{});
    switchSquad(ref.id);
  }else{
    const id = 'local-' + Date.now();
    LOCAL.squads = LOCAL.squads.concat([{id, name, createdAt:new Date().toISOString()}]);
    LOCAL.data[id] = { squad: defaultSquad(), state: defaultState(), history: [] };
    squadsList = LOCAL.squads;
    switchSquad(id);
  }
  newSquadName = '';
}
function switchSquad(id){
  if(!id || id===currentSquadId) return;
  if(db){
    db.doc('app/current').set({squadId:id}).catch(()=>{});
  }else{
    LOCAL.currentSquadId = id;
    currentSquadId = id;
    const rec = LOCAL.data[id] || { squad: defaultSquad(), state: defaultState(), history: [] };
    SQUAD = rec.squad; S = rec.state; HISTORY = rec.history;
    ensureRankBaselineFresh();
    saveLocalStore();
    render();
  }
}
function renameSquad(id, name){
  name = (name||'').trim();
  if(!name) return;
  if(db){
    db.doc('squads/'+id).update({name}).catch(()=>{});
  }else{
    const sq = LOCAL.squads.find(s=>s.id===id);
    if(sq){ sq.name = name; squadsList = LOCAL.squads; saveLocalStore(); render(); }
  }
}
// Removes a squad from the picker. Its documents are left in place (the
// store doesn't cascade-delete nested paths) — harmless, just unreachable.
function deleteSquad(id){
  if(squadsList.length<=1) return; // always keep at least one squad to switch into
  if(db){
    db.doc('squads/'+id).delete().catch(()=>{});
    if(id===currentSquadId){
      const next = squadsList.find(s=>s.id!==id);
      if(next) switchSquad(next.id);
    }
  }else{
    LOCAL.squads = LOCAL.squads.filter(s=>s.id!==id);
    delete LOCAL.data[id];
    squadsList = LOCAL.squads;
    if(id===currentSquadId){ switchSquad(LOCAL.squads[0].id); }
    else { saveLocalStore(); render(); }
  }
}
function toggleSquadManager(){ showSquadManager = !showSquadManager; render(); }

// Firestore refuses arrays directly inside arrays (chemistry groups are
// arrays of arrays) and refuses `undefined` — so wrap/strip on the way in and
// unwrap on the way out. Everything else round-trips unchanged.
function fsEncode(v){
  if(Array.isArray(v)) return v.map(x=> Array.isArray(x) ? {__arr: fsEncode(x)} : fsEncode(x));
  if(v && typeof v==='object'){
    const o = {};
    Object.keys(v).forEach(k=>{ if(v[k]!==undefined) o[k] = fsEncode(v[k]); });
    return o;
  }
  return v;
}
function fsDecode(v){
  if(Array.isArray(v)) return v.map(fsDecode);
  if(v && typeof v==='object'){
    const keys = Object.keys(v);
    if(keys.length===1 && keys[0]==='__arr' && Array.isArray(v.__arr)) return v.__arr.map(fsDecode);
    const o = {};
    keys.forEach(k=>{ o[k] = fsDecode(v[k]); });
    return o;
  }
  return v;
}
function fsWrapDocSnap(s){
  return { id: s.id, exists: s.exists, data: ()=> fsDecode(s.data()) };
}
function fsWrapQuerySnap(q){
  return { docs: q.docs.map(fsWrapDocSnap) };
}
function fsWrapQuery(q){
  return {
    orderBy: (f,d)=> fsWrapQuery(q.orderBy(f,d)),
    limit: n=> fsWrapQuery(q.limit(n)),
    get: ()=> q.get().then(fsWrapQuerySnap),
    onSnapshot: (ok,err)=> q.onSnapshot(s=>ok(fsWrapQuerySnap(s)), err)
  };
}
function fsWrapDoc(r){
  return {
    id: r.id,
    get: ()=> r.get().then(fsWrapDocSnap),
    set: d=> r.set(fsEncode(d)),
    update: d=> r.update(fsEncode(d)),
    delete: ()=> r.delete(),
    onSnapshot: (ok,err)=> r.onSnapshot(s=>ok(fsWrapDocSnap(s)), err)
  };
}
function initFirebaseDb(){
  try{
    if(!FIREBASE_CONFIG || !window.firebase) return null;
    firebase.initializeApp(FIREBASE_CONFIG);
    const fs = firebase.firestore();
    // The default streaming connection can silently stall on phones (mobile
    // networks, battery savers, in-app browsers): updates only show after a
    // reload. Long-polling is a touch slower but keeps delivering them.
    try{ fs.settings({ experimentalForceLongPolling: true }); }catch(e){}
    return {
      doc: p=> fsWrapDoc(fs.doc(p)),
      collection: p=>{
        const c = fs.collection(p);
        const q = fsWrapQuery(c);
        q.doc = id=> fsWrapDoc(id ? c.doc(id) : c.doc());
        return q;
      }
    };
  }catch(e){ return null; }
}

async function initDb(){
  try{
    if(window.claude && window.claude.use){
      db = await window.claude.use('db');
    }
  }catch(e){ db = null; }
  if(!db) db = initFirebaseDb();

  if(!db){
    LOCAL = loadLocalStore() || defaultLocalStore();
    currentSquadId = LOCAL.currentSquadId;
    squadsList = LOCAL.squads;
    const rec = LOCAL.data[currentSquadId] || { squad: defaultSquad(), state: defaultState(), history: [] };
    SQUAD = rec.squad; S = rec.state; HISTORY = rec.history;
    ensureRankBaselineFresh();
    dbReady = true;
    rosterLoaded = true;
    render();
    return;
  }
  setTimeout(()=>{ if(!(dbReady && rosterLoaded)){ slowConnect = true; render(); } }, 10000);

  pinsLoaded = false;
  db.collection('pins').onSnapshot(qsnap=>{
    PINS = {};
    qsnap.docs.forEach(d=>{ const x = d.data(); if(x && x.h) PINS[d.id] = x.h; });
    pinsLoaded = true;
    render();
  }, ()=>{ pinsLoaded = true; render(); });

  db.collection('squads').orderBy('createdAt','asc').onSnapshot(qsnap=>{
    squadsList = qsnap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    render();
  }, ()=>{});

  db.doc('app/current').onSnapshot(snap=>{
    const id = snap.exists ? snap.data().squadId : null;
    if(id && id!==currentSquadId){
      currentSquadId = id;
      subscribeToSquad(id);
    } else if(!id){
      dbReady = true;
      migrateOrCreateDefaultSquad();
    }
    render();
  }, ()=>{ dbReady = true; render(); });
}

/* ============================= Match-making logic ============================= */

function shuffledCopy(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// How lopsided a player's recent appearances have been toward the bench
// rather than the pitch — higher means "more overdue for a game". Only
// looks at matches they were actually part of (playing OR benched), most
// recent first, so someone who just joined isn't penalized for the weeks
// before they existed.
function recentBenchBalance(id, lookback){
  lookback = lookback || 8;
  let benched = 0, played = 0, seen = 0;
  for(let i=0; i<HISTORY.length && seen<lookback; i++){
    const h = HISTORY[i];
    const inBench = (h.subIds||[]).includes(id);
    const inPlay = (h.teamAIds||[]).includes(id) || (h.teamBIds||[]).includes(id);
    if(!inBench && !inPlay) continue;
    seen++;
    if(inBench) benched++; else played++;
  }
  return benched - played;
}

// Decide, once, which of today's selected players are "in the match" vs
// bench, when more people showed up than two full teams need. Keeps up to
// two goalkeepers in the playing pool when available, so a random split
// still has a keeper for each side, and gives priority to whoever has been
// riding the bench most recently rather than picking purely at random.
function computePlayingPool(){
  const n = S.format;
  // one extra spot when the host confirmed an uneven-teams extra player
  const need = n*2 + (S.oddSide ? 1 : 0);
  const ids = (S.selectedIds||[]).slice();
  if(ids.length <= need){
    return {playingIds: ids, subIds: []};
  }
  const byFatigueDesc = (x,y) => recentBenchBalance(y) - recentBenchBalance(x);
  const gks = shuffledCopy(ids.filter(id=>positionsOf(id).includes('GK'))).sort(byFatigueDesc);
  const others = shuffledCopy(ids.filter(id=>!positionsOf(id).includes('GK'))).sort(byFatigueDesc);
  const guaranteedGks = gks.slice(0, Math.min(2, need));
  const rest = shuffledCopy(gks.slice(guaranteedGks.length).concat(others))
    .sort(byFatigueDesc)
    .slice(0, Math.max(0, need - guaranteedGks.length));
  const playingIds = shuffledCopy(guaranteedGks.concat(rest));
  const playingSet = new Set(playingIds);
  const subIds = ids.filter(id=>!playingSet.has(id));
  return {playingIds, subIds};
}

// Balance the playing pool into two teams by ability, position AND
// chemistry — see balancedAssign above. Fresh split, so both sides start
// empty with a full team's worth of capacity each.
function computeRandomSplit(){
  const n = S.format;
  const capA = n + (S.oddSide==='a' ? 1 : 0);
  const capB = n + (S.oddSide==='b' ? 1 : 0);
  const {sideAIds, sideBIds} = balancedAssign(S.playingIds, [], [], capA, capB);
  return {teamA: sideAIds, teamB: sideBIds, subs: S.subIds.slice()};
}

function teamFull(team, n){ return team.ids.length >= n; }

// After a sale, if exactly one team is now full, hand every remaining
// un-auctioned player to the other team for free until it's full too
// (or players run out) — this is the "ran out of budget" catch-up rule.
// capA/capB are usually both S.format, but differ by one when an uneven
// "extra player" match was confirmed at setup.
function runAutoFill(auction, capA, capB){
  const aFull = teamFull(auction.teamA, capA);
  const bFull = teamFull(auction.teamB, capB);
  if(aFull === bFull) return auction; // both full, both open, or roster already exhausted below

  const shortTeam = aFull ? auction.teamB : auction.teamA;
  const shortCap = aFull ? capB : capA;
  const shortKey = aFull ? 'teamB' : 'teamA';
  while(auction.index < auction.order.length && shortTeam.ids.length < shortCap){
    const pid = auction.order[auction.index];
    shortTeam.ids.push(pid);
    auction.log.push({playerId:pid, team:shortKey==='teamA'?'a':'b', price:0, free:true});
    auction.index++;
  }
  return auction;
}

function finishAuctionIfDone(auction, capA, capB){
  const bothFull = teamFull(auction.teamA,capA) && teamFull(auction.teamB,capB);
  const exhausted = auction.index >= auction.order.length;
  if(bothFull || exhausted){ auction.done = true; }
  return auction;
}

/* ============================= Database actions ============================= */

// Ability rank normally only moves for a reason: a manual edit (the ▲▼
// arrows, or ranking someone for the first time) or an automatic nudge after
// a win. The automatic nudges are meant to reflect *this month's* form —
// rankBaseline is "the order as it was last set on purpose", and every
// manual edit updates it immediately. At the start of a new calendar month,
// applyMonthlyRankReset snaps the live order back to that baseline, undoing
// whatever the automatic win-nudges drifted it to, while anything the host
// deliberately changed stays exactly as they left it.
function syncRankBaseline(next){
  next.rankBaseline = next.players.map(p=>p.id);
  next.rankBaselineMonth = currentYearMonth();
  return next;
}
function applyMonthlyRankReset(next){
  const month = currentYearMonth();
  if(next.rankBaselineMonth === month) return next; // already current
  if(!next.rankBaseline || !next.rankBaseline.length){
    // never tracked a baseline before (older data) — adopt today's order as
    // the starting point rather than reverting to nothing
    return syncRankBaseline(next);
  }
  const byId = {};
  next.players.forEach(p=> byId[p.id]=p);
  const reverted = [];
  next.rankBaseline.forEach(id=>{ if(byId[id]){ reverted.push(byId[id]); delete byId[id]; } });
  // anyone current the baseline doesn't know about (graduated from unranked
  // mid-month, or added after the baseline was captured) — keep them, in
  // their current relative order, appended at the end
  next.players.forEach(p=>{ if(byId[p.id]){ reverted.push(p); delete byId[p.id]; } });
  next.players = reverted;
  return syncRankBaseline(next);
}
// Cheap to call on every squad load — only actually rewrites anything the
// first time it notices the calendar month has moved on.
function ensureRankBaselineFresh(){
  if(SQUAD.rankBaselineMonth === currentYearMonth()) return;
  saveSquadDoc(applyMonthlyRankReset(cloneSquad()));
}

function addPlayer(name, positions, attributes, unknown, star){
  name = name.trim();
  if(!name) return;
  positions = (positions||[]).filter(p=>POSITIONS[p]);
  if(!positions.length) positions = ['MID'];
  const cleanAttrs = {};
  Object.keys(attributes||{}).forEach(k=>{
    if(ATTRIBUTES[k] && (attributes[k]===1 || attributes[k]===2)) cleanAttrs[k]=attributes[k];
  });
  const existingIds = allPlayerIds();
  const id = uniqueId(slugify(name), existingIds);
  const player = {id, name, positions, attributes:cleanAttrs, star: !!star};
  const next = cloneSquad();
  if(unknown) next.unrankedPlayers = (next.unrankedPlayers||[]).concat([player]);
  else { next.players = next.players.concat([player]); syncRankBaseline(next); }
  saveSquadDoc(next);
  saveState({selectedIds: (S.selectedIds||[]).concat([id])});
}

// A one-off fill-in for today only. Counts toward today's balancing (treated
// like any other unranked/average-ability player) and today's history entry,
// but lives in SQUAD.guests — never the ranked/unranked roster — so it never
// shows up in roster management, next time's match-day picker, the
// chemistry-link builder, or the monthly awards board. Open to anyone, same
// as ticking your own name in the picker.
function addGuestPlayer(name, positions){
  name = (name||'').trim();
  if(!name) return;
  positions = (positions||[]).filter(p=>POSITIONS[p]);
  if(!positions.length) positions = ['MID'];
  const id = uniqueId(slugify(name), allPlayerIds());
  const guest = {id, name, positions, guest:true};
  const next = cloneSquad();
  next.guests = (next.guests||[]).concat([guest]);
  saveSquadDoc(next);
  saveState({selectedIds: (S.selectedIds||[]).concat([id])});
}
function toggleGuestPosition(pos, btn){
  const has = guestForm.positions.includes(pos);
  if(has && guestForm.positions.length<=1) return; // always keep at least one
  guestForm.positions = has ? guestForm.positions.filter(x=>x!==pos) : guestForm.positions.concat([pos]);
  if(btn) btn.classList.toggle('active');
}
function submitGuestPlayer(){
  if(!isHost()) return;
  addGuestPlayer(guestForm.name, guestForm.positions);
  guestForm = {name:'', positions:['MID']};
  render();
}

// Bring a not-yet-ranked player into the ability ordering, inserted at the
// middle for now — nudge them up/down with the arrows once you've actually
// seen them play (or let a couple of wins do it automatically).
function rankPlayerNow(id){
  const next = cloneSquad();
  const p = (next.unrankedPlayers||[]).find(x=>x.id===id);
  if(!p) return;
  next.unrankedPlayers = next.unrankedPlayers.filter(x=>x.id!==id);
  next.players.splice(Math.round(next.players.length/2), 0, p);
  syncRankBaseline(next);
  saveSquadDoc(next);
}

function toggleEditPanel(id){
  editingPlayerId = (editingPlayerId===id) ? null : id;

}
function togglePlayerPosition(id, pos){
  const flip = arr => arr.map(p=>{
    if(p.id!==id) return p;
    const positions = p.positions||[];
    const has = positions.includes(pos);
    if(has && positions.length<=1) return p; // always keep at least one
    return Object.assign({}, p, {positions: has ? positions.filter(x=>x!==pos) : positions.concat([pos])});
  });
  const next = cloneSquad();
  next.players = flip(next.players);
  next.unrankedPlayers = flip(next.unrankedPlayers||[]);
  saveSquadDoc(next);
}
// Cycles a player's attribute through off → normal → "+" (exceptional) → off.
function togglePlayerAttribute(id, attr){
  const cycle = arr => arr.map(p=>{
    if(p.id!==id) return p;
    const cur = attributesOf(p.id)[attr] || 0;
    const next = (cur+1) % 3;
    const attrs = Object.assign({}, attributesOf(p.id));
    if(next===0) delete attrs[attr]; else attrs[attr]=next;
    return Object.assign({}, p, {attributes:attrs});
  });
  const next = cloneSquad();
  next.players = cycle(next.players);
  next.unrankedPlayers = cycle(next.unrankedPlayers||[]);
  saveSquadDoc(next);
}
function togglePlayerStar(id){
  const flip = arr => arr.map(p=> p.id===id ? Object.assign({}, p, {star: !p.star}) : p);
  const next = cloneSquad();
  next.players = flip(next.players);
  next.unrankedPlayers = flip(next.unrankedPlayers||[]);
  saveSquadDoc(next);
}
// Long-term unavailable (injured, traveling, etc.) — hidden from the
// match-day picker without touching their stats/history/rank. Distinct from
// just not ticking them for one match: this persists week to week until
// flipped back.
function toggleUnavailable(id){
  const flip = arr => arr.map(p=> p.id===id ? Object.assign({}, p, {unavailable: !p.unavailable}) : p);
  const next = cloneSquad();
  next.players = flip(next.players);
  next.unrankedPlayers = flip(next.unrankedPlayers||[]);
  saveSquadDoc(next);
}

function removePlayer(id){
  const next = cloneSquad();
  next.players = next.players.filter(p=>p.id!==id);
  next.unrankedPlayers = (next.unrankedPlayers||[]).filter(p=>p.id!==id);
  next.chemistryGroups = (next.chemistryGroups||[]).map(g=>g.filter(x=>x!==id)).filter(g=>g.length>1);
  syncRankBaseline(next);
  saveSquadDoc(next);
  saveState({selectedIds: (S.selectedIds||[]).filter(x=>x!==id)});
}

function movePlayer(id, dir){
  const next = cloneSquad();
  const idx = next.players.findIndex(p=>p.id===id);
  const j = idx+dir;
  if(idx<0 || j<0 || j>=next.players.length) return;
  [next.players[idx],next.players[j]] = [next.players[j],next.players[idx]];
  syncRankBaseline(next);
  saveSquadDoc(next);
}

/* ---- chemistry links ---- */
function toggleChemSelect(id){

function mergeChemistry(groups, ids){
  let merged = ids.slice();
  const remaining = [];
  groups.forEach(g=>{
    if(g.some(id=>merged.includes(id))) merged = Array.from(new Set(merged.concat(g)));
    else remaining.push(g);
  });
  remaining.push(merged);
  return remaining;
}
function linkChemistry(){
  if(chemSelection.length<2) return;
  const next = cloneSquad();
  next.chemistryGroups = mergeChemistry(next.chemistryGroups||[], chemSelection.slice());
  chemSelection = [];
  saveSquadDoc(next);
}
function unlinkChemistry(idx){
  const next = cloneSquad();
  next.chemistryGroups = (next.chemistryGroups||[]).slice();
  next.chemistryGroups.splice(idx,1);
  saveSquadDoc(next);
}

/* ============================= Match-flow actions ============================= */

function setFormat(n){
  // changing the format changes what "exactly enough" even means, so any
  // earlier answer to the "is there an extra player" prompt no longer applies
  saveState({format:n, oddSide:null, extraConfirmedEven:false});
}
function confirmEvenTeams(){ saveState({extraConfirmedEven:true}); }
function confirmExtraPlayer(){ saveState({oddSide: Math.random()<0.5 ? 'a' : 'b'}); }
function bumpFormatForExtra(){ setFormat(S.format+1); }

function toggleSelected(id){
  if(!isHost() && id !== getMyPlayerId()) return; // players can only tick themselves in or out
  const sel = S.selectedIds||[];
  const isIn = sel.includes(id);
  const log = (S.rsvpLog||[]).concat([{id, a: isIn ? 'out' : 'in', t:new Date().toISOString(), by: id===getMyPlayerId() ? 'self' : 'host'}]).slice(-300);
  saveState({selectedIds: isIn ? sel.filter(x=>x!==id) : sel.concat([id]), rsvpLog:log});
}

/* ---- attendance: who turns up, who drops out late ----
   A "drop-out" is someone who ticked in and then out again (themselves or via the host).
   It's "late" when that happened within LATE_HOURS of the host locking the squad. */
const ATT_WINDOW = 10, LATE_HOURS = 4;
function liveDrops(now){
  const sel = new Set(S.selectedIds||[]);
  const last = {}, everIn = new Set();
  (S.rsvpLog||[]).forEach(e=>{ last[e.id] = e; if(e.a==='in') everIn.add(e.id); });
  const out = [];
  Object.keys(last).forEach(id=>{
    const e = last[id];
    if(e.a==='out' && everIn.has(id) && !sel.has(id) && !isGuest(id) && findPlayer(id)){
      const hrs = ((now||Date.now()) - new Date(e.t).getTime()) / 36e5;
      out.push({id, late: hrs <= LATE_HOURS, at:e.t});
    }
  });
  return out;
}
function buildAttendanceSnap(){
  return {
    at:new Date().toISOString(),
    expected:(S.selectedIds||[]).filter(id=>!isGuest(id)),
    dropped:liveDrops().map(d=>({id:d.id, late:d.late}))
  };
}
function goToMode(){
  const pool = computePlayingPool();
  saveState(Object.assign({phase:'mode', attSnap:buildAttendanceSnap()}, pool));
}

function backToSetup(){
  saveState({phase:'setup', mode:null, randomResult:null, captains:{a:null,b:null},
    captainPickMode:null, auction:null, playingIds:null, subIds:null});
}

function chooseMode(mode){
  if(mode==='random'){
    saveState({mode:'random', phase:'random', randomResult: computeRandomSplit()});
  }else{
    saveState({mode:'draft', phase:'captains', captainPickMode:null, captains:{a:null,b:null}});
  }
}

function reshuffleRandom(){

function confirmRandom(){

function setCaptainPickMode(m){

function manualPick(id){

  if(caps.a===id || caps.b===id) return;
  if(!caps.a){ caps.a = id; manualPickStage = 'b'; }

function startAuction(budget, basePrice, increment, timerSecs){
  const order = S.playingIds
    .filter(id=> id!==S.captains.a && id!==S.captains.b)
    .sort((x,y)=> rankOf(y)-rankOf(x));
  const auction = {
    order, index:0,
    currentBid: basePrice, leader:null, passesInARow:0,
    openToggle:true, turn:'a',
    teamA:{ids:[S.captains.a], budget}, teamB:{ids:[S.captains.b], budget},
    // per-team roster size — usually both S.format, but one side carries the
    // extra player when the host confirmed an odd headcount at setup
    capA: S.format + (S.oddSide==='a' ? 1 : 0),
    capB: S.format + (S.oddSide==='b' ? 1 : 0),
    log:[], done:false, savedToHistory:false
  };
  nextPlayerSetup(auction, basePrice); // seed the correct opening turn for player #1
  saveState({phase:'auction', budget, basePrice, increment, timerSecs: (timerSecs!=null && isFinite(timerSecs)) ? timerSecs : S.timerSecs, auction});
}

function nextPlayerSetup(auction, basePrice){
  auction.currentBid = basePrice;
  auction.leader = null;
  auction.passesInARow = 0;
  auction.turn = auction.openToggle ? 'a' : 'b';
  auction.openToggle = !auction.openToggle;
  return auction;
}

function auctionBid(team){
  const a = JSON.parse(JSON.stringify(S.auction));
  if(a.done || a.turn!==team) return;
  a.note = null;
  const teamObj = team==='a' ? a.teamA : a.teamB;
  if(teamObj.budget < a.currentBid) return;
  a.leader = team;
  a.passesInARow = 0;
  a.turn = team==='a' ? 'b' : 'a';
  // price for the *next* raise
  a.pendingLeaderPrice = a.currentBid;
  a.currentBid = a.currentBid + S.increment;
  saveState({auction:a});
}

function auctionPass(team, auto){
  const a = JSON.parse(JSON.stringify(S.auction));
  if(a.done || a.turn!==team) return;
  a.note = auto ? 'Team ' + team.toUpperCase() + ' ran out of time \u2014 passed automatically.' : null;
  // fall back to S.format for an auction started before capA/capB existed
  if(a.capA==null) a.capA = S.format;
  if(a.capB==null) a.capB = S.format;

  if(a.leader){
    // sell to the leader at the price they locked in
    const winner = a.leader;
    const price = a.pendingLeaderPrice != null ? a.pendingLeaderPrice : S.basePrice;
    const pid = a.order[a.index];
    const teamObj = winner==='a' ? a.teamA : a.teamB;
    teamObj.ids.push(pid);
    teamObj.budget -= price;
    a.log.push({playerId:pid, team:winner, price, free:false});
    a.index++;
    runAutoFill(a, a.capA, a.capB);
    finishAuctionIfDone(a, a.capA, a.capB);
    if(!a.done) nextPlayerSetup(a, S.basePrice);
  } else {
    a.passesInARow++;
    if(a.passesInARow>=2){
      // nobody wanted this player at the asking price — hand it to
      // whichever team currently has fewer players
      const pid = a.order[a.index];
      const short = a.teamA.ids.length <= a.teamB.ids.length ? 'a' : 'b';
      const teamObj = short==='a' ? a.teamA : a.teamB;
      teamObj.ids.push(pid);
      a.log.push({playerId:pid, team:short, price:0, free:true});
      a.index++;
      runAutoFill(a, a.capA, a.capB);
      finishAuctionIfDone(a, a.capA, a.capB);
      if(!a.done) nextPlayerSetup(a, S.basePrice);
    } else {
      a.turn = team==='a' ? 'b' : 'a';
    }
  }
  saveState({auction:a});
}

// What each player went for in the auction: {playerId: {p:price, f:true if handed out free}}.
function auctionPriceMap(a){
  const out = {};
  (a.log||[]).forEach(l=>{ if(l && l.playerId) out[l.playerId] = {p: l.price||0, f: !!l.free}; });
  return out;
}
function saveAuctionToHistory(){
  const a = S.auction;
  resultDraft = {winner:null, scoreA:'', scoreB:'', duration:'', scorers:[], assists:[], saved:false};
  const id = addToHistory({
    date:new Date().toISOString(),
    format:S.format,
    mode:'draft',
    teamA:{captain:playerName(S.captains.a), players:a.teamA.ids.map(playerName)}, teamAIds:a.teamA.ids,
    teamB:{captain:playerName(S.captains.b), players:a.teamB.ids.map(playerName)}, teamBIds:a.teamB.ids,
    subs:(S.subIds||[]).map(playerName), subIds:S.subIds||[],
    att:S.attSnap || null,
    prices: auctionPriceMap(a),
    captainIds:{a:S.captains.a||null, b:S.captains.b||null}
  });
  saveState({auction:Object.assign({}, a, {savedToHistory:true}), phase:'complete', lastHistoryId:id});
}

// Lets either captain (or the host) stop bidding early and have whatever's
// left of the roster divided between the two teams — still balanced by
// ability, position and chemistry against what each side already bought.
function randomizeRemaining(){
  const a = JSON.parse(JSON.stringify(S.auction));
  if(a.done) return;
  const capA = a.capA || S.format, capB = a.capB || S.format;
  const remaining = a.order.slice(a.index);
  const needA = Math.max(0, capA - a.teamA.ids.length);
  const needB = Math.max(0, capB - a.teamB.ids.length);
  const {sideAIds, sideBIds} = balancedAssign(remaining, a.teamA.ids, a.teamB.ids, needA, needB);
  sideAIds.forEach(pid=>{ a.teamA.ids.push(pid); a.log.push({playerId:pid, team:'a', price:0, free:true}); });
  sideBIds.forEach(pid=>{ a.teamB.ids.push(pid); a.log.push({playerId:pid, team:'b', price:0, free:true}); });
  a.index = a.order.length;
  a.leader = null;
  a.done = true;
  saveState({auction:a});
}

function getCompleteTeamIds(){
  if(S.mode==='draft' && S.auction){
    return {teamAIds:S.auction.teamA.ids, teamBIds:S.auction.teamB.ids, subIds:S.subIds||[]};
  } else if(S.randomResult){
    return {teamAIds:S.randomResult.teamA, teamBIds:S.randomResult.teamB, subIds:S.randomResult.subs};
  }
  return {teamAIds:[], teamBIds:[], subIds:[]};
}

function startNewMatch(){
  saveState(Object.assign(defaultState(), {
    format:S.format,
    selectedIds:(S.selectedIds||[]).filter(id=>findPlayer(id)),
    budget:S.budget, basePrice:S.basePrice, increment:S.increment, timerSecs:S.timerSecs,
    // anyone carried over from last time counts as "in" from now, so pulling out late is still noticed
    rsvpLog:(S.selectedIds||[]).filter(id=>findPlayer(id)).map(id=>({id, a:'in', t:new Date().toISOString(), by:'carry'}))
  }));
}

// Which roster player this device belongs to, if any — scoped per squad
// since the same phone might be a captain in one squad and a spectator in
// another. null means "just spectating".
function normName(s){ return String(s||'').trim().replace(/\s+/g,' ').toLowerCase(); }
function getLoginName(){
  try{ return localStorage.getItem('md_login_name') || ''; }catch(e){ return ''; }
}
function findPlayerByName(name){
  const n = normName(name);
  if(!n) return null;
  return allPlayersArr().find(p=>normName(p.name)===n) || null;
}
// Login is just a name: whichever player in this squad's roster has that name.
// Stored as a name (not an id) so it keeps working if the host switches squads
// and the same person is in both.
function getMyPlayerId(){
  const p = findPlayerByName(getLoginName());
  return p ? p.id : null;
}
/* ---- optional 4-digit PIN: stops someone typing a captain's name and bidding for them.
   Stored only as a salted SHA-256 hash in a shared doc, so it works from any phone. ---- */
const _pinKeyCache = {};
function pinKey(name){
  const n = normName(name);
  return _pinKeyCache[n] || (_pinKeyCache[n] = sha256Hex('md-pin-key|' + n).slice(0, 24));
}
function pinHash(name, pin){ return sha256Hex('md-pin|' + normName(name) + '|' + pin); }
function localPinHash(){ try{ return localStorage.getItem('md_login_pin') || ''; }catch(e){ return ''; } }
function hasPin(name){ return !!(db && PINS[pinKey(name)]); }
// Signed in as a name that has a PIN, but this phone hasn't proven it knows it
// (or the PIN was changed on another phone) -> back to the PIN prompt.
function pinLocked(){
  const n = getLoginName();
  if(!db || !n) return false;
  const h = PINS[pinKey(n)];
  return !!h && localPinHash() !== h;
}
function currentPinStep(){
  if(pinStep) return pinStep;
  const n = getLoginName();
  if(n && getMyPlayerId() && pinLocked()) return {name:n};
  return null;
}
function isLoggedIn(){ return !!getMyPlayerId() && !pinLocked(); }
function doLoginAs(name, hash){
  try{
    localStorage.setItem('md_login_name', name);
    if(hash) localStorage.setItem('md_login_pin', hash); else localStorage.removeItem('md_login_pin');
  }catch(e){}
}
function submitLogin(){
  if(currentPinStep()){ submitPin(); return; }
  const typed = (loginDraft||'').trim();
  if(!typed){ loginError = 'Type your name first.'; render(); return; }
  const p = findPlayerByName(typed);
  if(!p){ loginError = 'We couldn’t find “' + typed + '”. Check the spelling, or ask the host to add you.'; render(); return; }
  loginDraft = ''; loginError = '';
  if(hasPin(p.name)){
    pinStep = {name:p.name}; pinDraft = ''; pinError = '';
    try{ localStorage.removeItem('md_login_name'); localStorage.removeItem('md_login_pin'); }catch(e){}
    render(); return;
  }
  doLoginAs(p.name, '');
  render();
}
function submitPin(){
  const step = currentPinStep(); if(!step) return;
  const now = Date.now();
  if(now < pinLockUntil){ pinError = 'Too many wrong tries — wait a few seconds and try again.'; render(); return; }
  if(!/^\d{4}$/.test(pinDraft)){ pinError = 'Enter your 4 digits.'; render(); return; }
  const h = pinHash(step.name, pinDraft);
  if(h === PINS[pinKey(step.name)]){
    doLoginAs(step.name, h);
    pinStep = null; pinDraft = ''; pinError = ''; pinFails = 0;
  }else{
    pinFails++;
    if(pinFails >= 5){ pinFails = 0; pinLockUntil = now + 30000; pinError = 'Too many wrong tries — try again in 30 seconds.'; }
    else pinError = 'That PIN isn’t right.';
    pinDraft = '';
  }
  render();
}
function pinCancel(){
  pinStep = null; pinDraft = ''; pinError = '';
  try{ localStorage.removeItem('md_login_name'); localStorage.removeItem('md_login_pin'); }catch(e){}
  render();
}
function openPinModal(){ pinModalOpen = true; pinSetDraft = ''; pinSetError = ''; render(); }
function markPinSkipped(){
  try{
    const k = pinKey(getLoginName());
    const list = JSON.parse(localStorage.getItem('md_pin_skip') || '[]');
    if(!list.includes(k)){ list.push(k); localStorage.setItem('md_pin_skip', JSON.stringify(list)); }
  }catch(e){}
}
function closePinModal(skip){ if(skip) markPinSkipped(); pinModalOpen = false; pinSetDraft = ''; pinSetError = ''; render(); }
function savePin(){
  const name = getLoginName();
  if(!name || !db) return;
  if(!/^\d{4}$/.test(pinSetDraft)){ pinSetError = 'Pick exactly 4 digits.'; render(); return; }
  const h = pinHash(name, pinSetDraft);
  const k = pinKey(name);
  PINS[k] = h;
  try{ localStorage.setItem('md_login_pin', h); }catch(e){}
  db.doc('pins/' + k).set({h, at:new Date().toISOString()}).catch(()=>{});
  pinModalOpen = false; pinSetDraft = ''; pinSetError = '';
  render();
}
function removeMyPin(){
  const name = getLoginName();
  if(!name || !db) return;
  const k = pinKey(name);
  delete PINS[k];
  try{ localStorage.removeItem('md_login_pin'); }catch(e){}
  db.doc('pins/' + k).delete().catch(()=>{});
  markPinSkipped();
  pinModalOpen = false; render();
}
// Host only: a player forgot their PIN — clear it so they can log in by name again.
function hostResetPin(playerId){
  if(!isHost() || !db) return;
  if(pinResetArm !== playerId){
    pinResetArm = playerId; render();
    setTimeout(()=>{ if(pinResetArm === playerId){ pinResetArm = null; render(); } }, 4000);
    return;
  }
  pinResetArm = null;
  const p = findPlayer(playerId); if(!p) return;
  const k = pinKey(p.name);

  db.doc('pins/' + k).delete().catch(()=>{});
  render();
}
function shouldOfferPin(){
  if(!db || isHost() || !isLoggedIn()) return false;
  const k = pinKey(getLoginName());
  if(PINS[k]) return false;
  try{ return !JSON.parse(localStorage.getItem('md_pin_skip') || '[]').includes(k); }catch(e){ return true; }
}
function logout(){

  loginDraft = ''; loginError = '';

}

function copyTeamSheet(){
  const text = buildTeamSheetText();
  if(!text) return;
  const onDone = () => {
    copyFeedback = true; render();
    setTimeout(()=>{ copyFeedback = false; render(); }, 1800);
  };
  const fallback = () => {
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      onDone();
    }catch(e){ /* clipboard unavailable — nothing more we can do */ }
  };
  try{
    if(navigator && navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(onDone).catch(fallback);
    }else{
      fallback();
    }
  }catch(e){ fallback(); }
}
