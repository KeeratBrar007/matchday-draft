/* ---- database lock: anonymous sign-in + a host claim the security rules check ----
   Every phone signs in anonymously (no account, nothing to type). The host's phone
   then writes hostClaims/<its sign-in id> containing the host code; the Firestore
   rules only accept that write if the code is right, and only let phones with a
   claim change the roster, results and squads. */
async function ensureAuth(){
  if(!FB_AUTH){ authStatus = 'none'; return; }
  try{
    const res = await Promise.race([
      FB_AUTH.signInAnonymously(),
      new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}), 8000))
    ]);
    AUTH_UID = (res && res.user && res.user.uid) || (FB_AUTH.currentUser && FB_AUTH.currentUser.uid) || null;
    authStatus = AUTH_UID ? 'ok' : 'error';
  }catch(e){
    const c = (e && e.code) || '';
    authStatus = (c==='auth/operation-not-allowed' || c==='auth/admin-restricted-operation') ? 'off' : 'error';
  }
}
async function syncHostClaim(){
  if(!isHostDevice){ hostClaimState = 'na'; return; }
  if(!db || !AUTH_UID){ hostClaimState = 'unknown'; return; }
  const ref = db.doc('hostClaims/' + AUTH_UID);
  if(pendingHostCode){
    try{
      await ref.set({code: pendingHostCode, at: new Date().toISOString()});
      pendingHostCode = null;
      hostClaimState = 'ok';
      try{ localStorage.setItem('md_host_uid', AUTH_UID); }catch(e){}
      reconnectAll();   // now allowed to see every game
    }catch(e){ hostClaimState = 'needed'; }
    render(); return;
  }
  let known = null; try{ known = localStorage.getItem('md_host_uid'); }catch(e){}
  if(known === AUTH_UID){ hostClaimState = 'ok'; return; }
  try{
    const snap = await ref.get();
    hostClaimState = snap.exists ? 'ok' : 'needed';
    if(snap.exists){ try{ localStorage.setItem('md_host_uid', AUTH_UID); }catch(e){} }
  }catch(e){ hostClaimState = 'unknown'; }
  render();
}

function onWriteError(e, path){
  if(!e || e.code !== 'permission-denied') return;
  if(path && /^(logins|access)\//.test(String(path))) return;
  if(path && String(path).indexOf('/pollVotes/') >= 0){
    deniedToast = isHost()
      ? 'Poll answers can’t be saved yet: add the poll rule in Firebase (SETUP.md, Part 7).'
      : 'Your answer wasn’t saved: the host still needs to switch polls on in the database.';
    clearTimeout(deniedTimer); deniedTimer = setTimeout(()=>{ deniedToast = null; render(); }, 8000);
    render(); return;
  }
  if(isHost()){ hostClaimState = 'needed'; deniedToast = 'That change wasn’t saved. Confirm your host code in the yellow box at the top, then try again.'; }
  else { deniedToast = 'That change wasn’t saved — only the host can do that.'; try{ resyncNow(true); }catch(_){} }
  clearTimeout(deniedTimer); deniedTimer = setTimeout(()=>{ deniedToast = null; render(); }, 6000);
  render();
}

}

// The manual fallback for becoming host on a device that didn't come in
// through the secret host link — same shared secret, just typed in instead.

// Which roster player this device belongs to, if any — scoped per squad
// since the same phone might be a captain in one squad and a spectator in
// another. null means "just spectating".
function normName(s){ return String(s||'').trim().replace(/\s+/g,' ').toLowerCase(); }
function getLoginName(){
  try{ return localStorage.getItem('md_login_name') || ''; }catch(e){ return ''; }
}
function findPlayerByName(name){
  const n = normName(name);
  if(!n) return null;
  return allPlayersArr().find(p=>normName(p.name)===n) || null;
}
// Login is just a name: whichever player in this squad's roster has that name.
// Stored as a name (not an id) so it keeps working if the host switches squads
// and the same person is in both.
function getMyPlayerId(){
  const p = findPlayerByName(getLoginName());
  return p ? p.id : null;
}
/* ---- optional 4-digit PIN: stops someone typing a captain's name and bidding for them.
   Stored only as a salted SHA-256 hash in a shared doc, so it works from any phone. ---- */
const _pinKeyCache = {};
function pinKey(name){
  const n = normName(name);
  return _pinKeyCache[n] || (_pinKeyCache[n] = sha256Hex('md-pin-key|' + n).slice(0, 24));
}
function pinHash(name, pin){ return sha256Hex('md-pin|' + normName(name) + '|' + pin); }
function localPinHash(){ try{ return localStorage.getItem('md_login_pin') || ''; }catch(e){ return ''; } }
function hasPin(name){ return !!(db && PINS[pinKey(name)]); }
// Signed in as a name that has a PIN, but this phone hasn't proven it knows it
// (or the PIN was changed on another phone) -> back to the PIN prompt.
function pinLocked(){
  const n = getLoginName();
  if(!db || !n) return false;
  const h = PINS[pinKey(n)];
  return !!h && localPinHash() !== h;
}
function currentPinStep(){
  if(pinStep) return pinStep;
  const n = getLoginName();
  if(n && getMyPlayerId() && pinLocked()) return {name:n};
  return null;
}
function isLoggedIn(){
  if(pinLocked()) return false;
  if(getMyPlayerId()) return true;
  // privacy rules: trust the login until the name index has answered, then require at least one game
  if(db && squadsMode==='access' && getLoginName()) return accessIds===null || accessIds.length > 0;
  // on another game's list counts too (this game just shows view-only)
  return !!db && !!getLoginName() && (!allRostersLoaded || gamesForName(getLoginName()).length > 0);
}
function doLoginAs(name, hash){
  try{
    localStorage.setItem('md_login_name', name);
    if(hash) localStorage.setItem('md_login_pin', hash); else localStorage.removeItem('md_login_pin');
  }catch(e){}
  afterLogin();
}
const loginAccessChecked = {}, loginRetried = {};
function submitLogin(){
  if(currentPinStep()){ submitPin(); return; }
  const typed = (loginDraft||'').trim();
  if(!typed){ loginError = 'Type your name first.'; render(); return; }
  let p = findPlayerByName(typed);
  if(!p && db){
    if(!allRostersLoaded && squadsMode==='list'){ loginError = 'Checking…'; loginRetryPending = true; loadAllRosters(); render(); return; }
    const games = gamesForName(typed);
    if(games.length){
      const real = namesInGame(games[0].id).find(x=>normName(x)===normName(typed));
      p = {name: real || typed};
      if(!pickedSquadId && games.length===1) switchSquad(games[0].id);
    }else if(!loginAccessChecked[normName(typed)]){
      // privacy rules: this phone can't see the player lists yet, so ask the name index
      loginError = 'Checking…'; render();
      db.doc('access/' + accessKey(typed)).get().then(snap=>{
        const ids = (snap.exists && snap.data() && snap.data().squads) || [];
        if(!ids.length && !loginRetried[normName(typed)]){
          // just added by the host? their app publishes the list a moment later - look once more
          loginRetried[normName(typed)] = true;
          setTimeout(submitLogin, 1500); return;
        }
        loginAccessChecked[normName(typed)] = ids.length ? 'yes' : 'no';
        if(ids.length && !pickedSquadId && ids.length===1){ pickedSquadId = ids[0]; try{ localStorage.setItem('md_squad', ids[0]); }catch(e){} }
        submitLogin();
      }).catch(()=>{ loginAccessChecked[normName(typed)] = 'no'; submitLogin(); });
      return;
    }else{
      // use the index answer once; a "not found" is re-checked next time (the host may have just added them)
      if(loginAccessChecked[normName(typed)]==='yes') p = {name: typed};
      delete loginAccessChecked[normName(typed)]; delete loginRetried[normName(typed)];
    }
  }
  if(!p){ loginError = 'We couldn’t find “' + typed + '”. Check the spelling, or ask the host to add you.'; render(); return; }
  if(!pickedSquadId && db && squadsList.length>1){
    const g = gamesForName(p.name);
    if(g.length===1) switchSquad(g[0].id);
  }
  loginDraft = ''; loginError = '';
  if(hasPin(p.name)){
    pinStep = {name:p.name}; pinDraft = ''; pinError = '';
    try{ localStorage.removeItem('md_login_name'); localStorage.removeItem('md_login_pin'); }catch(e){}
    render(); return;
  }
  doLoginAs(p.name, '');
  render();
}
function submitPin(){
  const step = currentPinStep(); if(!step) return;
  const now = Date.now();
  if(now < pinLockUntil){ pinError = 'Too many wrong tries — wait a few seconds and try again.'; render(); return; }
  if(!/^\d{4}$/.test(pinDraft)){ pinError = 'Enter your 4 digits.'; render(); return; }
  const h = pinHash(step.name, pinDraft);
  if(h === PINS[pinKey(step.name)]){
    doLoginAs(step.name, h);
    pinStep = null; pinDraft = ''; pinError = ''; pinFails = 0;
  }else{
    pinFails++;
    if(pinFails >= 5){ pinFails = 0; pinLockUntil = now + 30000; pinError = 'Too many wrong tries — try again in 30 seconds.'; }
    else pinError = 'That PIN isn’t right.';
    pinDraft = '';
  }
  render();
}
function pinCancel(){
  pinStep = null; pinDraft = ''; pinError = '';
  try{ localStorage.removeItem('md_login_name'); localStorage.removeItem('md_login_pin'); }catch(e){}
  render();
}

  const lines = [];

  lines.push('');

function copyTeamSheet(){
  const text = buildTeamSheetText();
  if(!text) return;
  const onDone = () => {
    copyFeedback = true; render();
    setTimeout(()=>{ copyFeedback = false; render(); }, 1800);
  };
  const fallback = () => {
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      onDone();
    }catch(e){ /* clipboard unavailable — nothing more we can do */ }
  };
  try{
    if(navigator && navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(onDone).catch(fallback);
    }else{
      fallback();
    }
  }catch(e){ fallback(); }
}

/* ============================= Match results & stats ============================= */

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

// How many rank spots a win is worth. A short kickabout barely moves
// anyone; a long session moves more. A lopsided scoreline moves more than
// a squeaker. And an upset — the team that was, on paper, weaker coming in
// — moves more than a "favorite wins as expected" result, which barely
// moves at all. Everything folds into one integer shift (1-5 spots).
function computeRankShift(teamAIds, teamBIds, winner, scoreA, scoreB, durationMinutes){
  if(winner!=='a' && winner!=='b') return 1;
  const winIds = winner==='a' ? teamAIds : teamBIds;
  const loseIds = winner==='a' ? teamBIds : teamAIds;
  const avgRank = ids => ids.length ? ids.reduce((s,id)=>s+rankOf(id),0)/ids.length : 0;
  const winAvg = avgRank(winIds), loseAvg = avgRank(loseIds);
  const span = Math.max(1, SQUAD.players.length - 1);

  const mins = Number(durationMinutes) * (SPORT.lengthToMin||1);
  const durationFactor = (mins>0) ? clamp(mins/60, 0.4, 1.8) : 1;

  let marginFactor = 1;
  if(scoreA!=null && scoreB!=null && !isNaN(scoreA) && !isNaN(scoreB)){
    marginFactor = clamp(1 + (Math.abs(scoreA-scoreB)/(SPORT.marginUnit||1))*0.15, 1, 2);
  }

  // positive when the winners were the weaker side coming in (an upset)
  const upset = (loseAvg - winAvg) / span;
  const upsetFactor = clamp(1 + upset*1.2, 0.4, 1.8);

  const raw = durationFactor * marginFactor * upsetFactor;
  return clamp(Math.round(raw), 1, 5);
}

// Applies everything a recorded result affects: play/win/loss/draw/goal
// tallies, a graduation + rank nudge (bigger for longer/lopsided/upset
// wins) for winners, and automatic chemistry links for pairs who've now
// won together three times.
function applyMatchOutcome(teamAIds, teamBIds, winner, scorers, scoreA, scoreB, durationMinutes, assists){
  const rankShift = computeRankShift(teamAIds, teamBIds, winner, scoreA, scoreB, durationMinutes);
  const next = cloneSquad();
  next.stats = Object.assign({}, next.stats||{});
  const bump = (id, key) => {
    next.stats[id] = Object.assign({played:0,wins:0,losses:0,draws:0,goals:0,assists:0}, next.stats[id]);
    next.stats[id][key]++;
  };
  teamAIds.concat(teamBIds).forEach(id=>{
    next.stats[id] = Object.assign({played:0,wins:0,losses:0,draws:0,goals:0,assists:0}, next.stats[id]);
    next.stats[id].played++;
  });
  if(winner==='a'){ teamAIds.forEach(id=>bump(id,'wins')); teamBIds.forEach(id=>bump(id,'losses')); }
  else if(winner==='b'){ teamBIds.forEach(id=>bump(id,'wins')); teamAIds.forEach(id=>bump(id,'losses')); }
  else if(winner==='draw'){ teamAIds.concat(teamBIds).forEach(id=>bump(id,'draws')); }
  (scorers||[]).forEach(s=>{
    if(!s.playerId || !s.goals) return;
    next.stats[s.playerId] = Object.assign({played:0,wins:0,losses:0,draws:0,goals:0,assists:0}, next.stats[s.playerId]);
    next.stats[s.playerId].goals += s.goals;
  });
  (assists||[]).forEach(a=>{
    if(!a.playerId || !a.assists) return;
    next.stats[a.playerId] = Object.assign({played:0,wins:0,losses:0,draws:0,goals:0,assists:0}, next.stats[a.playerId]);
    next.stats[a.playerId].assists += a.assists;
  });

  const winningIds = winner==='a' ? teamAIds.slice() : winner==='b' ? teamBIds.slice() : [];

  // graduate unranked winners into the ranked list before nudging anyone
  winningIds.forEach(id=>{
    const u = (next.unrankedPlayers||[]).find(p=>p.id===id);
    if(u){
      next.unrankedPlayers = next.unrankedPlayers.filter(p=>p.id!==id);
      next.players.splice(Math.round(next.players.length/2), 0, u);
    }
  });
  // nudge each winner up by the computed number of rank spots. Ability
  // rank is stored ascending (index 0 = weakest, last = strongest — same
  // convention as the "Weaker"/"Stronger" arrows in the database), so
  // moving UP means increasing the index.
  winningIds.forEach(id=>{
    let idx = next.players.findIndex(p=>p.id===id);
    let steps = rankShift;
    while(steps>0 && idx>=0 && idx < next.players.length-1){
      [next.players[idx+1], next.players[idx]] = [next.players[idx], next.players[idx+1]];
      idx++; steps--;
    }
  });
  // co-win tracking: three wins together auto-links a pair's chemistry
  next.coWin = Object.assign({}, next.coWin||{});
  if(winningIds.length>=2){
    for(let i=0;i<winningIds.length;i++){
      for(let j=i+1;j<winningIds.length;j++){
        const key = [winningIds[i],winningIds[j]].sort().join('|');
        next.coWin[key] = (next.coWin[key]||0)+1;
        if(next.coWin[key]===3){
          next.chemistryGroups = mergeChemistry(next.chemistryGroups||[], [winningIds[i], winningIds[j]]);
        }
      }
    }
  }
  saveSquadDoc(next);
}

// Undoes the play/win/loss/draw/goal counters and co-win tallies a match
// entry contributed, for deleting or editing a past result. Deliberately
// does NOT try to rewind the rank-order nudge — later matches may already
// have built on top of that ordering, so unwinding it exactly isn't
// possible in general; only the counters and (when this exact match was
// the one that crossed the threshold) the chemistry link it created are
// reversed.
function revertMatchOutcome(entry){
  if(!entry) return;
  const teamAIds = entry.teamAIds||[], teamBIds = entry.teamBIds||[];
  const winner = entry.winner, scorers = entry.scorers||[];
  if(!winner && !scorers.length && !(entry.assists||[]).length) return; // nothing was ever applied for this entry

  const next = cloneSquad();
  next.stats = Object.assign({}, next.stats||{});
  const dec = (id, key) => {
    if(!next.stats[id]) return;
    next.stats[id] = Object.assign({}, next.stats[id]);
    next.stats[id][key] = Math.max(0, (next.stats[id][key]||0) - 1);
  };
  if(winner){
    teamAIds.concat(teamBIds).forEach(id=> dec(id,'played'));
    if(winner==='a'){ teamAIds.forEach(id=>dec(id,'wins')); teamBIds.forEach(id=>dec(id,'losses')); }
    else if(winner==='b'){ teamBIds.forEach(id=>dec(id,'wins')); teamAIds.forEach(id=>dec(id,'losses')); }
    else if(winner==='draw'){ teamAIds.concat(teamBIds).forEach(id=>dec(id,'draws')); }
  }
  scorers.forEach(s=>{
    if(!s.playerId || !s.goals || !next.stats[s.playerId]) return;
    next.stats[s.playerId] = Object.assign({}, next.stats[s.playerId]);
    next.stats[s.playerId].goals = Math.max(0, next.stats[s.playerId].goals - s.goals);
  });
  (entry.assists||[]).forEach(a=>{
    if(!a.playerId || !a.assists || !next.stats[a.playerId]) return;
    next.stats[a.playerId] = Object.assign({}, next.stats[a.playerId]);
    next.stats[a.playerId].assists = Math.max(0, (next.stats[a.playerId].assists||0) - a.assists);
  });

  const winningIds = winner==='a' ? teamAIds.slice() : winner==='b' ? teamBIds.slice() : [];
  next.coWin = Object.assign({}, next.coWin||{});
  if(winningIds.length>=2){
    for(let i=0;i<winningIds.length;i++){
      for(let j=i+1;j<winningIds.length;j++){
        const key = [winningIds[i],winningIds[j]].sort().join('|');
        if(!next.coWin[key]) continue;
        const was = next.coWin[key];
        next.coWin[key] = Math.max(0, was-1);
        // only undo the auto-link if THIS match is what created it, and it
        // hasn't since merged with a bigger chemistry group
        if(was>=3 && next.coWin[key]<3){
          next.chemistryGroups = (next.chemistryGroups||[]).filter(g=>
            !(g.length===2 && g.includes(winningIds[i]) && g.includes(winningIds[j])));
        }
      }
    }
  }
  saveSquadDoc(next);
}

/* ---- sport stats: cricket and basketball record a per-player sheet.
   The two headline stats go into the same slots football uses for goals and
   assists (so every board and record works); the rest live in h.pstats. ---- */
function numOrNull(v){ return (v===''||v==null||isNaN(Number(v))) ? null : Number(v); }
function setPS(which, id, k, v){
  const d = which==='result' ? resultDraft : which==='log' ? logDraft : historyEditDraft;
  if(!d) return;
  d.ps = d.ps || {}; d.ps[id] = d.ps[id] || {};
  d.ps[id][k] = (v==='' ? '' : Math.max(0, Number(v)||0));
}
function psToRecord(ps){
  const scorers = [], assists = [], pstats = {};
  Object.keys(ps||{}).forEach(id=>{
    const r = ps[id] || {};
    const a = Number(r.s1)||0, b = Number(r.s2)||0;
    if(a>0) scorers.push({playerId:id, goals:a});
    if(b>0) assists.push({playerId:id, assists:b});
    const ex = {};
    (SPORT.extras||[]).forEach(e=>{ const v = Number(r[e.k])||0; if(v>0) ex[e.k] = v; });
    if(Object.keys(ex).length) pstats[id] = ex;
  });
  return {scorers, assists, pstats};
}
function recordToPs(h){
  const ps = {};
  (h.scorers||[]).forEach(x=>{ if(x.playerId) (ps[x.playerId] = ps[x.playerId] || {}).s1 = x.goals; });
  (h.assists||[]).forEach(x=>{ if(x.playerId) (ps[x.playerId] = ps[x.playerId] || {}).s2 = x.assists; });
  Object.keys(h.pstats||{}).forEach(id=>{ ps[id] = Object.assign(ps[id] || {}, h.pstats[id]); });
  return ps;
}
function sportResultExtras(draft){
  // fields to save alongside scorers/assists for non-football games
  const out = {};
  if(SPORT.key==='football') return out;
  const rec = psToRecord(draft.ps);
  out.scorers = rec.scorers; out.assists = rec.assists; out.pstats = rec.pstats;
  if(SPORT.teamWickets){ out.wktsA = numOrNull(draft.wktsA); out.wktsB = numOrNull(draft.wktsB); }
  return out;
}

function teamScore(h, side){
  const v = side==='a' ? h.scoreA : h.scoreB;
  if(v==null || v==='') return '–';
  const w = side==='a' ? h.wktsA : h.wktsB;
  return String(v) + (SPORT.teamWickets && w!=null && w!=='' ? '/' + w : '');
}
// one player's line for one match, in the sport's own words
function playerMatchLine(h, id){
  const g = (h.scorers||[]).filter(x=>x.playerId===id).reduce((n,x)=>n+(x.goals||0),0);
  const as = (h.assists||[]).filter(x=>x.playerId===id).reduce((n,x)=>n+(x.assists||0),0);
  const ex = (h.pstats||{})[id] || {};
  const parts = [];
  if(SPORT.key==='cricket'){
    if(g || ex.b) parts.push('🏏 ' + g + (ex.b ? ' (' + ex.b + ')' : '') + ' runs');
    if(as) parts.push('🎯 ' + s2Text(as));
    if(ex.c) parts.push('🧤 ' + ex.c + ' catch' + (ex.c===1 ? '' : 'es'));
  }else if(SPORT.key==='basketball'){
    if(g) parts.push('🏀 ' + s1Text(g));
    if(as) parts.push('💪 ' + s2Text(as));
    if(ex.ast) parts.push('🤝 ' + ex.ast + ' assist' + (ex.ast===1 ? '' : 's'));
  }else{
    if(g) parts.push((SPORT.key==='football' ? '⚽' : SPORT.s1.icon) + ' ' + s1Text(g));
    if(as) parts.push((SPORT.key==='football' ? '🅰' : SPORT.s2.icon) + ' ' + s2Text(as));
  }
  return parts.join(' · ');
}
function historyStatsLinesHtml(h){
  if(SPORT.key==='football'){
    return (h.scorers && h.scorers.length ? `<div class="hteams">⚽ Scorers: ${h.scorers.map(s=>esc(playerName(s.playerId))+' ('+s.goals+')').join(', ')}</div>` : '')
         + (h.assists && h.assists.length ? `<div class="hteams">🅰 Assists: ${h.assists.map(a=>esc(playerName(a.playerId))+' ('+a.assists+')').join(', ')}</div>` : '');
  }
  const ids = (h.teamAIds||[]).concat(h.teamBIds||[]).filter(id=>playerMatchLine(h,id));
  return ids.length ? `<div class="hteams">${ids.map(id=>esc(playerName(id)) + ': ' + esc(playerMatchLine(h,id))).join('<br>')}</div>` : '';
}

// Compares the build marker of the copy running right now with the live one on
// the server; if they differ, offers a refresh. (Skipped on the unbuilt source.)
let lastUpdateCheck = 0;
function checkForUpdate(){
  try{
    const now = Date.now();
    if(updateReady || now - lastUpdateCheck < 60000) return;
    const mine = (document.querySelector('meta[name=md-build]')||{}).content;
    if(!mine || mine === '__BUILD' + '__') return;
    lastUpdateCheck = now;
    fetch('index.html?md-check=' + now, {cache:'no-store'})
      .then(r=> r.ok ? r.text() : '')
      .then(t=>{
        const m = /<meta name="md-build" content="([^"]+)"/.exec(t);
        if(m && m[1] !== mine){ updateReady = true; render(); }
      }).catch(()=>{});
  }catch(e){}
}

/* ---- monthly awards: golden boot, leaderboard and streaks all reset each
   calendar month, computed straight from this squad's match history rather
   than a lifetime counter (rank/chemistry stay cumulative — only the
   "awards" board is scoped to one month at a time). ---- */
function yearMonthOf(dateStr){
  const d = new Date(dateStr);
  if(isNaN(d)) return null;
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function currentYearMonth(){ return yearMonthOf(new Date().toISOString()); }
function formatYearMonth(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString(undefined, {month:'long', year:'numeric'});
}
function shiftYearMonth(ym, delta){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function statsMonthPrev(){ statsMonth = shiftYearMonth(statsMonth||currentYearMonth(), -1); render(); }
function statsMonthNext(){ statsMonth = shiftYearMonth(statsMonth||currentYearMonth(), 1); render(); }
function statsMonthReset(){ statsMonth = null; render(); }

function historyForMonth(month){
  if(Array.isArray(month)) return month;      // already a list of matches (season / all-time views)
  return HISTORY.filter(h=> yearMonthOf(h.date)===month);
}
// Tallies played/win/loss/draw/goals/assists per player from just this
// month's matches — independent of SQUAD.stats, which stays a lifetime
// total. Guests are deliberately excluded so a one-off fill-in never shows
// up on the leaderboard.
function computeMonthlyStats(month){
  const stats = {};
  const bump = (id,key)=>{
    if(isGuest(id)) return;
    stats[id] = stats[id] || {played:0,wins:0,losses:0,draws:0,goals:0,assists:0};
    stats[id][key]++;
  };
  historyForMonth(month).forEach(h=>{
    const teamAIds = h.teamAIds||[], teamBIds = h.teamBIds||[];
    teamAIds.concat(teamBIds).forEach(id=> bump(id,'played'));
    if(h.winner==='a'){ teamAIds.forEach(id=>bump(id,'wins')); teamBIds.forEach(id=>bump(id,'losses')); }
    else if(h.winner==='b'){ teamBIds.forEach(id=>bump(id,'wins')); teamAIds.forEach(id=>bump(id,'losses')); }
    else if(h.winner==='draw'){ teamAIds.concat(teamBIds).forEach(id=>bump(id,'draws')); }
    (h.scorers||[]).forEach(s=>{
      if(!s.playerId || !s.goals || isGuest(s.playerId)) return;
      stats[s.playerId] = stats[s.playerId] || {played:0,wins:0,losses:0,draws:0,goals:0,assists:0};
      stats[s.playerId].goals += s.goals;
    });
    (h.assists||[]).forEach(a=>{
      if(!a.playerId || !a.assists || isGuest(a.playerId)) return;
      stats[a.playerId] = stats[a.playerId] || {played:0,wins:0,losses:0,draws:0,goals:0,assists:0};
      stats[a.playerId].assists += a.assists;
    });
  });
  return stats;
}

/* ---- Player of the match: voted by anyone who played that day, one team
   at a time — not picked by the host. Votes live on the history entry
   itself ({potmVotes:{a:{voterId:candidateId}, b:{...}}}), so they sync and
   persist just like the rest of the match record. ---- */
function computePotmTally(h, team){
  const votes = ((h&&h.potmVotes)||{})[team] || {};
  const tally = {};
  Object.values(votes).forEach(candidateId=>{ tally[candidateId] = (tally[candidateId]||0)+1; });
  return tally;
}
function computePotmWinner(h, team){
  const tally = computePotmTally(h, team);
  const ids = Object.keys(tally);
  if(!ids.length) return null;
  const max = Math.max(...ids.map(id=>tally[id]));
  const leaders = ids.filter(id=>tally[id]===max);
  return {leaders, count:max, tied: leaders.length>1};
}
function castPotmVote(historyId, team, candidateId){
  const myId = getMyPlayerId();
  const h = HISTORY.find(x=>x.id===historyId);
  if(!h || !myId) return;
  const participants = (h.teamAIds||[]).concat(h.teamBIds||[]);
  if(!participants.includes(myId)) return; // only those who actually played that day get a say
  const candidates = team==='a' ? (h.teamAIds||[]) : (h.teamBIds||[]);
  if(!candidates.includes(candidateId)) return;
  const potmVotes = Object.assign({a:{}, b:{}}, h.potmVotes);
  potmVotes[team] = Object.assign({}, potmVotes[team], {[myId]: candidateId});
  updateHistoryResult(historyId, {potmVotes});
}
function potmVotingHtml(h){
  if(!h) return '';
  const myId = getMyPlayerId();
  const participants = (h.teamAIds||[]).concat(h.teamBIds||[]);
  const canVote = !!myId && participants.includes(myId);
  function teamBlock(team, ids){
    if(!ids.length) return '';
    const votes = ((h.potmVotes||{})[team]) || {};
    const myVote = myId ? votes[myId] : null;
    const winner = computePotmWinner(h, team);
    return `
    <div style="flex:1; min-width:180px;">
      <div class="edit-label">Team ${team.toUpperCase()}</div>

          return `<button type="button" class="chip-toggle ${myVote===id?'active':''}" ${canVote?`onclick="castPotmVote('${h.id}','${team}','${id}')"`:'disabled'}>${esc(playerName(id))}${count?' ('+count+')':''}</button>`;
        }).join('')}
      </div>
      ${winner ? `<div class="panel-sub" style="margin-top:4px;">🏅 ${winner.tied ? 'Tied: '+winner.leaders.map(id=>esc(playerName(id))).join(' & ') : esc(playerName(winner.leaders[0]))} (${winner.count} vote${winner.count===1?'':'s'})</div>` : ''}
    </div>`;
  }
  return `
  <div class="panel">
    <div class="row" style="justify-content:space-between; gap:8px;"><div class="panel-title" style="font-size:1.1rem; margin:0;">🏅 Player of the match</div>${resultCardBtn(h)}</div>
    <div class="panel-sub">${canVote ? "Voted by whoever played that day — tap your pick for each team." : "Only players who took part in this match get a vote."}</div>
    <div class="row" style="gap:16px; flex-wrap:wrap; margin-top:6px;">
      ${teamBlock('a', h.teamAIds||[])}
      ${teamBlock('b', h.teamBIds||[])}
    </div>
  </div>`;
}
// Tallies undisputed (non-tied) POTM wins per player across a month, for
// the awards leaderboard — a tie contributes to nobody's count.
function computeMonthlyPotmCounts(month){
  const counts = {};
  historyForMonth(month).forEach(h=>{
    ['a','b'].forEach(team=>{
      const w = computePotmWinner(h, team);
      if(w && !w.tied && !isGuest(w.leaders[0])){
        counts[w.leaders[0]] = (counts[w.leaders[0]]||0) + 1;
      }
    });
  });
  return counts;
}
// Current form within the selected month only — streaks reset each month
// along with everything else on the awards board.
function computeStreak(id, month){
  let streak = 0, type = null;
  for(const h of historyForMonth(month)){
    const inA = (h.teamAIds||[]).includes(id), inB = (h.teamBIds||[]).includes(id);
    if(!inA && !inB) continue;
    if(!h.winner) break;
    const won = (inA && h.winner==='a') || (inB && h.winner==='b');
    const lost = (inA && h.winner==='b') || (inB && h.winner==='a');
    const cur = won ? 'W' : lost ? 'L' : 'D';
    if(type===null){ type = cur; streak = 1; }
    else if(cur===type){ streak++; }
    else break;
  }
  return (type==='W' || type==='L') && streak>=2 ? {type, streak} : null;
}
function streakBadge(id, month){
  const s = computeStreak(id, month);
  if(!s) return '';
  return s.type==='W'
    ? `<span class="mono" style="color:var(--good);"> 🔥${s.streak}W</span>`
    : `<span class="mono" style="color:var(--danger);"> ❄️${s.streak}L</span>`;
}

// The longest current win streak across the whole month, for the shareable
// card's headline "hot streak" — the full board already shows everyone's
// streak inline, this just picks out the single best one.
function computeTopStreak(month){
  const monthly = computeMonthlyStats(month);
  let best = null;
  Object.keys(monthly).forEach(id=>{
    const s = computeStreak(id, month);
    if(s && s.type==='W' && (!best || s.streak>best.streak)) best = {id, streak:s.streak};
  });
  return best;
}
// A single-glance, portrait-ish summary meant to be screenshotted and
// dropped into the group chat, rather than making everyone open the app.
function renderAwardsCardHtml(){
  const month = statsMonth || currentYearMonth();
  const monthly = computeMonthlyStats(month);
  const ids = Object.keys(monthly);
  const topScorer = ids.slice().sort((x,y)=>monthly[y].goals-monthly[x].goals)[0];
  const topScorerGoals = topScorer ? monthly[topScorer].goals : 0;
  const topAssister = ids.slice().sort((x,y)=>monthly[y].assists-monthly[x].assists)[0];
  const topAssisterCount = topAssister ? monthly[topAssister].assists : 0;
  const potmCounts = computeMonthlyPotmCounts(month);
  const potmIds = Object.keys(potmCounts);
  const topPotm = potmIds.slice().sort((x,y)=>potmCounts[y]-potmCounts[x])[0];
  const topPotmCount = topPotm ? potmCounts[topPotm] : 0;
  const streak = computeTopStreak(month);
  const rows = [
    topScorerGoals>0 ? {icon:SPORT.s1.awardIcon, label:SPORT.s1.award, value: playerName(topScorer)+' — '+s1Text(topScorerGoals)} : null,
    topAssisterCount>0 ? {icon:SPORT.s2.awardIcon, label:SPORT.s2.award, value: playerName(topAssister)+' — '+s2Text(topAssisterCount)} : null,
    topPotmCount>0 ? {icon:'🏅', label:'Most POTMs', value: playerName(topPotm)+' — '+topPotmCount} : null,
    streak ? {icon:'🔥', label:'Hot streak', value: playerName(streak.id)+' — '+streak.streak+' wins in a row'} : null
  ].filter(Boolean);
  return `
  <div style="background:linear-gradient(160deg, var(--panel-2), var(--panel)); border:1px solid var(--line-strong); border-radius:var(--radius); padding:24px; text-align:center;">
    <div style="font-size:.75rem; letter-spacing:.15em; text-transform:uppercase; color:var(--chalk-faint);">${esc(isHost() ? currentSquadName() : 'Matchday Draft')}</div>

      ${rows.map(r=>`
      <div>
        <div style="font-size:1.6rem;">${r.icon}</div>
        <div style="font-size:.7rem; text-transform:uppercase; letter-spacing:.1em; color:var(--chalk-faint); margin-top:2px;">${esc(r.label)}</div>
        <div style="font-size:1.1rem; font-weight:600;">${esc(r.value)}</div>
      </div>`).join('')}
    </div>` : `<div class="empty-note">No matches recorded yet this month.</div>`}
    <div style="margin-top:20px; font-size:.75rem; color:var(--chalk-faint);">📸 Screenshot to share in the group chat</div>
  </div>`;

// A quick "how even is this?" readout for the host to eyeball before
// confirming — ability gap, position-coverage gap, and whether any star
// players ended up on the same side.
function balanceSummary(teamA, teamB){
  const abA = teamA.reduce((s,id)=>s+rankOf(id),0), abB = teamB.reduce((s,id)=>s+rankOf(id),0);
  const abDiff = Math.abs(abA-abB);
  const cA = positionCounts(teamA), cB = positionCounts(teamB);
  const posDiff = POSITION_ORDER.reduce((s,p)=>s+Math.abs(cA[p]-cB[p]),0);
  const starsA = starCount(teamA), starsB = starCount(teamB);
  const starClash = starsA>0 && starsB===0 ? 'a' : starsB>0 && starsA===0 ? 'b' : null;
  const label = (abDiff<=2 && posDiff<=2 && !starClash) ? 'Well balanced'
    : (abDiff<=4 && posDiff<=4) ? 'Reasonably balanced' : 'Lopsided';
  return {abDiff, posDiff, starsA, starsB, starClash, label};
}
function balanceReadoutHtml(teamA, teamB){
  const b = balanceSummary(teamA, teamB);
  const tone = b.label==='Lopsided' ? 'amber' : 'good';
  return `<div class="banner ${tone} balance-note">⚖ ${b.label} — ability gap ${b.abDiff.toFixed(1)}, position gap ${b.posDiff}${
    (b.starsA+b.starsB)>0 ? (b.starClash ? ` · ⚠ both stars on Team ${b.starClash.toUpperCase()}` : ' · stars split across teams') : ''
  }</div>`;
}

  </div>
  `;
}

/* ---- Auction ---- */
function capCardHtml(team){
  const a = S.auction;
  const capA = a.capA || S.format, capB = a.capB || S.format;
  const teamObj = team==='a' ? a.teamA : a.teamB;
  const capId = team==='a' ? S.captains.a : S.captains.b;
  const isTurn = !a.done && a.turn===team && (teamFull(a.teamA,capA)===teamFull(a.teamB,capB));
  const n = team==='a' ? capA : capB;
  return `
    <div class="cap-card ${team} ${isTurn?'turn':''}">
      <div class="who">Team ${team.toUpperCase()} · Captain</div>
      <div class="cap-name">${esc(playerName(capId))}</div>
      <div class="cap-budget">₹${teamObj.budget}</div>
      <div class="fill">${teamObj.ids.length}/${n} players</div>
    </div>`;
}

function renderAuctionActions(){
  const a = S.auction;
  if(a.done) return '';
  const capA = a.capA || S.format, capB = a.capB || S.format;
  const bothOpen = teamFull(a.teamA,capA) === teamFull(a.teamB,capB);
  if(!bothOpen){
    return `<div class="waiting-note">Filling the remaining roster automatically…</div>`;
  }
  const myTeam = myTeamRole();
  const canActAsA = isHost() || myTeam==='a';
  const canActAsB = isHost() || myTeam==='b';

  function actionsFor(team, canAct){
    const isTurn = a.turn===team;
    const teamObj = team==='a'?a.teamA:a.teamB;
    const canAfford = teamObj.budget >= a.currentBid;
    if(!isTurn){
      return `<div class="waiting-note">Waiting for Team ${team.toUpperCase()}…</div>`;
    }
    if(!canAct){
      return `<div class="waiting-note">It's Team ${team.toUpperCase()}'s turn — waiting on their phone…</div>`;
    }
    const min = a.currentBid, inc = S.increment || 5;
    const quick = [min + inc, min + 3*inc, min + 5*inc].filter(v=>v <= teamObj.budget);
    return `
      <div class="bid-actions">
        <button class="btn btn-primary" ${canAfford?'':'disabled'} onclick="auctionBid('${team}')">Bid ₹${min}</button>
        <button class="btn btn-danger" onclick="auctionPass('${team}')">Pass</button>
      </div>
      ${canAfford ? `
      <div class="bid-more">
        ${quick.map(v=>`<button class="btn btn-sm" onclick="auctionBid('${team}', ${v})">₹${v}</button>`).join('')}
      </div>
      <div class="bid-custom">
        <span>₹</span>
        <input type="number" class="field-input" id="bidInput_${team}" inputmode="numeric" min="${min}" max="${teamObj.budget}" step="1" placeholder="Your amount" value="${escAttr(bidDrafts[team])}" oninput="bidDrafts['${team}']=this.value" onkeydown="if(event.key==='Enter') bidFromInput('${team}');">
        <button class="btn btn-sm btn-primary" onclick="bidFromInput('${team}')">Bid</button>
      </div>
      <div class="bid-hint">Any amount from ₹${min} to ₹${teamObj.budget} (your budget).</div>
      ${bidErr[team] ? `<div class="login-err">${esc(bidErr[team])}</div>` : ''}` : `<div class="bid-hint">Not enough budget left to bid on this one.</div>`}`;
  }

  const canRandomize = isHost() || myTeam==='a' || myTeam==='b';
  return `
    <div class="teams-grid">
      <div>${actionsFor('a', canActAsA)}</div>
      <div>${actionsFor('b', canActAsB)}</div>
    </div>
    ${canRandomize ? `
    <div class="footer-actions" style="margin-top:10px;">
      <button class="btn btn-sm" onclick="randomizeRemaining()">🔀 Randomize remaining players &amp; finish</button>
    </div>` : ''}`;
}

function renderAuction(){
  const a = S.auction;
  if(!a) return `<div class="panel"><div class="waiting-note">Setting up the auction…</div></div>`;
  const currentId = a.order[a.index];
  const onBlock = !a.done && currentId;

  // each sale is written on the side of the team that got the player, newest on top
  const lastSale = a.log[a.log.length-1];
  const sideLog = team=> a.log.filter(l=>l.team===team).slice().reverse().map(l=>
    `<li class="${l===lastSale ? 'just' : ''}">${l.free? '🎁 ':'💰 '}<b>${esc(playerName(l.playerId))}</b> <span>${l.free? 'free (leftover)':'₹'+l.price}</span>${l===lastSale ? '<em>just now</em>' : ''}</li>`
  ).join('');
  const log = a.log.length ? `<div class="sold-sides">
      <div class="sold-col a"><div class="sold-head">→ Team A</div><ul class="sold-list">${sideLog('a') || '<li class="none">nobody yet</li>'}</ul></div>
      <div class="sold-col b"><div class="sold-head">Team B ←</div><ul class="sold-list">${sideLog('b') || '<li class="none">nobody yet</li>'}</ul></div>
    </div>` : '';

  return `
  <div class="panel">
    <div class="panel-title">Live auction</div>
    <div class="panel-sub">Best-ranked players go up first · ${a.index}/${a.order.length} decided</div>
    ${(myTeamRole() && !a.done) ? `<div class="row" style="gap:8px; margin:-2px 0 12px; flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm" onclick="toggleAlerts()">${alertsOn ? '🔔 Turn alerts: on' : '🔕 Turn alerts: off'}</button>
      <span class="panel-sub" style="margin:0;">Buzz, beep and flash on your turn · screen stays awake</span>
    </div>` : ''}
    <div class="auction-scoreboard">
      ${capCardHtml('a')}
      <div class="block-card">
        ${onBlock ? `
          <div class="tag">On the block</div>
          <div class="name">${esc(playerName(currentId))} ${posBadges(currentId)}${starBadge(currentId)}${chemBadge(currentId)}</div>
          ${attrChips(currentId)}
          <div class="price">₹${a.leader ? a.pendingLeaderPrice : a.currentBid}</div>
          <div class="leader">${a.leader ? 'Team '+a.leader.toUpperCase()+' leads · next bid ₹'+a.currentBid+'+' : 'No bids yet · opening bid'}</div>
          ${timerHtml(a)}
        ` : `<div class="tag">Auction complete</div><div class="name">🏁</div>`}
      </div>
      ${capCardHtml('b')}
    </div>
    ${lastSale ? `<div class="sold-flash ${lastSale.team}" id="soldFlash">${lastSale.team==='b' ? '' : '← '}${lastSale.free ? '🎁' : '💰'} <b>${esc(playerName(lastSale.playerId))}</b> joins Team ${lastSale.team.toUpperCase()}${lastSale.free ? ' (free)' : ' for ₹' + lastSale.price}${lastSale.team==='b' ? ' →' : ''}</div>` : ''}
    ${renderAuctionActions()}
    ${a.note && !a.done ? `<div class="banner amber" style="margin-top:10px;">${/jumped/.test(a.note) ? '📣' : '⏱'} ${esc(a.note)}</div>` : ''}
    ${(isHost() && !a.done) ? `<div class="row" style="gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap;">
      <span class="panel-sub" style="margin:0;">⏱ Time per decision</span>
      <select class="field-input" style="width:auto;" onchange="setTimerSecs(Number(this.value))">
        ${[[0,'No timer'],[20,'20 s'],[30,'30 s'],[45,'45 s'],[60,'60 s']].map(o=>`<option value="${o[0]}" ${(S.timerSecs||0)===o[0]?'selected':''}>${o[1]}</option>`).join('')}
      </select>
    </div>` : ''}
    ${a.done ? shareButtonsHtml() : ''}
  </div>

  <div class="panel log-panel">
    <div class="panel-title" style="font-size:1.1rem; margin-bottom:8px;">Sold so far</div>
    ${log || `<div class="empty-note">No sales yet.</div>`}
  </div>

  ${a.done && isHost() ? `
  <div class="footer-actions">
    <button class="btn btn-primary" onclick="saveAuctionToHistory()">✅ Finish &amp; save result</button>
  </div>` : ''}
  `;
}

/* ---- Complete: final teams + optional match result ---- */
function renderComplete(){
  const {teamAIds, teamBIds, subIds} = getCompleteTeamIds();
  let capA=null, capB=null, priceOf=()=>null;
  if(S.mode==='draft' && S.auction){
    capA = S.captains.a; capB = S.captains.b;
    const priceMap = {};
    S.auction.log.forEach(l=>{ priceMap[l.playerId] = l; });
    priceOf = (id)=> priceMap[id];
  }

  function list(ids, capId){
    return `<ul>${ids.map(id=>{
      const rec = priceOf(id);
      const isCap = id===capId;
      return `<li><span>${nameLink(id)} ${posBadges(id)}${starBadge(id)}${chemBadge(id)}${guestTag(id)}${isCap?'<span class="cap-tag">C</span>':''}</span>${rec && !isCap ? `<span class="price">${rec.free?'free':'₹'+rec.price}</span>`:''}</li>`;
    }).join('')}</ul>`;
  }
  function compAndBudget(ids, budgetLeft){
    return `<span class="team-comp">${compositionLine(ids)}${noKeeperNote(ids)}${budgetLeft!=null?' · ₹'+budgetLeft+' left':''}</span>`;
  }

  return `
  <div class="panel">
    <div class="banner good">Saved to match history 🎉</div>
    <div class="panel-title">Final teams</div>
    <div class="teams-grid">
      <div class="team-card">
        <div class="team-head a"><h3>Team A</h3>${compAndBudget(teamAIds, S.mode==='draft'?S.auction.teamA.budget:null)}</div>
        <div class="team-body">${list(teamAIds, capA)}</div>
      </div>
      <div class="team-card">
        <div class="team-head b"><h3>Team B</h3>${compAndBudget(teamBIds, S.mode==='draft'?S.auction.teamB.budget:null)}</div>
        <div class="team-body">${list(teamBIds, capB)}</div>
      </div>
    </div>
    ${subIds.length ? `
    <div class="panel-title subs-card" style="font-size:1.1rem;">Bench / subs</div>
    <div class="chip-row">${subIds.map(id=>`<span class="chip">${esc(playerName(id))} ${posBadges(id)}${starBadge(id)}</span>`).join('')}</div>` : ''}
    ${shareButtonsHtml()}
  </div>

  ${renderResultForm(teamAIds, teamBIds)}

  ${(()=>{
    if(!isHost()) return '';
    const h = HISTORY.find(x=>x.id===S.lastHistoryId); if(!h) return '';
    const f = feeOf(h);
    if(!f) return `<div class="panel"><div class="panel-title" style="font-size:1.1rem;">💰 Turf money</div><div class="panel-sub">Split the turf and anything else between everyone who played, then send it to the group.</div><button class="btn btn-primary" onclick="openFeeEditor('${h.id}')">💰 Split the cost</button></div>`;
    const owing = feeLines(f).filter(l=>l.owes>0);
    return `<div class="panel"><div class="panel-title" style="font-size:1.1rem;">💰 Turf money</div><div class="panel-sub">${rupees(feeTotal(f))}${f.split!=='custom' ? ' · ' + rupees(feeEach(f)) + ' each' : ''} · ${owing.filter(l=>l.paid).length} of ${owing.length} paid</div><div class="row" style="gap:8px;"><button class="btn" onclick="togglePayments()">Mark who’s paid</button><button class="btn btn-ghost" onclick="openFeeEditor('${h.id}')">Edit costs</button></div></div>`;
  })()}

  ${potmVotingHtml(HISTORY.find(h=>h.id===S.lastHistoryId))}

  ${isHost() ? `
  <div class="footer-actions">
    <button class="btn btn-primary" onclick="startNewMatch()">🏟 Start new match</button>
  </div>` : ''}
  `;
}

function renderResultForm(teamAIds, teamBIds){
  if(!isHost()) return '';
  if(liveShown()) return '';
  const hNow = HISTORY.find(x=>x.id===S.lastHistoryId);
  const liveStart = (!resultDraft.saved && hNow && !hNow.winner) ? `<div class="panel"><div class="panel-title" style="font-size:1.1rem;">⏱ Live score</div><div class="panel-sub">Tap the score in as you play. Every phone sees it live, and the result saves itself at full time.</div><button class="btn btn-primary" onclick="startLive()">▶ Start live score</button></div>` : '';
  if(resultDraft.saved){
    return `<div class="panel"><div class="banner good">Match result saved — thanks for keeping the record straight!</div></div>`;
  }
  const allMatchIds = teamAIds.concat(teamBIds);
  const scorerRows = resultDraft.scorers.map((s,i)=>`
    <div class="row" style="gap:8px; flex-wrap:nowrap;">
      <select class="field-input" style="flex:1;" onchange="setScorerPlayer(${i}, this.value)">
        <option value="">Who scored?</option>
        ${allMatchIds.map(id=>`<option value="${id}" ${s.playerId===id?'selected':''}>${esc(playerName(id))}</option>`).join('')}
      </select>
      <input type="number" min="1" value="${s.goals||1}" style="width:64px;" onchange="setScorerGoals(${i}, this.value)">
      <button class="icon-btn" onclick="removeScorerRow(${i})">✕</button>
    </div>`).join('');
  const assistRows = resultDraft.assists.map((a,i)=>`
    <div class="row" style="gap:8px; flex-wrap:nowrap;">
      <select class="field-input" style="flex:1;" onchange="setAssistPlayer(${i}, this.value)">
        <option value="">Who assisted?</option>
        ${allMatchIds.map(id=>`<option value="${id}" ${a.playerId===id?'selected':''}>${esc(playerName(id))}</option>`).join('')}
      </select>
      <input type="number" min="1" value="${a.assists||1}" style="width:64px;" onchange="setAssistCount(${i}, this.value)">
      <button class="icon-btn" onclick="removeAssistRow(${i})">✕</button>
    </div>`).join('');

  return liveStart + `
  <div class="panel">
    <div class="panel-title" style="font-size:1.3rem;">${liveStart ? 'Or enter the result afterwards' : 'Match result'}</div>
    <div class="panel-sub">Optional — fill in whatever you remember. Recording a winner nudges their rank up — more for a longer match, a bigger scoreline, or an upset; barely at all for a short kickabout or a favorite winning as expected — and starts building chemistry between regulars who keep winning together.</div>
    <div class="field" style="margin-bottom:10px;">
      <label>Winner</label>
      <div class="chip-toggle-row">
        <button type="button" class="chip-toggle ${resultDraft.winner==='a'?'active':''}" onclick="setResultWinner('a')">Team A</button>
        <button type="button" class="chip-toggle ${resultDraft.winner==='b'?'active':''}" onclick="setResultWinner('b')">Team B</button>
        <button type="button" class="chip-toggle ${resultDraft.winner==='draw'?'active':''}" onclick="setResultWinner('draw')">${SPORT.draw}</button>
      </div>
    </div>
    ${SPORT.key!=='football' ? sportScoreFieldsHtml(resultDraft, 'resultDraft') + psTableHtml('result', resultDraft, teamAIds, teamBIds) : `
    <div class="row" style="margin-bottom:10px;">
      <div class="field grow">
        <label>Score — Team A</label>
        <input type="number" min="0" value="${resultDraft.scoreA}" oninput="resultDraft.scoreA=this.value">
      </div>
      <div class="field grow">
        <label>Score — Team B</label>
        <input type="number" min="0" value="${resultDraft.scoreB}" oninput="resultDraft.scoreB=this.value">
      </div>
      <div class="field grow">
        <label>Match length (min)</label>
        <input type="number" min="0" step="5" placeholder="e.g. 60" value="${resultDraft.duration}" oninput="resultDraft.duration=this.value">
      </div>
    </div>
    <div class="field" style="margin-bottom:8px;">
      <label>Goal scorers</label>
      <div style="display:flex; flex-direction:column; gap:6px;">${scorerRows}</div>
      <button type="button" class="btn btn-sm" style="align-self:flex-start; margin-top:6px;" onclick="addScorerRow()">+ Add scorer</button>
    </div>
    <div class="field" style="margin-bottom:8px;">
      <label>Assists</label>
      <div style="display:flex; flex-direction:column; gap:6px;">${assistRows}</div>
      <button type="button" class="btn btn-sm" style="align-self:flex-start; margin-top:6px;" onclick="addAssistRow()">+ Add assist</button>
    </div>`}
    <div class="footer-actions">
      <button class="btn btn-ghost" onclick="skipResult()">Skip for now</button>
      <button class="btn btn-primary" onclick="saveMatchResult()">💾 Save result</button>
    </div>
  </div>`;
}

/* ---- History modal (host can edit or delete a past match's details) ---- */
function toggleHistory(){ showHistory = !showHistory; editingHistoryId = null; historyEditDraft = null; pendingDeleteId = null; render(); }

function startEditHistory(id){
  const h = HISTORY.find(x=>x.id===id);
  if(!h) return;
  editingHistoryId = id;
  pendingDeleteId = null;
  historyEditDraft = {
    winner: h.winner || null,
    scoreA: h.scoreA!=null ? String(h.scoreA) : '',
    scoreB: h.scoreB!=null ? String(h.scoreB) : '',
    duration: h.duration!=null ? String(h.duration) : '',
    scorers: (h.scorers||[]).map(s=>({playerId:s.playerId, goals:s.goals})),
    assists: (h.assists||[]).map(a=>({playerId:a.playerId, assists:a.assists})),
    ps: recordToPs(h),
    wktsA: h.wktsA!=null ? String(h.wktsA) : '', wktsB: h.wktsB!=null ? String(h.wktsB) : ''
  };
  render();
}
function cancelEditHistory(){ editingHistoryId = null; historyEditDraft = null; render(); }
function setHistEditWinner(w){ historyEditDraft.winner = (historyEditDraft.winner===w) ? null : w; render(); }
function histEditAddScorerRow(){ historyEditDraft.scorers.push({playerId:'', goals:1}); render(); }
function histEditRemoveScorerRow(i){ historyEditDraft.scorers.splice(i,1); render(); }
function histEditSetScorerPlayer(i, id){ historyEditDraft.scorers[i].playerId = id; }
function histEditSetScorerGoals(i, val){ historyEditDraft.scorers[i].goals = Number(val)||1; }
function histEditAddAssistRow(){ historyEditDraft.assists.push({playerId:'', assists:1}); render(); }
function histEditRemoveAssistRow(i){ historyEditDraft.assists.splice(i,1); render(); }
function histEditSetAssistPlayer(i, id){ historyEditDraft.assists[i].playerId = id; }
function histEditSetAssistCount(i, val){ historyEditDraft.assists[i].assists = Number(val)||1; }

// Editing re-derives every stat/chemistry effect from scratch: undo what the
// old recorded result contributed, then apply the edited one. See
// revertMatchOutcome's note — rank ORDER itself isn't rewound, only counters
// and chemistry.
function saveEditHistory(id){
  const h = HISTORY.find(x=>x.id===id);
  if(!h || !historyEditDraft) return;
  revertMatchOutcome(h);
  const scoreA = historyEditDraft.scoreA===''? null : Number(historyEditDraft.scoreA);
  const scoreB = historyEditDraft.scoreB===''? null : Number(historyEditDraft.scoreB);
  const duration = historyEditDraft.duration===''? null : Number(historyEditDraft.duration);
  const scorers = historyEditDraft.scorers.filter(s=>s.playerId && s.goals>0);
  const assists = historyEditDraft.assists.filter(a=>a.playerId && a.assists>0);
  const sx = sportResultExtras(historyEditDraft);
  const sc = sx.scorers || scorers, as = sx.assists || assists;
  updateHistoryResult(id, Object.assign({winner:historyEditDraft.winner, scoreA, scoreB, duration, scorers:sc, assists:as}, sx));
  applyMatchOutcome(h.teamAIds||[], h.teamBIds||[], historyEditDraft.winner, sc, scoreA, scoreB, duration, as);
  editingHistoryId = null;
  historyEditDraft = null;
  render();
}

function askDeleteHistory(id){ pendingDeleteId = id; editingHistoryId = null; render(); }
function cancelDeleteHistory(){ pendingDeleteId = null; render(); }
function confirmDeleteHistory(id){
  const h = HISTORY.find(x=>x.id===id);

}

function qrSvg(text, px){

/* ============================= Live score =============================
   The host taps the score in as the match happens; every phone shows it live.
   "Full time" saves the result (score, scorers, length) into the match record,
   exactly like the result form. Lives in S.live = {hid, startedAt, endedAt,
   status:'live'|'ended', events:[{id, team, pts, pid, ast, w}]}. */
const LIVE_SPORT = {
  football:   {btns:[{pts:1, label:'⚽ Goal'}], who:true, assist:true, clock:true},
  basketball: {btns:[{pts:1, label:'+1'},{pts:2, label:'+2'},{pts:3, label:'+3'}], who:true, assist:false, clock:true},
  cricket:    {btns:[{pts:1, label:'+1'},{pts:2, label:'+2'},{pts:4, label:'4'},{pts:6, label:'6'},{w:true, label:'Wkt'}], who:false, assist:false, clock:false},
  pickleball: {btns:[{pts:1, label:'+1 point'}], who:false, assist:false, clock:false}
};
let liveAsk = null;   // {team, pts, stage:'who'|'assist', pid}
function liveCfg(){ return LIVE_SPORT[SPORT.key] || LIVE_SPORT.football; }
function liveOn(){ return !!(S.live && S.live.status==='live' && S.live.hid===S.lastHistoryId && S.phase==='complete'); }
function liveShown(){ return !!(S.live && S.live.hid===S.lastHistoryId && S.phase==='complete'); }
function liveTotals(L){
  const t = {a:0, b:0, wa:0, wb:0};
  (L.events||[]).forEach(e=>{ if(e.w) t['w'+e.team]++; else t[e.team] += (e.pts||0); });
  return t;
}
function liveClockText(L){
  const end = L.endedAt || Date.now(), sec = Math.max(0, Math.floor((end - L.startedAt)/1000));
  return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0');
}
function startLive(){
  if(!isHost() || !S.lastHistoryId) return;
  saveState({live: {hid: S.lastHistoryId, startedAt: Date.now(), endedAt: null, status: 'live', events: []}});
}
function liveTap(team, i){
  if(!liveOn() || !isHost()) return;
  const b = liveCfg().btns[i]; if(!b) return;
  if(liveCfg().who && !b.w){ liveAsk = {team, pts: b.pts, stage: 'who'}; render(); return; }
  liveAdd({team, pts: b.w ? 0 : b.pts, w: !!b.w, pid: null, ast: null});
}
function liveOwnGoal(){ if(!liveAsk) return; liveAsk.stage = 'og'; render(); }
function liveAskPick(pid){
  if(!liveAsk) return;
  if(liveAsk.stage==='og'){ liveAdd({team: liveAsk.team, pts: liveAsk.pts, w:false, og:true, pid: pid || null, ast: null}); liveAsk = null; render(); return; }
  if(liveAsk.stage==='who' && liveCfg().assist && pid){ liveAsk.pid = pid; liveAsk.stage = 'assist'; render(); return; }
  if(liveAsk.stage==='assist') liveAdd({team: liveAsk.team, pts: liveAsk.pts, w:false, pid: liveAsk.pid, ast: pid || null});
  else liveAdd({team: liveAsk.team, pts: liveAsk.pts, w:false, pid: pid || null, ast: null});
  liveAsk = null; render();
}
function liveAdd(ev){
  const L = JSON.parse(JSON.stringify(S.live));
  ev.id = 'e' + Date.now().toString(36); ev.at = Date.now() - L.startedAt;
  L.events = (L.events||[]).concat([ev]);
  try{ if(navigator.vibrate) navigator.vibrate(15); }catch(e){}
  saveState({live: L});
}
function liveUndo(){
  if(!liveOn() || !isHost()) return;
  const L = JSON.parse(JSON.stringify(S.live)); L.events = (L.events||[]).slice(0,-1); saveState({live: L});
}
let liveEndArm = false;
function liveFullTime(){
  if(!liveOn() || !isHost()) return;
  if(!liveEndArm){ liveEndArm = true; render(); setTimeout(()=>{ liveEndArm = false; render(); }, 4000); return; }
  liveEndArm = false;
  const L = JSON.parse(JSON.stringify(S.live)), t = liveTotals(L);
  const h = HISTORY.find(x=>x.id===L.hid);
  const teamAIds = (h && h.teamAIds) || getCompleteTeamIds().teamAIds, teamBIds = (h && h.teamBIds) || getCompleteTeamIds().teamBIds;
  const winner = t.a>t.b ? 'a' : t.b>t.a ? 'b' : 'draw';
  const sum = {}, ast = {};
  const og = {};
  (L.events||[]).forEach(e=>{
    if(e.og){ if(e.pid) og[e.pid] = (og[e.pid]||0) + 1; return; }
    if(e.pid && e.pts) sum[e.pid] = (sum[e.pid]||0) + e.pts; if(e.ast) ast[e.ast] = (ast[e.ast]||0) + 1;
  });
  const ownGoals = Object.keys(og).map(id=>({playerId:id, goals:og[id]}));
  const scorers = Object.keys(sum).map(id=>({playerId:id, goals:sum[id]}));
  const assists = Object.keys(ast).map(id=>({playerId:id, assists:ast[id]}));
  const minutes = Math.max(1, Math.round((Date.now() - L.startedAt)/60000));
  const duration = liveCfg().clock ? minutes : null;
  const extra = SPORT.teamWickets ? {wktsA: t.wa, wktsB: t.wb} : {};
  updateHistoryResult(L.hid, Object.assign({winner, scoreA: t.a, scoreB: t.b, scorers, assists, ownGoals, duration, live: true}, extra));
  applyMatchOutcome(teamAIds, teamBIds, winner, scorers, t.a, t.b, duration, assists);
  resultDraft.saved = true;
  L.status = 'ended'; L.endedAt = Date.now();
  saveState({live: L});
}
function liveEventText(e){
  const min = Math.floor((e.at||0)/60000) + 1;
  const time = liveCfg().clock ? '<span class="lf-t">' + min + '’</span>' : '';
  if(e.w) return time + '☝️ Wicket';
  if(e.og) return time + '⚽ ' + (e.pid ? esc(playerName(e.pid)) + ' <span class="lf-og">own goal</span>' : '<span class="lf-og">Own goal</span>');
  if(SPORT.key==='football') return time + '⚽ ' + (e.pid ? esc(playerName(e.pid)) : 'Goal') + (e.ast ? '<small>assist ' + esc(playerName(e.ast)) + '</small>' : '');
  return time + '+' + e.pts + (e.pid ? ' ' + esc(playerName(e.pid)) : '');
}
// one column per team, under that team's side of the score
function liveSideHtml(L, team){
  const all = (L.events||[]).filter(e=>e.team===team), max = 8, evs = all.slice(-max);
  return `<div class="lf-col ${team}">${all.length > max ? `<div class="lf-more">+${all.length - max} earlier</div>` : ''}${evs.map(e=>`<div class="lf-ev">${liveEventText(e)}</div>`).join('') || '<div class="lf-none">–</div>'}</div>`;
}
function liveCardHtml(){
  if(!liveShown()) return '';
  const L = S.live, t = liveTotals(L), on = L.status==='live';
  const sc = side=> String(t[side]) + (SPORT.teamWickets ? '/' + t['w'+side] : '');
  const evs = (L.events||[]).slice(-6).reverse();
  const cfg = liveCfg();
  const btnRow = team=> `<div class="live-btns">${cfg.btns.map((b,i)=>`<button class="btn ${b.w ? 'btn-danger' : 'btn-primary'} live-btn" onclick="liveTap('${team}', ${i})">${b.label}</button>`).join('')}</div>`;
  return `
  <div class="panel live-card ${on?'on':''}" id="liveCard">
    <div class="live-head">${on ? `<span class="live-dot"></span> LIVE${cfg.clock ? ` · <span id="liveClock">${liveClockText(L)}</span>` : ''}` : `🏁 FULL TIME${cfg.clock ? ' · ' + liveClockText(L) : ''}`}</div>
    <div class="live-score">
      <div class="lt a">Team A</div>
      <div class="ln"><span>${sc('a')}</span><i>:</i><span>${sc('b')}</span></div>
      <div class="lt b">Team B</div>
    </div>
    ${evs.length ? `<div class="live-feed">${liveSideHtml(L,'a')}${liveSideHtml(L,'b')}</div>` : (on ? `<div class="live-feed empty">Kick-off! Scores appear here as they happen.</div>` : '')}
    ${!on ? `<div class="poll-actions">${resultCardBtn(HISTORY.find(x=>x.id===L.hid), 'btn-primary')}</div>` : ''}
    ${isHost() && on ? `
      <div class="live-grid">
        <div><div class="lt a" style="margin-bottom:6px;">Team A</div>${btnRow('a')}</div>
        <div><div class="lt b" style="margin-bottom:6px;">Team B</div>${btnRow('b')}</div>
      </div>
      <div class="poll-actions">
        <button class="btn btn-sm" onclick="liveUndo()" ${(L.events||[]).length ? '' : 'disabled'}>↩ Undo last</button>
        <button class="btn btn-sm ${liveEndArm ? 'btn-danger' : 'btn-primary'}" onclick="liveFullTime()">${liveEndArm ? 'Tap again to save the result' : '🏁 Full time'}</button>
      </div>
      <div class="poll-list">Full time saves the score${cfg.who ? ', the ' + SPORT.s1.many + (cfg.assist ? ' and assists' : '') : ''}${cfg.clock ? ' and the match length' : ''} as the result. You can still add or fix details in 📜 Past matches.</div>` : ''}
  </div>`;
}
function renderLiveAsk(){
  if(!liveAsk || !liveOn()) { liveAsk = null; return ''; }
  const h = HISTORY.find(x=>x.id===S.live.hid);
  const ids = h ? (liveAsk.team==='a' ? h.teamAIds : h.teamBIds) || [] : (getCompleteTeamIds()[liveAsk.team==='a' ? 'teamAIds' : 'teamBIds'] || []);

/* ============================= Result card image =============================
   A picture of the result (score, scorers, player of the match) to post in the
   WhatsApp group. Drawn on a canvas in the phone itself, then handed to the
   share sheet (or saved). Anyone can make one for any match with a result. */
let resultCardOpen = null, resultCardUrl = '', resultCardBlob = null, resultCardMsg = '';
function resultCardBtn(h, cls){
  if(!h || !h.winner) return '';
  return `<button class="btn btn-sm ${cls||''}" onclick="event.stopPropagation(); openResultCard('${h.id}')">📸 Result card</button>`;
}
function rcSideLines(h, team){
  const ids = new Set(team==='a' ? (h.teamAIds||[]) : (h.teamBIds||[]));
  const other = new Set(team==='a' ? (h.teamBIds||[]) : (h.teamAIds||[]));
  const fb = SPORT.key==='football';
  const out = (h.scorers||[]).filter(x=>x.playerId && x.goals && ids.has(x.playerId)).sort((a,b)=>b.goals-a.goals)
    .map(x=> fb ? playerName(x.playerId) + (x.goals>1 ? ' ×' + x.goals : '') : playerName(x.playerId) + ' ' + x.goals);
  // own goals count for the other side
  (h.ownGoals||[]).filter(x=>x.playerId && other.has(x.playerId)).forEach(x=> out.push(playerName(x.playerId) + ' (OG)' + (x.goals>1 ? ' ×' + x.goals : '')));
  return out;
}
function rcPotm(h, team){
  const w = computePotmWinner(h, team);
  return w ? w.leaders.map(playerName).join(' & ') : '';
}
function rcFit(ctx, text, maxW, size, weight, family){
  let s = size;
  do { ctx.font = weight + ' ' + s + 'px ' + family; if(ctx.measureText(text).width <= maxW) break; s -= 2; } while(s > 18);
  return s;
}
async function drawResultCard(h){
  try{ if(document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r, 1500))]); }catch(e){}
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const colA = (css.getPropertyValue('--teamA')||'').trim() || '#1f78c8', colB = (css.getPropertyValue('--teamB')||'').trim() || '#d6453d';
  const head = "Teko, 'Arial Narrow', sans-serif", body = "'Work Sans', system-ui, sans-serif", mono = "'Space Mono', ui-monospace, monospace";
  // background
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0d1b14'); g.addColorStop(1, '#06100b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = .07; ctx.strokeStyle = '#fff'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(W/2, 640, 230, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 640); ctx.lineTo(W, 640); ctx.stroke();
  ctx.globalAlpha = 1;
  // team colour bands
  ctx.fillStyle = colA; ctx.fillRect(0, 0, W/2, 14); ctx.fillStyle = colB; ctx.fillRect(W/2, 0, W/2, 14);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  // title
  ctx.fillStyle = 'rgba(255,255,255,.62)'; ctx.font = '600 34px ' + body;
  const when = new Date(h.date).toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short', year:'numeric'});
  ctx.fillText((SPORT.icon || '') + '  ' + SPORT.name.toUpperCase() + '  ·  ' + when, W/2, 104);
  ctx.fillStyle = '#fff'; ctx.font = '600 64px ' + head;
  const gname = (currentSquadName && currentSquadName()) || 'Matchday';
  rcFit(ctx, gname, W - 140, 64, '600', head); ctx.fillText(gname, W/2, 180);
  // score
  const sA = String(h.scoreA ?? '–') + (SPORT.teamWickets && h.wktsA!=null ? '/' + h.wktsA : '');
  const sB = String(h.scoreB ?? '–') + (SPORT.teamWickets && h.wktsB!=null ? '/' + h.wktsB : '');
  ctx.font = '700 64px ' + head; ctx.fillStyle = colA; ctx.fillText('TEAM A', W*0.25, 330); ctx.fillStyle = colB; ctx.fillText('TEAM B', W*0.75, 330);
  const big = rcFit(ctx, sA + '  ' + sB, W*0.62, 230, '700', mono);
  ctx.font = '700 ' + big + 'px ' + mono; ctx.fillStyle = '#fff';
  ctx.fillText(sA, W*0.25, 560); ctx.fillText(sB, W*0.75, 560);
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillText(':', W/2, 545);
  // result line
  const res = h.winner==='draw' ? SPORT.draw || 'Draw' : 'Team ' + h.winner.toUpperCase() + ' wins';
  ctx.font = '600 44px ' + body; ctx.fillStyle = h.winner==='a' ? colA : h.winner==='b' ? colB : '#f5c542';
  ctx.fillText((h.winner==='draw' ? '🤝 ' : '🏆 ') + res + (h.duration ? '  ·  ' + h.duration + ' min' : ''), W/2, 660);
  // scorers, one column per team
  const linesA = rcSideLines(h, 'a'), linesB = rcSideLines(h, 'b');
  ctx.font = '600 30px ' + body; ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fillText((SPORT.s1.icon||'') + ' ' + SPORT.s1.name.toUpperCase(), W/2, 750);
  const rows = Math.min(7, Math.max(linesA.length, linesB.length, 1));
  for(let i=0; i<rows; i++){
    const y = 812 + i*54;
    [['a', linesA, W*0.25], ['b', linesB, W*0.75]].forEach(([t, ls, x])=>{
      let txt = ls[i] || (i===0 ? '–' : ''); if(i===6 && ls.length>7) txt = '+' + (ls.length-6) + ' more';
      if(!txt) return;
      ctx.fillStyle = '#fff'; const sz = rcFit(ctx, txt, W*0.42, 40, '500', body); ctx.font = '500 ' + sz + 'px ' + body; ctx.fillText(txt, x, y);
    });
  }
  // player of the match
  const pA = rcPotm(h, 'a'), pB = rcPotm(h, 'b');
  let y = 812 + rows*54 + 40;
  if(pA || pB){
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = '600 30px ' + body; ctx.fillText('🏅 PLAYER OF THE MATCH', W/2, y); y += 62;
    [[pA, W*0.25, colA], [pB, W*0.75, colB]].forEach(([n, x, col])=>{ if(!n) return; ctx.fillStyle = col; const sz = rcFit(ctx, n, W*0.42, 50, '600', head); ctx.font = '600 ' + sz + 'px ' + head; ctx.fillText(n, x, y); });
  }
  // footer
  ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.font = '500 28px ' + body;
  ctx.fillText('Made with Matchday Draft', W/2, H - 60);
  return c;
}
async function openResultCard(hid){
  const h = HISTORY.find(x=>x.id===hid); if(!h || !h.winner) return;
  resultCardOpen = hid; resultCardUrl = ''; resultCardBlob = null; resultCardMsg = ''; render();
  try{
    const c = await drawResultCard(h);
    resultCardUrl = c.toDataURL('image/png');
    resultCardBlob = await new Promise(r=> c.toBlob ? c.toBlob(r, 'image/png') : r(null));
  }catch(e){ resultCardMsg = 'Couldn’t make the picture on this phone.'; }
  if(resultCardOpen===hid) render();
}
function resultCardFile(){
  const h = HISTORY.find(x=>x.id===resultCardOpen);
  const day = h ? new Date(h.date).toISOString().slice(0,10) : 'match';
  const name = 'matchday-result-' + day + '.png';
  return (resultCardBlob && typeof File==='function') ? new File([resultCardBlob], name, {type:'image/png'}) : null;
}
function canShareResultCard(){ const f = resultCardFile(); try{ return !!(f && navigator.canShare && navigator.canShare({files:[f]})); }catch(e){ return false; } }
async function shareResultCard(){
  const f = resultCardFile(); if(!f) return;
  try{ await navigator.share({files:[f], text: SPORT.icon + ' ' + SPORT.name + ' result'}); }

}

}
