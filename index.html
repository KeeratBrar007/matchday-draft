}

/* ============================= Match results & stats ============================= */

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

// How many rank spots a win is worth. A short kickabout barely moves
// anyone; a long session moves more. A lopsided scoreline moves more than
// a squeaker. And an upset — the team that was, on paper, weaker coming in
// — moves more than a "favorite wins as expected" result, which barely
// moves at all. Everything folds into one integer shift (1-5 spots).
function computeRankShift(teamAIds, teamBIds, winner, scoreA, scoreB, durationMinutes){
  if(winner!=='a' && winner!=='b') return 1;
  const winIds = winner==='a' ? teamAIds : teamBIds;
  const loseIds = winner==='a' ? teamBIds : teamAIds;
  const avgRank = ids => ids.length ? ids.reduce((s,id)=>s+rankOf(id),0)/ids.length : 0;
  const winAvg = avgRank(winIds), loseAvg = avgRank(loseIds);
  const span = Math.max(1, SQUAD.players.length - 1);

  const mins = Number(durationMinutes);
  const durationFactor = (mins>0) ? clamp(mins/60, 0.4, 1.8) : 1;

  let marginFactor = 1;
  if(scoreA!=null && scoreB!=null && !isNaN(scoreA) && !isNaN(scoreB)){
    marginFactor = clamp(1 + Math.abs(scoreA-scoreB)*0.15, 1, 2);
  }

  // positive when the winners were the weaker side coming in (an upset)
  const upset = (loseAvg - winAvg) / span;
  const upsetFactor = clamp(1 + upset*1.2, 0.4, 1.8);

  const raw = durationFactor * marginFactor * upsetFactor;
  return clamp(Math.round(raw), 1, 5);
}

// Applies everything a recorded result affects: play/win/loss/draw/goal
// tallies, a graduation + rank nudge (bigger for longer/lopsided/upset
// wins) for winners, and automatic chemistry links for pairs who've now
// won together three times.
function applyMatchOutcome(teamAIds, teamBIds, winner, scorers, scoreA, scoreB, durationMinutes, assists){
  const rankShift = computeRankShift(teamAIds, teamBIds, winner, scoreA, scoreB, durationMinutes);
  const next = cloneSquad();
  next.stats = Object.assign({}, next.stats||{});
  const bump = (id, key) => {
    next.stats[id] = Object.assign({played:0,wins:0,losses:0,draws:0,goals:0,assists:0}, next.stats[id]);
    next.stats[id][key]++;
  };
  teamAIds.concat(teamBIds).forEach(id=>{
    next.stats[id] = Object.assign({played:0,wins:0,losses:0,draws:0,goals:0,assists:0}, next.stats[id]);
    next.stats[id].played++;
  });
  if(winner==='a'){ teamAIds.forEach(id=>bump(id,'wins')); teamBIds.forEach(id=>bump(id,'losses')); }
  else if(winner==='b'){ teamBIds.forEach(id=>bump(id,'wins')); teamAIds.forEach(id=>bump(id,'losses')); }
  else if(winner==='draw'){ teamAIds.concat(teamBIds).forEach(id=>bump(id,'draws')); }
  (scorers||[]).forEach(s=>{
    if(!s.playerId || !s.goals) return;
    next.stats[s.playerId] = Object.assign({played:0,wins:0,losses:0,draws:0,goals:0,assists:0}, next.stats[s.playerId]);
    next.stats[s.playerId].goals += s.goals;
  });
  (assists||[]).forEach(a=>{
    if(!a.playerId || !a.assists) return;
    next.stats[a.playerId] = Object.assign({played:0,wins:0,losses:0,draws:0,goals:0,assists:0}, next.stats[a.playerId]);
    next.stats[a.playerId].assists += a.assists;
  });

  const winningIds = winner==='a' ? teamAIds.slice() : winner==='b' ? teamBIds.slice() : [];

  // graduate unranked winners into the ranked list before nudging anyone
  winningIds.forEach(id=>{
    const u = (next.unrankedPlayers||[]).find(p=>p.id===id);
    if(u){
      next.unrankedPlayers = next.unrankedPlayers.filter(p=>p.id!==id);
      next.players.splice(Math.round(next.players.length/2), 0, u);
    }
  });
  // nudge each winner up by the computed number of rank spots. Ability
  // rank is stored ascending (index 0 = weakest, last = strongest — same
  // convention as the "Weaker"/"Stronger" arrows in the database), so
  // moving UP means increasing the index.
  winningIds.forEach(id=>{
    let idx = next.players.findIndex(p=>p.id===id);
    let steps = rankShift;
    while(steps>0 && idx>=0 && idx < next.players.length-1){
      [next.players[idx+1], next.players[idx]] = [next.players[idx], next.players[idx+1]];
      idx++; steps--;
    }
  });
  // co-win tracking: three wins together auto-links a pair's chemistry
  next.coWin = Object.assign({}, next.coWin||{});
  if(winningIds.length>=2){
    for(let i=0;i<winningIds.length;i++){
      for(let j=i+1;j<winningIds.length;j++){
        const key = [winningIds[i],winningIds[j]].sort().join('|');
        next.coWin[key] = (next.coWin[key]||0)+1;
        if(next.coWin[key]===3){
          next.chemistryGroups = mergeChemistry(next.chemistryGroups||[], [winningIds[i], winningIds[j]]);
        }
      }
    }
  }
  saveSquadDoc(next);
}

// Undoes the play/win/loss/draw/goal counters and co-win tallies a match
// entry contributed, for deleting or editing a past result. Deliberately
// does NOT try to rewind the rank-order nudge — later matches may already
// have built on top of that ordering, so unwinding it exactly isn't
// possible in general; only the counters and (when this exact match was
// the one that crossed the threshold) the chemistry link it created are
// reversed.
function revertMatchOutcome(entry){
  if(!entry) return;
  const teamAIds = entry.teamAIds||[], teamBIds = entry.teamBIds||[];
  const winner = entry.winner, scorers = entry.scorers||[];
  if(!winner && !scorers.length && !(entry.assists||[]).length) return; // nothing was ever applied for this entry

  const next = cloneSquad();
  next.stats = Object.assign({}, next.stats||{});
  const dec = (id, key) => {
    if(!next.stats[id]) return;
    next.stats[id] = Object.assign({}, next.stats[id]);
    next.stats[id][key] = Math.max(0, (next.stats[id][key]||0) - 1);
  };
  if(winner){
    teamAIds.concat(teamBIds).forEach(id=> dec(id,'played'));
    if(winner==='a'){ teamAIds.forEach(id=>dec(id,'wins')); teamBIds.forEach(id=>dec(id,'losses')); }
    else if(winner==='b'){ teamBIds.forEach(id=>dec(id,'wins')); teamAIds.forEach(id=>dec(id,'losses')); }
    else if(winner==='draw'){ teamAIds.concat(teamBIds).forEach(id=>dec(id,'draws')); }
  }
  scorers.forEach(s=>{
    if(!s.playerId || !s.goals || !next.stats[s.playerId]) return;
    next.stats[s.playerId] = Object.assign({}, next.stats[s.playerId]);
    next.stats[s.playerId].goals = Math.max(0, next.stats[s.playerId].goals - s.goals);
  });
  (entry.assists||[]).forEach(a=>{
    if(!a.playerId || !a.assists || !next.stats[a.playerId]) return;
    next.stats[a.playerId] = Object.assign({}, next.stats[a.playerId]);
    next.stats[a.playerId].assists = Math.max(0, (next.stats[a.playerId].assists||0) - a.assists);
  });

  const winningIds = winner==='a' ? teamAIds.slice() : winner==='b' ? teamBIds.slice() : [];
  next.coWin = Object.assign({}, next.coWin||{});
  if(winningIds.length>=2){
    for(let i=0;i<winningIds.length;i++){
      for(let j=i+1;j<winningIds.length;j++){
        const key = [winningIds[i],winningIds[j]].sort().join('|');
        if(!next.coWin[key]) continue;
        const was = next.coWin[key];
        next.coWin[key] = Math.max(0, was-1);
        // only undo the auto-link if THIS match is what created it, and it
        // hasn't since merged with a bigger chemistry group
        if(was>=3 && next.coWin[key]<3){
          next.chemistryGroups = (next.chemistryGroups||[]).filter(g=>
            !(g.length===2 && g.includes(winningIds[i]) && g.includes(winningIds[j])));
        }
      }
    }
  }
  saveSquadDoc(next);
}

  if(phase==='setup') return 'setup';

// Compares the build marker of the copy running right now with the live one on
// the server; if they differ, offers a refresh. (Skipped on the unbuilt source.)
let lastUpdateCheck = 0;
function checkForUpdate(){
  try{
    const now = Date.now();
    if(updateReady || now - lastUpdateCheck < 60000) return;
    const mine = (document.querySelector('meta[name=md-build]')||{}).content;
    if(!mine || mine === '__BUILD' + '__') return;
    lastUpdateCheck = now;
    fetch('index.html?md-check=' + now, {cache:'no-store'})
      .then(r=> r.ok ? r.text() : '')
      .then(t=>{
        const m = /<meta name="md-build" content="([^"]+)"/.exec(t);
        if(m && m[1] !== mine){ updateReady = true; render(); }
      }).catch(()=>{});
  }catch(e){}
}

  return updateReady ? `<div class="update-toast"><span>✨ A new version is ready.</span><button class="btn btn-sm" onclick="location.reload()">Refresh</button></div>` : '';

function render(){
  const app = document.getElementById('app');
  document.body.classList.toggle('is-host', isHost());
  const pageScrollY = window.scrollY;
  const openModal = document.querySelector('.modal-backdrop');
  const modalScrollTop = openModal ? openModal.scrollTop : null;
  // keep the cursor in a login box if a live update re-renders mid-typing
  const ae = document.activeElement;
  const keepId = (ae && (ae.id==='loginNameInput' || ae.id==='hostCodeInput' || ae.id==='dbSearchInput' || ae.id==='setupSearchInput' || ae.id==='pinInput' || ae.id==='pinSetInput')) ? ae.id : null;
  const keepPos = keepId ? ae.selectionStart : null;

  if(!(dbReady && rosterLoaded && (pinsLoaded || !db))){ app.innerHTML = renderLoading(); return; }
  if(loginRequired()){
    app.innerHTML = renderLogin();
    if(keepId){
      const el = document.getElementById(keepId);
      if(el){ el.focus(); try{ el.setSelectionRange(keepPos, keepPos); }catch(e){} }
    }else autoFocusEl();
    return;
  }
  if(shouldOfferPin() && pinOfferedFor !== pinKey(getLoginName())){ pinOfferedFor = pinKey(getLoginName()); pinModalOpen = true; }

  const pg = currentPage();
  app.innerHTML = renderTopbar() + renderPageNav() + renderTurnBanner() + (pg==='home' ? renderProgress() : '') + renderBanner()
    + (pg==='profile' ? renderProfilePage() : pg==='leaderboard' ? renderLeaderboardPage() : renderBody())
    + renderHistoryModal() + renderDatabaseModal() + renderLogMatchModal() + renderSquadManagerModal()
    + renderAttendanceModal() + renderProfilePicker() + renderPinModal() + updateToastHtml();
  if(keepId){
    const el = document.getElementById(keepId);
    if(el){ el.focus(); try{ el.setSelectionRange(keepPos, keepPos); }catch(e){} }
  }else autoFocusEl();

  window.scrollTo(0, pageScrollY);
  if(modalScrollTop != null){
    const newModal = document.querySelector('.modal-backdrop');
    if(newModal) newModal.scrollTop = modalScrollTop;
  }
  checkTurnAlert();
}
function autoFocusEl(){
  const el = document.querySelector('[data-af]');

}

/* ---- monthly awards: golden boot, leaderboard and streaks all reset each
   calendar month, computed straight from this squad's match history rather
   than a lifetime counter (rank/chemistry stay cumulative — only the
   "awards" board is scoped to one month at a time). ---- */
function yearMonthOf(dateStr){
  const d = new Date(dateStr);
  if(isNaN(d)) return null;
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function currentYearMonth(){ return yearMonthOf(new Date().toISOString()); }
function formatYearMonth(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString(undefined, {month:'long', year:'numeric'});
}
function shiftYearMonth(ym, delta){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function statsMonthPrev(){ statsMonth = shiftYearMonth(statsMonth||currentYearMonth(), -1); render(); }
function statsMonthNext(){ statsMonth = shiftYearMonth(statsMonth||currentYearMonth(), 1); render(); }
function statsMonthReset(){ statsMonth = null; render(); }

function historyForMonth(month){
  if(Array.isArray(month)) return month;      // already a list of matches (season / all-time views)
  return HISTORY.filter(h=> yearMonthOf(h.date)===month);
}
// Tallies played/win/loss/draw/goals/assists per player from just this
// month's matches — independent of SQUAD.stats, which stays a lifetime
// total. Guests are deliberately excluded so a one-off fill-in never shows
// up on the leaderboard.
function computeMonthlyStats(month){
  const stats = {};
  const bump = (id,key)=>{
    if(isGuest(id)) return;
    stats[id] = stats[id] || {played:0,wins:0,losses:0,draws:0,goals:0,assists:0};
    stats[id][key]++;
  };
  historyForMonth(month).forEach(h=>{
    const teamAIds = h.teamAIds||[], teamBIds = h.teamBIds||[];
    teamAIds.concat(teamBIds).forEach(id=> bump(id,'played'));
    if(h.winner==='a'){ teamAIds.forEach(id=>bump(id,'wins')); teamBIds.forEach(id=>bump(id,'losses')); }
    else if(h.winner==='b'){ teamBIds.forEach(id=>bump(id,'wins')); teamAIds.forEach(id=>bump(id,'losses')); }
    else if(h.winner==='draw'){ teamAIds.concat(teamBIds).forEach(id=>bump(id,'draws')); }
    (h.scorers||[]).forEach(s=>{
      if(!s.playerId || !s.goals || isGuest(s.playerId)) return;
      stats[s.playerId] = stats[s.playerId] || {played:0,wins:0,losses:0,draws:0,goals:0,assists:0};
      stats[s.playerId].goals += s.goals;
    });
    (h.assists||[]).forEach(a=>{
      if(!a.playerId || !a.assists || isGuest(a.playerId)) return;
      stats[a.playerId] = stats[a.playerId] || {played:0,wins:0,losses:0,draws:0,goals:0,assists:0};
      stats[a.playerId].assists += a.assists;
    });
  });
  return stats;
}

/* ---- Player of the match: voted by anyone who played that day, one team
   at a time — not picked by the host. Votes live on the history entry
   itself ({potmVotes:{a:{voterId:candidateId}, b:{...}}}), so they sync and
   persist just like the rest of the match record. ---- */
function computePotmTally(h, team){
  const votes = ((h&&h.potmVotes)||{})[team] || {};
  const tally = {};
  Object.values(votes).forEach(candidateId=>{ tally[candidateId] = (tally[candidateId]||0)+1; });
  return tally;
}
function computePotmWinner(h, team){
  const tally = computePotmTally(h, team);
  const ids = Object.keys(tally);
  if(!ids.length) return null;
  const max = Math.max(...ids.map(id=>tally[id]));
  const leaders = ids.filter(id=>tally[id]===max);
  return {leaders, count:max, tied: leaders.length>1};
}
function castPotmVote(historyId, team, candidateId){
  const myId = getMyPlayerId();
  const h = HISTORY.find(x=>x.id===historyId);
  if(!h || !myId) return;
  const participants = (h.teamAIds||[]).concat(h.teamBIds||[]);
  if(!participants.includes(myId)) return; // only those who actually played that day get a say
  const candidates = team==='a' ? (h.teamAIds||[]) : (h.teamBIds||[]);
  if(!candidates.includes(candidateId)) return;
  const potmVotes = Object.assign({a:{}, b:{}}, h.potmVotes);
  potmVotes[team] = Object.assign({}, potmVotes[team], {[myId]: candidateId});
  updateHistoryResult(historyId, {potmVotes});
}
function potmVotingHtml(h){
  if(!h) return '';
  const myId = getMyPlayerId();
  const participants = (h.teamAIds||[]).concat(h.teamBIds||[]);
  const canVote = !!myId && participants.includes(myId);
  function teamBlock(team, ids){
    if(!ids.length) return '';
    const votes = ((h.potmVotes||{})[team]) || {};
    const myVote = myId ? votes[myId] : null;
    const winner = computePotmWinner(h, team);
    return `
    <div style="flex:1; min-width:180px;">
      <div class="edit-label">Team ${team.toUpperCase()}</div>
      <div class="chip-toggle-row">

          const count = Object.values(votes).filter(v=>v===id).length;
          return `<button type="button" class="chip-toggle ${myVote===id?'active':''}" ${canVote?`onclick="castPotmVote('${h.id}','${team}','${id}')"`:'disabled'}>${esc(playerName(id))}${count?' ('+count+')':''}</button>`;
        }).join('')}
      </div>
      ${winner ? `<div class="panel-sub" style="margin-top:4px;">🏅 ${winner.tied ? 'Tied: '+winner.leaders.map(id=>esc(playerName(id))).join(' & ') : esc(playerName(winner.leaders[0]))} (${winner.count} vote${winner.count===1?'':'s'})</div>` : ''}
    </div>`;
  }
  return `
  <div class="panel">
    <div class="panel-title" style="font-size:1.1rem;">🏅 Player of the match</div>
    <div class="panel-sub">${canVote ? "Voted by whoever played that day — tap your pick for each team." : "Only players who took part in this match get a vote."}</div>
    <div class="row" style="gap:16px; flex-wrap:wrap; margin-top:6px;">
      ${teamBlock('a', h.teamAIds||[])}
      ${teamBlock('b', h.teamBIds||[])}
    </div>
  </div>`;
}
// Tallies undisputed (non-tied) POTM wins per player across a month, for
// the awards leaderboard — a tie contributes to nobody's count.
function computeMonthlyPotmCounts(month){
  const counts = {};
  historyForMonth(month).forEach(h=>{
    ['a','b'].forEach(team=>{
      const w = computePotmWinner(h, team);
      if(w && !w.tied && !isGuest(w.leaders[0])){
        counts[w.leaders[0]] = (counts[w.leaders[0]]||0) + 1;
      }
    });
  });
  return counts;
}
// Current form within the selected month only — streaks reset each month
// along with everything else on the awards board.
function computeStreak(id, month){
  let streak = 0, type = null;
  for(const h of historyForMonth(month)){
    const inA = (h.teamAIds||[]).includes(id), inB = (h.teamBIds||[]).includes(id);
    if(!inA && !inB) continue;
    if(!h.winner) break;
    const won = (inA && h.winner==='a') || (inB && h.winner==='b');
    const lost = (inA && h.winner==='b') || (inB && h.winner==='a');
    const cur = won ? 'W' : lost ? 'L' : 'D';
    if(type===null){ type = cur; streak = 1; }
    else if(cur===type){ streak++; }
    else break;
  }
  return (type==='W' || type==='L') && streak>=2 ? {type, streak} : null;
}
function streakBadge(id, month){
  const s = computeStreak(id, month);
  if(!s) return '';
  return s.type==='W'
    ? `<span class="mono" style="color:var(--good);"> 🔥${s.streak}W</span>`
    : `<span class="mono" style="color:var(--danger);"> ❄️${s.streak}L</span>`;
}

function renderPodiumHtml(sorted, monthly){
  const top = sorted.slice(0,3);
  if(!top.length) return '';
  const medals = ['🥇','🥈','🥉'];
  const card = (i)=>{
    const id = top[i]; if(!id) return '<div></div>';
    const s = monthly[id];
    const wr = s.played ? Math.round(100*s.wins/s.played) : 0;
    return `<div class="pod ${i===0?'first':''}"><div class="medal">${i===0?'👑':medals[i]}</div><div class="pod-av">${esc((playerName(id)||'?').trim().charAt(0).toUpperCase())}</div><div class="pn">${nameLink(id)}</div><div class="pod-pos">${posBadges(id)}</div><div class="pw">${wr}%</div><div class="ps">${s.wins}W · ${s.played}P</div></div>`;
  };
  // classic podium order: 2nd, 1st, 3rd
  return `<div class="podium">${card(1)}${card(0)}${card(2)}</div>`;
}

// The longest current win streak across the whole month, for the shareable
// card's headline "hot streak" — the full board already shows everyone's
// streak inline, this just picks out the single best one.
function computeTopStreak(month){
  const monthly = computeMonthlyStats(month);
  let best = null;
  Object.keys(monthly).forEach(id=>{
    const s = computeStreak(id, month);
    if(s && s.type==='W' && (!best || s.streak>best.streak)) best = {id, streak:s.streak};
  });
  return best;
}
// A single-glance, portrait-ish summary meant to be screenshotted and
// dropped into the group chat, rather than making everyone open the app.
function renderAwardsCardHtml(){
  const month = statsMonth || currentYearMonth();
  const monthly = computeMonthlyStats(month);
  const ids = Object.keys(monthly);
  const topScorer = ids.slice().sort((x,y)=>monthly[y].goals-monthly[x].goals)[0];
  const topScorerGoals = topScorer ? monthly[topScorer].goals : 0;
  const topAssister = ids.slice().sort((x,y)=>monthly[y].assists-monthly[x].assists)[0];
  const topAssisterCount = topAssister ? monthly[topAssister].assists : 0;
  const potmCounts = computeMonthlyPotmCounts(month);
  const potmIds = Object.keys(potmCounts);
  const topPotm = potmIds.slice().sort((x,y)=>potmCounts[y]-potmCounts[x])[0];
  const topPotmCount = topPotm ? potmCounts[topPotm] : 0;
  const streak = computeTopStreak(month);
  const rows = [
    topScorerGoals>0 ? {icon:'🥇', label:'Golden boot', value: playerName(topScorer)+' — '+topScorerGoals+' goal'+(topScorerGoals===1?'':'s')} : null,
    topAssisterCount>0 ? {icon:'🎯', label:'Playmaker', value: playerName(topAssister)+' — '+topAssisterCount+' assist'+(topAssisterCount===1?'':'s')} : null,
    topPotmCount>0 ? {icon:'🏅', label:'Most POTMs', value: playerName(topPotm)+' — '+topPotmCount} : null,
    streak ? {icon:'🔥', label:'Hot streak', value: playerName(streak.id)+' — '+streak.streak+' wins in a row'} : null
  ].filter(Boolean);
  return `
  <div style="background:linear-gradient(160deg, var(--panel-2), var(--panel)); border:1px solid var(--line-strong); border-radius:var(--radius); padding:24px; text-align:center;">
    <div style="font-size:.75rem; letter-spacing:.15em; text-transform:uppercase; color:var(--chalk-faint);">${esc(isHost() ? currentSquadName() : 'Matchday Draft')}</div>

      <div>
        <div style="font-size:1.6rem;">${r.icon}</div>
        <div style="font-size:.7rem; text-transform:uppercase; letter-spacing:.1em; color:var(--chalk-faint); margin-top:2px;">${esc(r.label)}</div>
        <div style="font-size:1.1rem; font-weight:600;">${esc(r.value)}</div>
      </div>`).join('')}
    </div>` : `<div class="empty-note">No matches recorded yet this month.</div>`}
    <div style="margin-top:20px; font-size:.75rem; color:var(--chalk-faint);">📸 Screenshot to share in the group chat</div>

// A quick "how even is this?" readout for the host to eyeball before
// confirming — ability gap, position-coverage gap, and whether any star
// players ended up on the same side.
function balanceSummary(teamA, teamB){
  const abA = teamA.reduce((s,id)=>s+rankOf(id),0), abB = teamB.reduce((s,id)=>s+rankOf(id),0);
  const abDiff = Math.abs(abA-abB);
  const cA = positionCounts(teamA), cB = positionCounts(teamB);
  const posDiff = POSITION_ORDER.reduce((s,p)=>s+Math.abs(cA[p]-cB[p]),0);
  const starsA = starCount(teamA), starsB = starCount(teamB);
  const starClash = starsA>0 && starsB===0 ? 'a' : starsB>0 && starsA===0 ? 'b' : null;
  const label = (abDiff<=2 && posDiff<=2 && !starClash) ? 'Well balanced'
    : (abDiff<=4 && posDiff<=4) ? 'Reasonably balanced' : 'Lopsided';
  return {abDiff, posDiff, starsA, starsB, starClash, label};
}
function balanceReadoutHtml(teamA, teamB){
  const b = balanceSummary(teamA, teamB);
  const tone = b.label==='Lopsided' ? 'amber' : 'good';
  return `<div class="banner ${tone} balance-note">⚖ ${b.label} — ability gap ${b.abDiff.toFixed(1)}, position gap ${b.posDiff}${
    (b.starsA+b.starsB)>0 ? (b.starClash ? ` · ⚠ both stars on Team ${b.starClash.toUpperCase()}` : ' · stars split across teams') : ''
  }</div>`;
}

/* ---- Auction ---- */
function capCardHtml(team){
  const a = S.auction;
  const capA = a.capA || S.format, capB = a.capB || S.format;
  const teamObj = team==='a' ? a.teamA : a.teamB;
  const capId = team==='a' ? S.captains.a : S.captains.b;
  const isTurn = !a.done && a.turn===team && (teamFull(a.teamA,capA)===teamFull(a.teamB,capB));
  const n = team==='a' ? capA : capB;
  return `
    <div class="cap-card ${team} ${isTurn?'turn':''}">
      <div class="who">Team ${team.toUpperCase()} · Captain</div>
      <div class="cap-name">${esc(playerName(capId))}</div>
      <div class="cap-budget">₹${teamObj.budget}</div>
      <div class="fill">${teamObj.ids.length}/${n} players</div>
    </div>`;
}

function renderAuctionActions(){
  const a = S.auction;
  if(a.done) return '';
  const capA = a.capA || S.format, capB = a.capB || S.format;
  const bothOpen = teamFull(a.teamA,capA) === teamFull(a.teamB,capB);
  if(!bothOpen){
    return `<div class="waiting-note">Filling the remaining roster automatically…</div>`;
  }
  const myTeam = myTeamRole();
  const canActAsA = isHost() || myTeam==='a';
  const canActAsB = isHost() || myTeam==='b';

  function actionsFor(team, canAct){
    const isTurn = a.turn===team;
    const teamObj = team==='a'?a.teamA:a.teamB;
    const canAfford = teamObj.budget >= a.currentBid;
    if(!isTurn){
      return `<div class="waiting-note">Waiting for Team ${team.toUpperCase()}…</div>`;
    }
    if(!canAct){
      return `<div class="waiting-note">It's Team ${team.toUpperCase()}'s turn — waiting on their phone…</div>`;
    }
    return `
      <div class="bid-actions">
        <button class="btn btn-primary" ${canAfford?'':'disabled'} onclick="auctionBid('${team}')">Bid ₹${a.currentBid}</button>
        <button class="btn btn-danger" onclick="auctionPass('${team}')">Pass</button>
      </div>`;
  }

  const canRandomize = isHost() || myTeam==='a' || myTeam==='b';
  return `
    <div class="teams-grid">
      <div>${actionsFor('a', canActAsA)}</div>
      <div>${actionsFor('b', canActAsB)}</div>
    </div>
    ${canRandomize ? `
    <div class="footer-actions" style="margin-top:10px;">
      <button class="btn btn-sm" onclick="randomizeRemaining()">🔀 Randomize remaining players &amp; finish</button>
    </div>` : ''}`;
}

function renderAuction(){
  const a = S.auction;
  if(!a) return `<div class="panel"><div class="waiting-note">Setting up the auction…</div></div>`;
  const currentId = a.order[a.index];
  const onBlock = !a.done && currentId;

  const log = a.log.slice(-8).reverse().map(l=>
    `<li>${l.free? '🎁 ':'💰 '}<b>${esc(playerName(l.playerId))}</b> → Team ${l.team.toUpperCase()} ${l.free? '(free — leftover)':'for ₹'+l.price}</li>`
  ).join('');

  return `
  <div class="panel">
    <div class="panel-title">Live auction</div>
    <div class="panel-sub">Best-ranked players go up first · ${a.index}/${a.order.length} decided</div>
    ${(myTeamRole() && !a.done) ? `<div class="row" style="gap:8px; margin:-2px 0 12px; flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm" onclick="toggleAlerts()">${alertsOn ? '🔔 Turn alerts: on' : '🔕 Turn alerts: off'}</button>
      <span class="panel-sub" style="margin:0;">Buzz, beep and flash on your turn · screen stays awake</span>
    </div>` : ''}
    <div class="auction-scoreboard">
      ${capCardHtml('a')}
      <div class="block-card">
        ${onBlock ? `
          <div class="tag">On the block</div>
          <div class="name">${esc(playerName(currentId))} ${posBadges(currentId)}${starBadge(currentId)}${chemBadge(currentId)}</div>
          ${attrChips(currentId)}
          <div class="price">₹${a.currentBid}</div>
          <div class="leader">${a.leader ? 'Leading: Team '+a.leader.toUpperCase()+' at ₹'+a.pendingLeaderPrice : 'No bids yet'}</div>
          ${timerHtml(a)}
        ` : `<div class="tag">Auction complete</div><div class="name">🏁</div>`}
      </div>
      ${capCardHtml('b')}
    </div>
    ${renderAuctionActions()}
    ${a.note && !a.done ? `<div class="banner amber" style="margin-top:10px;">⏱ ${esc(a.note)}</div>` : ''}
    ${(isHost() && !a.done) ? `<div class="row" style="gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap;">
      <span class="panel-sub" style="margin:0;">⏱ Time per decision</span>
      <select class="field-input" style="width:auto;" onchange="setTimerSecs(Number(this.value))">
        ${[[0,'No timer'],[20,'20 s'],[30,'30 s'],[45,'45 s'],[60,'60 s']].map(o=>`<option value="${o[0]}" ${(S.timerSecs||0)===o[0]?'selected':''}>${o[1]}</option>`).join('')}
      </select>
    </div>` : ''}
    ${a.done ? shareButtonsHtml() : ''}
  </div>

  <div class="panel log-panel">

/* ---- Complete: final teams + optional match result ---- */
function renderComplete(){
  const {teamAIds, teamBIds, subIds} = getCompleteTeamIds();
  let capA=null, capB=null, priceOf=()=>null;
  if(S.mode==='draft' && S.auction){
    capA = S.captains.a; capB = S.captains.b;
    const priceMap = {};
    S.auction.log.forEach(l=>{ priceMap[l.playerId] = l; });
    priceOf = (id)=> priceMap[id];

  function list(ids, capId){
    return `<ul>${ids.map(id=>{
      const rec = priceOf(id);

      return `<li><span>${nameLink(id)} ${posBadges(id)}${starBadge(id)}${chemBadge(id)}${isCap?'<span class="cap-tag">C</span>':''}</span>${rec && !isCap ? `<span class="price">${rec.free?'free':'₹'+rec.price}</span>`:''}</li>`;

  ${renderResultForm(teamAIds, teamBIds)}

/* ---- History modal (host can edit or delete a past match's details) ---- */
function toggleHistory(){ showHistory = !showHistory; editingHistoryId = null; historyEditDraft = null; pendingDeleteId = null; render(); }

function startEditHistory(id){
  const h = HISTORY.find(x=>x.id===id);
  if(!h) return;
  editingHistoryId = id;
  pendingDeleteId = null;
  historyEditDraft = {
    winner: h.winner || null,
    scoreA: h.scoreA!=null ? String(h.scoreA) : '',
    scoreB: h.scoreB!=null ? String(h.scoreB) : '',
    duration: h.duration!=null ? String(h.duration) : '',
    scorers: (h.scorers||[]).map(s=>({playerId:s.playerId, goals:s.goals})),
    assists: (h.assists||[]).map(a=>({playerId:a.playerId, assists:a.assists}))
  };
  render();
}
function cancelEditHistory(){ editingHistoryId = null; historyEditDraft = null; render(); }
function setHistEditWinner(w){ historyEditDraft.winner = (historyEditDraft.winner===w) ? null : w; render(); }
function histEditAddScorerRow(){ historyEditDraft.scorers.push({playerId:'', goals:1}); render(); }
function histEditRemoveScorerRow(i){ historyEditDraft.scorers.splice(i,1); render(); }
function histEditSetScorerPlayer(i, id){ historyEditDraft.scorers[i].playerId = id; }
function histEditSetScorerGoals(i, val){ historyEditDraft.scorers[i].goals = Number(val)||1; }
function histEditAddAssistRow(){ historyEditDraft.assists.push({playerId:'', assists:1}); render(); }
function histEditRemoveAssistRow(i){ historyEditDraft.assists.splice(i,1); render(); }
function histEditSetAssistPlayer(i, id){ historyEditDraft.assists[i].playerId = id; }
function histEditSetAssistCount(i, val){ historyEditDraft.assists[i].assists = Number(val)||1; }

// Editing re-derives every stat/chemistry effect from scratch: undo what the
// old recorded result contributed, then apply the edited one. See
// revertMatchOutcome's note — rank ORDER itself isn't rewound, only counters
// and chemistry.
function saveEditHistory(id){
  const h = HISTORY.find(x=>x.id===id);
  if(!h || !historyEditDraft) return;
  revertMatchOutcome(h);
  const scoreA = historyEditDraft.scoreA===''? null : Number(historyEditDraft.scoreA);
  const scoreB = historyEditDraft.scoreB===''? null : Number(historyEditDraft.scoreB);
  const duration = historyEditDraft.duration===''? null : Number(historyEditDraft.duration);
  const scorers = historyEditDraft.scorers.filter(s=>s.playerId && s.goals>0);
  const assists = historyEditDraft.assists.filter(a=>a.playerId && a.assists>0);
  updateHistoryResult(id, {winner:historyEditDraft.winner, scoreA, scoreB, duration, scorers, assists});
  applyMatchOutcome(h.teamAIds||[], h.teamBIds||[], historyEditDraft.winner, scorers, scoreA, scoreB, duration, assists);
  editingHistoryId = null;
  historyEditDraft = null;
  render();
}

function askDeleteHistory(id){ pendingDeleteId = id; editingHistoryId = null; render(); }
function cancelDeleteHistory(){ pendingDeleteId = null; render(); }
function confirmDeleteHistory(id){
  const h = HISTORY.find(x=>x.id===id);
  if(h) revertMatchOutcome(h);
  deleteHistoryDoc(id);
  pendingDeleteId = null;
  render();
}

      <button class="icon-btn" onclick="histEditRemoveAssistRow(${i})">✕</button>
    </div>`).join('');
  return `

// Everything below comes from saved match history, newest first.
function computeProfile(id){
  const out = {played:0, wins:0, draws:0, losses:0, goals:0, assists:0, potm:0, form:[], mates:{}};
  HISTORY.forEach(h=>{
    const A = h.teamAIds||[], B = h.teamBIds||[];
    const inA = A.includes(id), inB = B.includes(id);
    if(!inA && !inB) return;
    out.played++;
    let res = null;
    if(h.winner==='draw') res = 'D';
    else if(h.winner==='a' || h.winner==='b') res = ((h.winner==='a') === inA) ? 'W' : 'L';
    if(res==='W') out.wins++; else if(res==='L') out.losses++; else if(res==='D') out.draws++;
    if(res && out.form.length < 5) out.form.push(res);
    (h.scorers||[]).forEach(s=>{ if(s.playerId===id) out.goals += (s.goals||0); });
    (h.assists||[]).forEach(a=>{ if(a.playerId===id) out.assists += (a.assists||0); });
    ['a','b'].forEach(t=>{ const w = computePotmWinner(h,t); if(w && !w.tied && w.leaders[0]===id) out.potm++; });
    if(res){
      (inA ? A : B).forEach(m=>{
        if(m===id || isGuest(m) || !findPlayer(m)) return;
        const r = out.mates[m] || (out.mates[m] = {g:0, w:0});
        r.g++; if(res==='W') r.w++;
      });
    }
  });
  return out;
}
const PROFILE_MATCHES_SHOWN = 5;
function potmLineHtml(h, me){
  const part = t=>{
    const w = computePotmWinner(h, t);
    if(!w) return null;
    const names = w.leaders.map(id=> id===me ? `<b>⭐ ${esc(playerName(id))}</b>` : esc(playerName(id))).join(' / ');
    return `${names} <small>(Team ${t.toUpperCase()}${w.tied?', tied':''})</small>`;
  };
  const bits = [part('a'), part('b')].filter(Boolean);
  return bits.length ? bits.join(' · ') : '<span style="color:var(--chalk-faint);">no votes yet</span>';
}
function priceLineHtml(h, id){
  if(h.mode!=='draft') return '';
  const cap = h.captainIds || {};
  if(cap.a===id || cap.b===id) return `<div class="pm-sub">🧢 Captain</div>`;
  if(!h.prices) return `<div class="pm-sub" style="color:var(--chalk-faint);">💰 Price not recorded (drafted before prices were saved)</div>`;
  const mine = h.prices[id];
  if(!mine) return '';
  if(mine.f) return `<div class="pm-sub">💰 Free pick (handed out when the auction was finished early)</div>`;
  const max = Math.max(0, ...Object.values(h.prices).map(x=>(x && !x.f) ? (x.p||0) : 0));
  const top = mine.p>0 && mine.p===max;
  return `<div class="pm-sub">💰 Bought for <b>₹${mine.p}</b>${top ? '<span class="hi-badge">Highest</span>' : ''}</div>`;
}

/* ============================= Your-turn alerts ============================= */
// A captain's phone buzzes, beeps and flashes a banner the moment it's their
// turn to bid, and the screen is kept awake during the auction so a locked
// phone doesn't leave the other captain waiting.
let audioCtx = null, lastTurnKey = null, titleTimer = null, wakeLock = null, wakeLockBusy = false;
const baseTitle = document.title;
function unlockAudio(){
  try{
    if(!audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) audioCtx = new AC(); }
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}
function beep(){
  if(!audioCtx) return;
  try{
    const t = audioCtx.currentTime;
    [[880,0],[1175,0.18]].forEach(([f,d])=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t+d);
      g.gain.exponentialRampToValueAtTime(0.28, t+d+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+d+0.35);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t+d); o.stop(t+d+0.4);
    });
  }catch(e){}
}
function buzz(){ try{ if(navigator.vibrate) navigator.vibrate([220,90,220,90,420]); }catch(e){} }
function myTurnInfo(){
  const a = S.auction;
  if(S.phase!=='auction' || !a || a.done) return null;
  const t = myTeamRole();
  if(!t || a.turn!==t) return null;
  const capA = a.capA || S.format, capB = a.capB || S.format;
  if(teamFull(a.teamA,capA) !== teamFull(a.teamB,capB)) return null;   // roster is auto-filling, nobody to act
  const cur = a.order[a.index];
  return {team:t, bid:a.currentBid, player: cur ? playerName(cur) : ''};
}
function notifyTurn(info){
  try{
    if(!document.hidden || !('Notification' in window) || Notification.permission!=='granted') return;
    const body = (info.player ? info.player + ' is on the block — ' : '') + 'bid ₹' + info.bid + ' or pass.';
    const opts = {body, tag:'md-turn', renotify:true, icon:'icon-192.png', vibrate:[200,100,200]};
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(reg=>{
        if(reg && reg.showNotification) reg.showNotification('Your turn ⚽', opts); else new Notification('Your turn ⚽', opts);
      }).catch(()=>{});
    }else new Notification('Your turn ⚽', opts);
  }catch(e){}
}
function closeTurnNotifications(){
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(reg=>{
        if(reg && reg.getNotifications) reg.getNotifications({tag:'md-turn'}).then(l=>l.forEach(n=>n.close()));
      }).catch(()=>{});
    }
  }catch(e){}
}
function startTitleFlash(){
  if(titleTimer) return;
  let on = false;
  titleTimer = setInterval(()=>{ on = !on; document.title = on ? '🔔 YOUR TURN!' : baseTitle; }, 1000);
}
function stopTitleFlash(){
  if(titleTimer){ clearInterval(titleTimer); titleTimer = null; }
  document.title = baseTitle;
}
async function syncWakeLock(want){
  try{
    if(want){
      if(!wakeLock && !wakeLockBusy && navigator.wakeLock && !document.hidden){
        wakeLockBusy = true;
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
      }
    }else if(wakeLock){
      const w = wakeLock; wakeLock = null; await w.release();
    }
  }catch(e){ wakeLock = null; }
  wakeLockBusy = false;
}
function checkTurnAlert(){
  const info = myTurnInfo();
  if(info){
    const a = S.auction;
    const key = [a.index, a.currentBid, a.turn, a.leader||''].join('|');
    if(key !== lastTurnKey){
      lastTurnKey = key;
      if(alertsOn){ buzz(); beep(); notifyTurn(info); }
      // a captain browsing the leaderboard/profile gets pulled back to the auction
      if(currentPage()!=='home') setTimeout(goHome, 0);
    }
    if(document.hidden && alertsOn) startTitleFlash();
  }else{
    if(lastTurnKey!==null) closeTurnNotifications();
    lastTurnKey = null;
    stopTitleFlash();
  }
  syncWakeLock(!!myTeamRole() && S.phase==='auction' && !!S.auction && !S.auction.done);
}
function renderTurnBanner(){
  const i = myTurnInfo();

}
function toggleAlerts(){

  unlockAudio();

/* ---- auction countdown ----
   Each phone times a turn from the moment it sees that turn begin (no shared clock needed).
   The captain whose turn it is auto-passes at zero; the host and the other captain back that up
   a few seconds later in case that phone is asleep. Friends watching never write anything. */
function auctionBothOpen(a){
  const capA = a.capA || S.format, capB = a.capB || S.format;
  return teamFull(a.teamA,capA) === teamFull(a.teamB,capB);
}
function syncTimerKey(){
  const a = S.auction;
  const key = a ? [a.index, a.currentBid, a.turn, a.leader||'', a.passesInARow||0].join('|') : '';
  if(key !== timerKey){ timerKey = key; timerStart = Date.now(); timerFiredAt = 0; }
}
function timerActive(){
  const a = S.auction;
  return !!(S.timerSecs > 0 && S.phase==='auction' && a && !a.done && auctionBothOpen(a));
}
function timerLeft(){
  syncTimerKey();
  return Math.max(0, (S.timerSecs||0) - (Date.now() - timerStart) / 1000);
}
function timerHtml(a){
  if(!timerActive()) return '';
  const left = timerLeft(), pct = Math.round(100 * left / S.timerSecs);
  return `<div class="turn-timer ${left<=5?'urgent':''}" id="turnTimer">
    <div class="tt-label"><span>Team ${a.turn.toUpperCase()} to decide</span><b id="ttText">${Math.ceil(left)}s</b></div>
    <div class="tt-bar"><i id="ttBar" style="width:${pct}%"></i></div>
  </div>`;
}
function setTimerSecs(n){ saveState({timerSecs: Number(n)||0}); }
function tickTimer(){
  if(!timerActive()) return;
  const a = S.auction;
  const left = timerLeft();
  const t = document.getElementById('ttText'); if(t) t.textContent = Math.ceil(left) + 's';
  const bar = document.getElementById('ttBar'); if(bar) bar.style.width = Math.round(100*left/S.timerSecs) + '%';
  const box = document.getElementById('turnTimer'); if(box) box.classList.toggle('urgent', left<=5);
  const tb = document.getElementById('tbTimer'); if(tb) tb.textContent = '⏱ ' + Math.ceil(left) + 's';
  const mine = myTeamRole() === a.turn;
  if(mine && left>0 && left<=5 && timerWarnKey!==timerKey){
    timerWarnKey = timerKey;
    if(alertsOn){ try{ if(navigator.vibrate) navigator.vibrate(120); }catch(e){} }
  }
  if(left > 0) return;
  const overdue = (Date.now() - timerStart)/1000 - S.timerSecs;
  const canBackUp = isHost() || !!myTeamRole();
  if(((mine && overdue >= 0) || (canBackUp && overdue >= 3.5)) && Date.now() - timerFiredAt > 5000){
    timerFiredAt = Date.now();
    auctionPass(a.turn, true);
  }
}
setInterval(tickTimer, 500);

function setStatsScope(k){ statsScope = k; showAwardsCard = false; render(); }
function statsSeasonYear(){ return statsSeason || String(new Date().getFullYear()); }
function statsSeasonPrev(){ statsSeason = String(Number(statsSeasonYear()) - 1); render(); }
function statsSeasonNext(){ statsSeason = String(Number(statsSeasonYear()) + 1); render(); }
function statsSeasonReset(){ statsSeason = null; render(); }
function statsScopeInfo(){
  if(statsScope==='season'){
    const y = statsSeasonYear();
    return {kind:'season', entries: HISTORY.filter(h=> String(new Date(h.date).getFullYear())===y), title:'Season ' + y, empty:'No matches recorded in ' + y + ' yet.'};
  }
  if(statsScope==='all'){
    return {kind:'all', entries: HISTORY.slice(), title:'All-time', empty:'No matches recorded yet.'};
  }
  const month = statsMonth || currentYearMonth();
  return {kind:'month', month, entries: historyForMonth(month), title: formatYearMonth(month), empty:'No matches recorded in ' + formatYearMonth(month) + ' yet.'};
}
function longestWinStreak(id, entries){
  let best = 0, cur = 0;
  entries.slice().reverse().forEach(h=>{   // oldest first
    const inA = (h.teamAIds||[]).includes(id), inB = (h.teamBIds||[]).includes(id);
    if(!inA && !inB) return;
    if(!h.winner) return;
    const won = (inA && h.winner==='a') || (inB && h.winner==='b');
    if(won){ cur++; if(cur>best) best = cur; } else cur = 0;
  });
  return best;
}
function computeRecords(entries, minGames){
  const stats = computeMonthlyStats(entries);
  const ids = Object.keys(stats);
  const out = [];
  const top = (icon, label, fn, fmt, min)=>{
    let best = -Infinity, holders = [];
    ids.forEach(id=>{ const v = fn(id); if(v>best){ best = v; holders = [id]; } else if(v===best) holders.push(id); });
    if(holders.length && best >= (min==null ? 1 : min)) out.push({icon, label, value: fmt ? fmt(best) : String(best), holders});
  };
  top('⚽', 'Most goals', id=>stats[id].goals);
  top('🅰️', 'Most assists', id=>stats[id].assists);
  top('🏆', 'Most wins', id=>stats[id].wins);
  top('👟', 'Most matches', id=>stats[id].played);
  top('📈', 'Best win rate', id=> stats[id].played>=minGames ? Math.round(100*stats[id].wins/stats[id].played) : -1, v=>v+'%', 0);
  top('🔥', 'Longest win streak', id=>longestWinStreak(id, entries), v=>v+' in a row', 2);
  const potm = computeMonthlyPotmCounts(entries);
  top('🏅', 'Most POTMs', id=>potm[id]||0);
  // single-match feats
  let bestGoals = 0, goalHolders = [];
  entries.forEach(h=>(h.scorers||[]).forEach(s=>{
    if(!s.playerId || isGuest(s.playerId) || !s.goals) return;
    if(s.goals>bestGoals){ bestGoals = s.goals; goalHolders = [s.playerId]; }
    else if(s.goals===bestGoals && !goalHolders.includes(s.playerId)) goalHolders.push(s.playerId);
  }));
  if(bestGoals>=2) out.push({icon:'🎯', label:'Most goals in a match', value:bestGoals+' goals', holders:goalHolders});
  let bigMargin = 0, bigH = null, highTotal = 0, highH = null;
  entries.forEach(h=>{
    if(typeof h.scoreA!=='number' || typeof h.scoreB!=='number') return;
    const m = Math.abs(h.scoreA - h.scoreB), tot = h.scoreA + h.scoreB;
    if(m>bigMargin){ bigMargin = m; bigH = h; }
    if(tot>highTotal){ highTotal = tot; highH = h; }
  });
  const dstr = h=> new Date(h.date).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
  if(bigH && bigMargin>=2) out.push({icon:'💥', label:'Biggest win', value:Math.max(bigH.scoreA,bigH.scoreB)+'–'+Math.min(bigH.scoreA,bigH.scoreB), holders:[], note:'Team '+(bigH.scoreA>bigH.scoreB?'A':'B')+' · '+dstr(bigH)});
  if(highH && highTotal>=4) out.push({icon:'🎆', label:'Highest-scoring game', value:highTotal+' goals', holders:[], note:highH.scoreA+'–'+highH.scoreB+' · '+dstr(highH)});
  return out;
}
function renderRecordsHtml(entries, kind){
  const recs = computeRecords(entries, kind==='all' ? 5 : 3);
  if(!recs.length) return '';
  return `<div class="rec-title">${kind==='all' ? '🏛 Hall of fame' : '⭐ Season highlights'}</div>
  <div class="rec-grid">${recs.map(r=>`
    <div class="rec-card">
      <div class="rl">${r.icon} ${esc(r.label)}</div>
      <div class="rv">${esc(r.value)}</div>
      <div class="rn">${r.holders.length ? r.holders.map(id=>nameLink(id)).join(' &amp; ') : esc(r.note||'')}</div>
    </div>`).join('')}</div>`;
}

/* ============================= Head-to-head & rivalries ============================= */
function h2hRecord(x, y, sinceIso){
  const out = {games:0, xw:0, yw:0, d:0};
  const since = sinceIso ? new Date(sinceIso).getTime() : 0;
  HISTORY.forEach(h=>{
    if(since && new Date(h.date).getTime() < since) return;
    if(!h.winner) return;
    const A = h.teamAIds||[], B = h.teamBIds||[];
    const xA = A.includes(x), xB = B.includes(x), yA = A.includes(y), yB = B.includes(y);
    if(!((xA && yB) || (xB && yA))) return;
    out.games++;
    if(h.winner==='draw') out.d++;
    else if((h.winner==='a') === xA) out.xw++;
    else out.yw++;
  });
  return out;
}
function h2hList(id){
  const rows = [];
  allPlayersArr().forEach(o=>{
    if(o.id===id || isGuest(o.id)) return;
    const r = h2hRecord(id, o.id);
    if(r.games>0) rows.push(Object.assign({id:o.id}, r));
  });
  rows.sort((a,b)=> b.games-a.games || playerName(a.id).localeCompare(playerName(b.id)));
  return rows;
}
function rivalKey(x, y){ return [x,y].sort().join('__'); }
function rivalryBetween(x, y){ return RIVALS.find(r=>r.id===rivalKey(x,y)); }
function incomingRequests(id){ return db && id ? RIVALS.filter(r=>r.status==='pending' && r.b===id) : []; }
function outgoingRequests(id){ return db && id ? RIVALS.filter(r=>r.status==='pending' && r.a===id) : []; }
function activeRivalries(id){ return RIVALS.filter(r=>r.status==='active' && (!id || r.a===id || r.b===id)); }
function rivalCooldown(r){
  return !!(r && r.status==='declined' && r.endedAt && Date.now() - new Date(r.endedAt).getTime() < 24*36e5);
}
function sendRivalry(targetId){
  const me = getMyPlayerId();
  if(!db || !me || me===targetId || !findPlayer(targetId)) return;
  const ex = rivalryBetween(me, targetId);
  if(ex && (ex.status==='pending' || ex.status==='active' || rivalCooldown(ex))) return;
  db.doc(squadPath('rivalries/' + rivalKey(me, targetId))).set({a:me, b:targetId, status:'pending', createdAt:new Date().toISOString()}).catch(()=>{});
}
function sendRivalryFromSelect(){
  const el = document.getElementById('rivalPick');
  if(el && el.value) sendRivalry(el.value);
}
function respondRivalry(id, accept){
  const r = RIVALS.find(x=>x.id===id);
  const me = getMyPlayerId();
  if(!db || !r || r.status!=='pending' || (r.b!==me && !isHost())) return;
  const now = new Date().toISOString();
  db.doc(squadPath('rivalries/' + id)).update(accept ? {status:'active', startedAt:now} : {status:'declined', endedAt:now}).catch(()=>{});
}
function withdrawRivalry(id){
  const r = RIVALS.find(x=>x.id===id);
  const me = getMyPlayerId();
  if(!db || !r || r.status!=='pending' || (r.a!==me && !isHost())) return;
  db.doc(squadPath('rivalries/' + id)).delete().catch(()=>{});
}
function endRivalry(id){
  const r = RIVALS.find(x=>x.id===id);
  const me = getMyPlayerId();
  if(!db || !r || r.status!=='active' || (r.a!==me && r.b!==me && !isHost())) return;
  if(rivalArm !== id){
    rivalArm = id; render();
    setTimeout(()=>{ if(rivalArm===id){ rivalArm = null; render(); } }, 4000);
    return;
  }
  rivalArm = null;
  db.doc(squadPath('rivalries/' + id)).update({status:'ended', endedAt:new Date().toISOString()}).catch(()=>{});
}
function rivalCardHtml(r){
  const rec = h2hRecord(r.a, r.b, r.startedAt), all = h2hRecord(r.a, r.b);
  const me = getMyPlayerId();
  const since = r.startedAt ? new Date(r.startedAt).toLocaleDateString(undefined,{day:'numeric',month:'short'}) : '';
  const canEnd = isHost() || me===r.a || me===r.b;
  return `<div class="riv-card">
    <div class="riv-score"><span>${nameLink(r.a)}</span><span class="sc">${rec.xw} – ${rec.yw}</span><span style="text-align:right;">${nameLink(r.b)}</span></div>
    <div class="panel-sub">Since ${esc(since)} · ${rec.games} meeting${rec.games===1?'':'s'}${rec.d ? ' · '+rec.d+' draw'+(rec.d===1?'':'s') : ''} · all-time ${all.xw}–${all.yw}${all.d ? ' ('+all.d+' drawn)' : ''}</div>
    ${canEnd ? `<button class="btn btn-sm btn-ghost" onclick="endRivalry('${r.id}')">${rivalArm===r.id ? 'Tap again to end it' : 'End rivalry'}</button>` : ''}
  </div>`;
}
function renderRivalsBoard(){
  const act = activeRivalries().map(r=>({r, n:h2hRecord(r.a,r.b,r.startedAt).games})).sort((x,y)=>y.n-x.n).map(x=>x.r);
  return `<div class="panel-sub">Friendly feuds. A rivalry only counts matches played after both sides agreed to it.</div>
  ${act.length ? act.map(rivalCardHtml).join('') : `<div class="empty-note">No rivalries yet. Open your own profile and tap <b>Rivals</b> to challenge someone.</div>`}`;
}
function renderRivalBanner(){
  const me = getMyPlayerId();
  if(!db || !me) return '';
  return incomingRequests(me).map(r=>`<div class="banner amber" style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
    <span>⚔️ <b>${esc(playerName(r.a))}</b> challenged you to a rivalry.</span>
    <span class="row-controls"><button class="btn btn-sm btn-primary" onclick="respondRivalry('${r.id}',true)">Accept</button><button class="btn btn-sm btn-ghost" onclick="respondRivalry('${r.id}',false)">Decline</button></span>
  </div>`).join('');
}
function profileTabsHtml(p, isMe){
  const n = isMe ? incomingRequests(p.id).length : 0;
  return `<div class="scope-tabs">
    <button class="toggle-btn ${profileTab==='stats'?'active':''}" onclick="setProfileTab('stats')">Stats</button>
    <button class="toggle-btn ${profileTab==='rivals'?'active':''}" onclick="setProfileTab('rivals')">⚔️ Rivals${n ? ' ('+n+')' : ''}</button>
  </div>`;
}
function setProfileTab(t){ profileTab = t; render(); }
function rivalsTabHtml(p, isMe){
  const me = getMyPlayerId();
  const rows = h2hList(p.id);
  let html = '';
  if(db){
    if(isMe){
      incomingRequests(p.id).forEach(r=>{
        html += `<div class="riv-card"><div class="panel-sub" style="margin:0 0 8px;">⚔️ <b>${esc(playerName(r.a))}</b> wants a rivalry with you.</div>
          <span class="row-controls"><button class="btn btn-sm btn-primary" onclick="respondRivalry('${r.id}',true)">Accept</button><button class="btn btn-sm btn-ghost" onclick="respondRivalry('${r.id}',false)">Decline</button></span></div>`;
      });
      outgoingRequests(p.id).forEach(r=>{
        html += `<div class="riv-card"><div class="panel-sub" style="margin:0 0 8px;">Waiting for <b>${esc(playerName(r.b))}</b> to accept…</div>
          <button class="btn btn-sm btn-ghost" onclick="withdrawRivalry('${r.id}')">Withdraw request</button></div>`;
      });
    }
    const act = activeRivalries(p.id);
    html += `<div class="pf-section">Rivalries</div>`;
    html += act.length ? act.map(rivalCardHtml).join('') : `<div class="empty-note">No active rivalries${isMe ? ' — challenge someone below.' : '.'}</div>`;
    if(isMe){
      const nem = rows.filter(r=> r.yw - r.xw >= 2 && r.games >= 3 && !rivalryBetween(p.id, r.id)).slice(0,2);
      nem.forEach(r=>{
        html += `<div class="nemesis"><span>😤 <b>${esc(playerName(r.id))}</b> keeps beating you (${r.xw}–${r.yw}).</span><button class="btn btn-sm" onclick="sendRivalry('${r.id}')">Start a rivalry</button></div>`;
      });
      const cands = allPlayersArr().filter(o=>!isGuest(o.id) && o.id!==p.id && !(rivalryBetween(p.id,o.id) && ['pending','active'].includes(rivalryBetween(p.id,o.id).status)) && !rivalCooldown(rivalryBetween(p.id,o.id)));
      if(cands.length){
        html += `<div class="pf-section">Challenge someone</div>
        <div class="login-row"><select id="rivalPick" class="field-input grow" style="min-width:0;">${cands.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select>
        <button class="btn btn-primary" style="flex:none; white-space:nowrap;" onclick="sendRivalryFromSelect()">⚔️ Send</button></div>
        <div class="panel-sub" style="margin-top:6px;">They have to accept before it starts.</div>`;
      }
    }else if(me && me!==p.id){
      const ex = rivalryBetween(me, p.id);
      if(!ex || ex.status==='declined' || ex.status==='ended'){
        html += rivalCooldown(ex)
          ? `<div class="panel-sub" style="margin-top:8px;">${esc(p.name)} declined a recent request — try again tomorrow.</div>`
          : `<div style="margin-top:8px;"><button class="btn btn-sm" onclick="sendRivalry('${p.id}')">⚔️ Challenge ${esc(p.name)} to a rivalry</button></div>`;
      }else if(ex.status==='pending'){
        html += ex.a===me
          ? `<div class="panel-sub" style="margin-top:8px;">Request sent — waiting for ${esc(p.name)}. <button class="btn btn-sm btn-ghost" onclick="withdrawRivalry('${ex.id}')">Withdraw</button></div>`
          : `<div style="margin-top:8px;" class="row-controls"><button class="btn btn-sm btn-primary" onclick="respondRivalry('${ex.id}',true)">Accept ${esc(p.name)}'s challenge</button><button class="btn btn-sm btn-ghost" onclick="respondRivalry('${ex.id}',false)">Decline</button></div>`;
      }
    }
  }
  html += `<div class="pf-section">Head-to-head ${isMe ? '(you vs everyone)' : 'for ' + esc(p.name)}</div>`;
  html += rows.length ? rows.map(r=>`
    <div class="h2h-row">
      <div>${nameLink(r.id)}<small>${r.games} meeting${r.games===1?'':'s'} on opposite teams</small></div>
      <div class="h2h-rec" style="color:${r.xw>r.yw?'var(--good)':r.xw<r.yw?'var(--danger)':'var(--chalk-dim)'};">${r.xw}–${r.d}–${r.yw}</div>
    </div>`).join('') + `<div class="panel-sub" style="margin-top:6px;">Wins–draws–losses against each player, from ${isMe ? 'your' : esc(p.name)+'\\u2019s'} side.</div>`
    : `<div class="empty-note">No matches against other players recorded yet.</div>`;
  return html;
}

/* ============================= Attendance (host) ============================= */
function toggleAttendance(){ showAttendance = !showAttendance; render(); }
function attPlayed(h, id){ return (h.teamAIds||[]).includes(id) || (h.teamBIds||[]).includes(id) || (h.subIds||[]).includes(id); }
function attInvolved(h, id){
  return attPlayed(h,id) || !!(h.att && ((h.att.expected||[]).includes(id) || (h.att.dropped||[]).some(d=>d.id===id)));
}
function computeAttendance(){
  const win = HISTORY.slice(0, ATT_WINDOW);
  return allPlayersArr().filter(p=>!isGuest(p.id)).map(p=>{
    let oldest = -1;
    win.forEach((h,i)=>{ if(attInvolved(h,p.id)) oldest = i; });
    const olderExists = HISTORY.slice(ATT_WINDOW).some(h=>attInvolved(h,p.id));
    const opp = olderExists ? win.length : (oldest>=0 ? oldest+1 : 0);
    const span = win.slice(0, opp);
    let played = 0, late = 0, streak = 0, last = null;
    span.forEach(h=>{
      if(attPlayed(h,p.id)){ played++; if(!last) last = h.date; }
      if(h.att && (h.att.dropped||[]).some(d=>d.id===p.id && d.late)) late++;
    });
    for(const h of span){ if(attPlayed(h,p.id)) streak++; else break; }
    const pct = opp ? Math.round(100*played/opp) : null;
    let status = 'ok';
    if(!opp) status = 'new';
    else if(late>=2 || (opp>=3 && pct<50)) status = 'bad';
    else if(late===1 || (opp>=3 && pct<80)) status = 'mid';
    return {id:p.id, name:p.name, unavailable:!!p.unavailable, opp, played, late, streak, pct, last, status};
  });
}
const ATT_LABEL = {ok:'🟢 Reliable', mid:'🟡 Patchy', bad:'🔴 Flaky', new:'⚪ New'};
function attendanceLineHtml(id){
  const r = computeAttendance().find(x=>x.id===id);
  if(!r || !r.opp) return '';
  return `<div class="pf-section">Your attendance</div>
    <div class="panel-sub" style="margin:0;">Played ${r.played} of the last ${r.opp} · ${r.late} late drop-out${r.late===1?'':'s'} · <span class="st-chip ${r.status}">${ATT_LABEL[r.status]}</span></div>`;
}
function renderAttendanceModal(){
  if(!showAttendance) return '';
  if(!isHost()){ showAttendance = false; return ''; }
  const rows = computeAttendance();
  const order = {bad:0, mid:1, ok:2, new:3};
  rows.sort((x,y)=> order[x.status]-order[y.status] || ((x.pct==null?101:x.pct)-(y.pct==null?101:y.pct)) || x.name.localeCompare(y.name));
  const dropsNow = liveDrops();
  const inNow = (S.selectedIds||[]).filter(id=>!isGuest(id) && findPlayer(id)).length;
  const ago = iso=>{ const m = Math.round((Date.now()-new Date(iso).getTime())/60000); return m<60 ? m+' min ago' : Math.round(m/60)+' h ago'; };
  return `
  <div class="modal-backdrop" onclick="if(event.target===this) toggleAttendance();">
    <div class="modal" style="max-width:560px;">
      <div class="row" style="justify-content:space-between; margin-bottom:4px;">
        <div class="panel-title" style="margin:0;">📋 Attendance</div>
        <button class="icon-btn" onclick="toggleAttendance()">✕</button>
      </div>
      <div class="panel-sub">Who turns up and who bails, over the last ${ATT_WINDOW} matches (counted from each player's first one). A <b>late drop-out</b> is someone who ticked in, then out again within ${LATE_HOURS} hours of you locking the squad.</div>
      <div class="host-detail" style="display:block; margin-bottom:10px;"><b>${inNow}</b> in for today${dropsNow.length ? ' · dropped out: ' + dropsNow.map(d=>esc(playerName(d.id))+(d.late?' (late':' (')+', '+ago(d.at)+')').join(', ') : ' · nobody has dropped out'}</div>
      ${HISTORY.length ? `
      <div class="att-row head"><span>Player</span><span class="num">Played</span><span class="num">Late</span><span>Status</span></div>
      ${rows.map(r=>`
      <div class="att-row" style="${r.unavailable?'opacity:.55;':''}">
        <span>${nameLink(r.id)}<small>${r.last ? 'Last played '+esc(new Date(r.last).toLocaleDateString(undefined,{day:'numeric',month:'short'}))+(r.streak>1?' · '+r.streak+' in a row':'') : 'No matches yet'}</small></span>
        <span class="num">${r.opp ? r.played+'/'+r.opp+'<small>'+r.pct+'%</small>' : '–'}</span>
        <span class="num" style="${r.late?'color:var(--danger);':''}">${r.late}</span>
        <span><span class="st-chip ${r.status}">${ATT_LABEL[r.status]}</span></span>
      </div>`).join('')}` : `<div class="empty-note">No matches recorded yet — attendance builds up as you save them.</div>`}
      <div class="panel-sub" style="margin-top:10px;">Reliable: 80%+ and no late drop-outs. Patchy: under 80%, or one late drop-out. Flaky: under 50%, or two or more late drop-outs.</div>
    </div>
  </div>`;
}

/* ============================= Boot ============================= */
['pointerdown','keydown','touchstart'].forEach(ev=> document.addEventListener(ev, unlockAudio, {passive:true}));
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden){ stopTitleFlash(); checkTurnAlert(); checkForUpdate(); }
  else if(myTurnInfo() && alertsOn) startTitleFlash();
});
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstall = e; render(); });
window.addEventListener('appinstalled', ()=>{ deferredInstall = null; render(); });
try{
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.addEventListener('message', e=>{
      if(e.data && e.data.type==='md-updated'){ updateReady = true; render(); }
    });
    window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); setTimeout(checkForUpdate, 3000); });
  }
}catch(e){}
render();
initDb();
</script>
